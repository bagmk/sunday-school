<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060b15">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>새벽 3시 · The Fourth Watch (휴대폰)</title>
<style>
  html, body { margin: 0; height: 100%; background: #060b15; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: absolute; left: 0; top: 0; display: block; outline: none; touch-action: none; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="c" tabindex="0" aria-label="새벽 3시 · The Fourth Watch"></canvas>
<script>
"use strict";

// Phone version: portrait, swipe controls. The simulation, swipe rules and sound are the same code as
// the keyboard version (index.html); only the layout, drawing and input wiring differ.

// ============================================================================
// Tunables
// ============================================================================
const CONFIG = {
  LANES: 8, LANE_H: 82, TOP_H: 210, COLS: 7, COL_W: 72,
  STEP_COOLDOWN_MS: 110,
  WORD_FIRST_AT_S: 6,      // first Word window after a turn starts
  WORD_INTERVAL_S: 10,     // adjustable 8-12 with +/- keys
  WORD_DURATION_S: 2.5,
  WORD_HOLD_ARM_S: 0.35,   // up must be pressed during a window and held this long
  WORD_WALK_CROSS_S: 5.0,  // time to cross all 8 lanes while holding up
  STILL_LIMIT_S: 2.0,      // standing still on the sea starts sinking
  PLAYER_TIME_S: 60,       // per-player turn, unlimited respawns
  // Lengths and speeds are the keyboard version's x 0.9 (columns are 72 px, not 80), so every gust
  // takes exactly as long to pass a column as it does there.
  LANE_SPEED: [81, 99, 117, 135, 157.5, 180, 207, 234],          // px/s, lane 1 -> 8
  GUST_LEN:   [108, 126, 126, 144, 153, 162, 171, 189],          // px, lane 1 -> 8
  SUDDEN_P:   [0, 0, 0, 0.15, 0.35, 0.55, 0.75, 1.0],            // lane 1 -> 8, normal mode only
  SUDDEN_TELEGRAPH_S: [0.7, 0.7, 0.7, 0.7, 0.6, 0.5, 0.45, 0.25],
  SINK_LINE: 'v31',        // 'v31' | 'v27' | 'alternate'
  RESPAWN_CALM_S: 1.0,

  // Additional tunables used by the implementation
  W: 540, H: 1080,
  SPRITE: 1.12,                // Peter and Jesus are drawn this much larger than in the keyboard version
  BOAT_Y: 898,                 // Peter's anchor (body centre) while standing in the boat
  BOAT_MAX_COL: 1,             // columns either side of the bow that are still on deck
  JESUS_FEET_Y: 198,
  GUST_GAP_S: [1.5, 3.5],      // random gap between traveling gusts
  GUST_GAP_SHRINK: 0.10,       // gap shrink per lane above lane 4
  GUST_LEN_JITTER: 0.12,       // +/- fraction of GUST_LEN for traveling gusts
  GUST_CORE_FRAC: 0.70,        // front part of a gust that collides
  GUST_CORE_HALF_H: 16,        // collision half-height around the lane centre
  HITBOX_W: 27, HITBOX_H: 40, HITBOX_DY: -18,   // Peter's body box relative to his anchor
  SUDDEN_LEAD_FRAC: 0.40,      // sudden gust forms with its leading end this far ahead of the column
  WIDE_GUST_LEN: 261,          // last-lane sudden gust: covers the column and both neighbours
  WIDE_GUST_LEAD: 90,
  WALK_EXIT_SUDDEN_P: 0.9,
  WALK_EXIT_TELEGRAPH_S: 0.5,
  // "Come": the wind flows on as always (same way, same speed), but its gusts are timed so that while He
  // speaks the way from the bow straight up to Him comes clear. Stepping out of the boat at the bow while He
  // speaks starts a run (Mt 14:29): no sudden gusts form on the way, the run goes on as long as each next
  // step up comes within RUN_GAP_S, and from the last lane a step up reaches Him. Stopping or stepping aside
  // ends it (and, as when he saw the wind, a sudden gust may come). Out on the sea, steps are ordinary.
  RUN_GAP_S: 0.5,
  WAY_START_S: 2.5,            // the way is clear for a run that leaves the bow while the bubble shows,
  WAY_PACE_S: 0.34,            // going up one lane every WAY_PACE_S or faster (three taps a second and a margin),
  WAY_PRE_S: 0.1,              // and this much more at both ends
  WAY_SPREAD_S: 0.4,           // held-back gusts come back up to this much later, so the wind does not return on a beat
  WAY_EDGE_PX: 10,             // the way: Peter's body width plus this much on each side
  WALK_FADE_RADIUS: 56,        // gusts this close to Peter's column fade during a Word Walk
  WALK_FADE_ALPHA: 0.15,
  WORD_INTERVAL_RANGE: [8, 12],
  DIFFICULTY: [0.85, 1.0, 1.15],   // presets on keys 1 / 2 / 3
  TIMEUP_S: 2.0,
  REACHED_S: 3.0,
  WHOOSH_DIST: 140,
  SINK_TIMELINE: { sinkEnd: 0.8, cry: 0.3, cryEnd: 1.3, handStart: 1.2, handEnd: 1.8,
                   lineStart: 1.8, lineEnd: 3.8, respawn: 4.15, end: 4.5 },
  VIGNETTE: [0.55, 0.72],
  PREWARM_S: 16,               // pre-simulate the wind so the sea is full when a turn starts
  SPAWN_MARGIN: 160,           // gusts enter and leave this far beyond the frame (long screens show more sea)
  // Touch (swipe) controls, in CSS px / seconds. A finger that comes down while He speaks and rests HOLD_S
  // holds ↑. "Next player" takes no touch for TURN_END_GRACE_S after it appears, so a student still
  // tapping at 0:00 does not start the next turn by accident.
  SWIPE_PX: 22, LOOK_PX: 40, TAP_S: 0.25, HOLD_S: 0.25, TURN_END_GRACE_S: 1.0,
  MAX_DPR: 2,                  // backing-store cap: sharp on phones, half the fill cost of 3x
};

const TEXT = {
  title: '새벽 3시',
  titleEn: 'The Fourth Watch',
  ref: '마태복음 14:22–33 · Matthew 14:22–33',
  taglineKo: '배에서 예수님께로 건너가세요',
  taglineEn: 'Cross from the boat to Jesus',
  start: '탭하여 시작 · Tap to start',
  hint: '스와이프로 이동 · Swipe to move',
  wordKo: '오라',
  wordEn: 'Come',
  cryKo: '주여, 나를 구원하소서!',
  cryEn: 'Lord, save me!',
  v31: { ko: '믿음이 작은 자여, 왜 의심하였느냐?', en: 'You of little faith, why did you doubt? · 마태복음 14:31' },
  v27: { ko: '안심하라. 나다. 두려워하지 말라.', en: 'Take heart; it is I. Do not be afraid. · 마태복음 14:27' },
  restart: '잠시 후 배에서 다시 시작합니다 · Restarting from the boat…',
  timeUp: '시간 종료 · Time’s up',
  timeUpKo: '시간 종료',
  timeUpEn: 'Time’s up',
  nextKo: '다음 사람',
  nextEn: n => 'Next player (' + n + ')',
  player: n => '플레이어 ' + n,
};

const FONT_SANS = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FONT_SERIF = '"Noto Serif KR","AppleMyungjo","Batang",serif';

// ============================================================================
// Helpers and geometry
// ============================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

// Small seeded PRNG so self-tests are reproducible.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const LANES = CONFIG.LANES;
const SEA_BOTTOM = CONFIG.TOP_H + LANES * CONFIG.LANE_H;       // lower edge of the sea; the boat is below
const CX = CONFIG.W / 2;                                         // Jesus and the bow
// COLS positions centred on the bow (16 has no centre column, so it gives 15), capped to stay on screen.
const MAX_COL = Math.min(Math.floor((CONFIG.COLS - 1) / 2),
                         Math.floor((CX - CONFIG.COL_W / 2) / CONFIG.COL_W));   // keyboard 7, phone 3

function laneTop(n) { return SEA_BOTTOM - n * CONFIG.LANE_H; }
function laneY(n) { return n <= 0 ? CONFIG.BOAT_Y : laneTop(n) + CONFIG.LANE_H / 2; }
function laneDir(n) { return n % 2 === 1 ? 1 : -1; }   // odd lanes travel right, even lanes left
function colX(c) { return CX + c * CONFIG.COL_W; }
function laneFromY(y) {
  if (y >= SEA_BOTTOM) return 0;
  if (y < CONFIG.TOP_H) return LANES + 1;
  return Math.min(LANES, Math.floor((SEA_BOTTOM - y) / CONFIG.LANE_H) + 1);
}
function nearestLane(y) {
  let best = 0, bd = Infinity;
  for (let n = 0; n <= LANES; n++) { const d = Math.abs(laneY(n) - y); if (d < bd) { bd = d; best = n; } }
  return best;
}
function walkSpeed() { return LANES * CONFIG.LANE_H / CONFIG.WORD_WALK_CROSS_S; }
// Colliding front part of a gust as [left, right].
function coreSpan(g) {
  const c = g.len * CONFIG.GUST_CORE_FRAC;
  return g.dir > 0 ? [g.x - c, g.x] : [g.x, g.x + c];
}

// ============================================================================
// Simulation (no rendering, no audio; used by the game and by the self-test)
// ============================================================================
class Game {
  constructor(opts) {
    opts = opts || {};
    this.rng = opts.rng || Math.random;
    this.listeners = [];
    this.wordInterval = CONFIG.WORD_INTERVAL_S;
    this.diffIdx = 1;
    this.sinkCount = 0;
    this.playerNum = 1;
    this.debug = false;
    this.muted = false;
    this.toastMsg = ''; this.toastT = -10;
    this.t = 0;
    this.turnEndT = -Infinity;     // when "Next player" last appeared
    this.held = Object.create(null);
    this.state = 'TITLE';
    this.stats = this.freshStats();
    this.resetWorld();
  }

  freshStats() { return { wordsHeard: 0, wordWalks: 0, sinks: 0, maxLane: 0, reached: false, comeRuns: 0 }; }
  on(fn) { this.listeners.push(fn); }
  emit(type, data) { for (let i = 0; i < this.listeners.length; i++) this.listeners[i](type, data || {}, this); }

  get diff() { return CONFIG.DIFFICULTY[this.diffIdx]; }
  laneSpeed(n) { return CONFIG.LANE_SPEED[n - 1] * CONFIG.DIFFICULTY[this.windIdx]; }   // fixed for the turn
  suddenP(n) { return n >= LANES ? 1 : clamp(CONFIG.SUDDEN_P[n - 1] * this.diff, 0, 1); }
  gap(n) {
    const a = CONFIG.GUST_GAP_S[0], b = CONFIG.GUST_GAP_S[1];
    const g = a + (b - a) * this.rng();
    return n > 4 ? g * Math.pow(1 - CONFIG.GUST_GAP_SHRINK, n - 4) : g;
  }

  resetWorld() {
    this.gusts = [];
    this.tele = [];
    this.laneTimer = [];
    for (let n = 1; n <= LANES; n++) this.laneTimer[n] = this.rng() * 2;
    this.spawnEnabled = true;
    this.calmUntil = -1;
    this.calmMul = 1;
    this.windIdx = this.diffIdx;   // a difficulty key changes the wind's speed from the next turn
    this.p = { col: 0, x: CX, y: laneY(0), lane: 0, stillT: 0, cooldownUntil: -1,
               trailA: 0, trailX: CX, trailTop: laneY(0) };
    this.arming = null;
    this.run = null;               // a run up the middle way: { last } = the time of its latest step
    this.word = null;
    this.lastWordStart = null;
    this.nextWordAt = CONFIG.WORD_FIRST_AT_S;
    this.turnT = 0;
    this.sinkT = 0; this.respawnT = 0; this.reachT = 0; this.timeupT = 0;
    this.sinkLine = null; this.sinkFlags = null; this.sinkPos = null; this.reachFrom = null;
    this.vis = { wordGlow: 0, bubbleA: 0 };
    // The gust clock (it stops while the wind does) and the ways planned on it: the first comes as He first
    // speaks and the next an interval later, both planned now so the wind is timed for them from the start.
    this.gt = 0;
    this.ways = [];
    this.planWay(CONFIG.PREWARM_S + CONFIG.WORD_FIRST_AT_S);
    this.planWay(CONFIG.PREWARM_S + CONFIG.WORD_FIRST_AT_S + this.wordInterval);
    this.warm = true;
    const steps = Math.round(CONFIG.PREWARM_S * 30);
    for (let i = 0; i < steps; i++) this.updateGusts(1 / 30);
    for (const g of this.gusts) { g.alpha = 1; g.formA = 1; }
    this.warm = false;
  }

  // ---- state transitions --------------------------------------------------
  startTurn() {
    this.resetWorld();
    this.stats = this.freshStats();
    this.state = 'PLAYING';
    this.emit('turnStart', { player: this.playerNum });
  }
  toTitle() {
    this.state = 'TITLE';
    this.playerNum = 1;
    this.debug = false;            // a stray D never carries over to the next student
    this.resetWorld();
    this.emit('title');
  }
  toTurnEnd() {
    this.state = 'TURN_END';
    this.turnEndT = this.t;
    this.arming = null;
    this.resetWorld();
    this.emit('turnEnd', { stats: Object.assign({}, this.stats) });
  }
  toTimeUp() {
    this.state = 'TIMEUP';
    this.timeupT = 0;
    this.arming = null;
    this.run = null;
    this.tele = [];
    this.emit('timeUp', { text: TEXT.timeUp });
  }
  nextTurn() { this.playerNum++; this.debug = false; this.startTurn(); }

  // ---- input --------------------------------------------------------------
  keyDown(code, repeat, key) {
    if (repeat || this.held[code]) return;          // no auto-repeat, ever
    this.held[code] = true;
    const s = this.state;
    if (code === 'Enter' || code === 'NumpadEnter') {
      if (s === 'TITLE') { this.playerNum = 1; this.startTurn(); }
      else if (s === 'TURN_END') this.nextTurn();
      else if (s === 'TIMEUP') this.toTurnEnd();
      return;
    }
    if (code === 'Escape') { this.toTitle(); return; }
    if (code === 'KeyD') { this.debug = !this.debug; return; }
    if (code === 'KeyM') { this.muted = !this.muted; this.emit('mute', { muted: this.muted }); return; }
    if (code === 'KeyN') {
      if (s === 'TURN_END') this.nextTurn();
      else if (s !== 'TITLE') this.toTurnEnd();
      return;
    }
    if (code === 'Equal' || code === 'NumpadAdd' || key === '+') { this.setWordInterval(this.wordInterval + 1); return; }
    if (code === 'Minus' || code === 'NumpadSubtract' || key === '-') { this.setWordInterval(this.wordInterval - 1); return; }
    const di = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[code];
    if (di !== undefined) { this.diffIdx = di; this.toast('Difficulty x' + CONFIG.DIFFICULTY[di] + ' (wind: next turn)'); return; }
    if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') this.onArrow(code);
  }

  keyUp(code) {
    this.held[code] = false;
    if (code === 'ArrowUp') {
      this.arming = null;                          // any release ends arming, so taps never chain
      if (this.state === 'WORD_WALK') this.exitWalk('release');
    }
  }

  releaseAll() {
    this.held = Object.create(null);
    this.arming = null;
    if (this.state === 'WORD_WALK') this.exitWalk('release');
  }

  // A finger that came down while He speaks and rests there: ↑ is held without a step (a swipe up or the
  // lift takes that step), and it arms exactly like the key pressed inside the window.
  holdUp() {
    if (this.held.ArrowUp) return;
    this.held.ArrowUp = true;
    if (this.state === 'PLAYING' && this.word && !this.arming) { this.arming = { t0: this.turnT }; this.emit('arm'); }
  }

  onArrow(code) {
    const s = this.state;
    if (s === 'WORD_WALK') {
      if (code !== 'ArrowUp') this.exitWalk('look');   // he looked at the wind
      return;
    }
    if (s !== 'PLAYING') return;
    if (code === 'ArrowUp') {
      if (this.word && !this.arming) { this.arming = { t0: this.turnT }; this.emit('arm'); }
      // Stepping out of the boat at the bow while He speaks starts a run; in the run a step up goes on toward
      // Him, and from the last lane it reaches Him. Out on the sea, steps up are ordinary steps.
      if (this.p.col === 0 && (this.run || (this.word && this.p.lane === 0))) {
        if (this.p.lane >= LANES) { if (this.t >= this.p.cooldownUntil - 1e-9) this.reach(); return; }
        if (this.tryStep(0, 1)) this.runStep();
        return;
      }
      this.tryStep(0, 1);
    } else {
      this.arming = null;
      if (code === 'ArrowDown') this.tryStep(0, -1);
      else this.tryStep(code === 'ArrowLeft' ? -1 : 1, 0);
      if (this.run) this.endRun('look');          // he looked at the wind
    }
  }

  // A step up along the open way; the first one (while He speaks) starts the run.
  runStep() {
    if (!this.run) { this.run = { last: this.turnT }; this.stats.comeRuns++; this.emit('run', { lane: this.p.lane }); }
    this.run.last = this.turnT;
  }
  // He stopped, or stepped aside: the way closes and, as when he saw the wind, a sudden gust may come at once.
  endRun(reason) {
    if (!this.run) return;
    this.run = null;
    const p = this.p;
    if (p.lane >= 1 && (p.lane >= LANES || this.rng() < CONFIG.WALK_EXIT_SUDDEN_P)) this.addTele(p.lane, p.x, CONFIG.WALK_EXIT_TELEGRAPH_S);
    this.emit('runEnd', { reason: reason, lane: p.lane });
  }
  // A way up the middle from the bow, clear of gust cores in each lane n from the moment a run that leaves
  // as He speaks (at, on the gust clock) could be there until a run leaving as late as WAY_START_S, a lane
  // every WAY_PACE_S, has gone through it (with WAY_PRE_S to spare at both ends).
  planWay(at) {
    const A = [], B = [], cd = CONFIG.STEP_COOLDOWN_MS / 1000;
    for (let n = 1; n <= LANES; n++) {
      A[n] = at + (n - 1) * cd - CONFIG.WAY_PRE_S;
      B[n] = at + CONFIG.WAY_START_S + n * CONFIG.WAY_PACE_S + CONFIG.WAY_PRE_S;
    }
    this.ways.push({ at: at, A: A, B: B, done: false });
  }
  // How long a gust entering lane n now takes until its core reaches the middle way, and until it has left it.
  wayCross(n) {
    const v = this.laneSpeed(n) * this.calmMul, dir = laneDir(n);
    const hw = CONFIG.HITBOX_W / 2 + CONFIG.WAY_EDGE_PX;
    const c = CONFIG.GUST_LEN[n - 1] * (1 + CONFIG.GUST_LEN_JITTER) * CONFIG.GUST_CORE_FRAC;   // the longest core
    const xs = dir > 0 ? -CONFIG.SPAWN_MARGIN : CONFIG.W + CONFIG.SPAWN_MARGIN;
    return [(dir > 0 ? CX - hw - xs : xs - (CX + hw)) / v, (dir > 0 ? CX + hw + c - xs : xs + c - (CX - hw)) / v];
  }
  // How long to hold back lane n's next gust so that its core does not cross the middle way while that must
  // be clear (0: it can come now). Only the moment a gust enters, off screen, is chosen; once it is on its
  // way it blows like every other gust.
  holdSpawn(n) {
    if (!this.ways.length || this.laneSpeed(n) * this.calmMul <= 0) return 0;
    const [d0, d1] = this.wayCross(n);
    let wait = 0;
    for (const w of this.ways) {
      const s = this.gt + wait;
      if (s + d1 > w.A[n] && s + d0 < w.B[n]) wait = w.B[n] - d0 - this.gt;
    }
    return wait > 1e-9 ? wait + CONFIG.WAY_SPREAD_S * this.rng() : 0;   // back a little later, not on a beat
  }

  setWordInterval(v) {
    v = clamp(v, CONFIG.WORD_INTERVAL_RANGE[0], CONFIG.WORD_INTERVAL_RANGE[1]);
    this.wordInterval = v;
    // The next way is already timed into the wind; the one after it moves to the new interval if every gust
    // already blowing will be clear of it by then (moving it later is always safe), else from the one after.
    const up = this.ways.filter(x => !x.done);
    if (up.length >= 2) {
      const last = up[up.length - 1], at = up[up.length - 2].at + v;
      let lead = 0;
      for (let n = 1; n <= LANES; n++) lead = Math.max(lead, this.wayCross(n)[1]);
      if (at >= last.at || at - CONFIG.WAY_PRE_S - this.gt >= lead) {
        this.ways.splice(this.ways.indexOf(last), 1);
        this.planWay(at);
      }
    }
    this.toast('Word interval ' + v + ' s');
  }
  toast(msg) { this.toastMsg = msg; this.toastT = this.t; }

  // One discrete step; returns true when Peter moved.
  tryStep(dx, dy) {
    const p = this.p;
    if (this.t < p.cooldownUntil - 1e-9) return false;
    const lane = p.lane + dy;
    if (lane > LANES || lane < 0) return false;           // no plain step leaves the last lane
    if (lane === 0 && Math.abs(p.col) > CONFIG.BOAT_MAX_COL) return false;
    const maxC = lane === 0 ? CONFIG.BOAT_MAX_COL : MAX_COL;
    const col = clamp(p.col + dx, -maxC, maxC);
    if (lane === p.lane && col === p.col) return false;
    const entered = lane !== p.lane;
    p.lane = lane; p.col = col; p.x = colX(col); p.y = laneY(lane);
    p.stillT = 0;
    p.cooldownUntil = this.t + CONFIG.STEP_COOLDOWN_MS / 1000;
    if (lane > this.stats.maxLane) this.stats.maxLane = lane;
    if (lane >= 1 && (entered || lane === LANES) && !(dy > 0 && col === 0 && this.run)) this.rollSudden(lane);   // none on the way
    this.emit('step', { lane: lane, col: col });
    return true;
  }

  rollSudden(n) {
    if (this.rng() < this.suddenP(n)) this.addTele(n, this.p.x, CONFIG.SUDDEN_TELEGRAPH_S[n - 1]);
  }
  addTele(n, x, dur) {
    this.tele.push({ lane: n, x: x, t: dur, dur: dur, wide: n >= LANES, seed: this.rng() });
    this.emit('telegraph', { lane: n, x: x });
  }
  formGust(tl) {
    const n = tl.lane, dir = laneDir(n);
    let len, lead;
    if (tl.wide) { len = CONFIG.WIDE_GUST_LEN; lead = tl.x + dir * CONFIG.WIDE_GUST_LEAD; }
    else { len = CONFIG.GUST_LEN[n - 1]; lead = tl.x + dir * len * CONFIG.SUDDEN_LEAD_FRAC; }
    this.gusts.push({ lane: n, dir: dir, x: lead, len: len, seed: this.rng(), alpha: 1, formA: 0, whooshed: false, sudden: true });
    this.emit('gustForm', { lane: n, x: tl.x });
  }
  spawnGust(n) {
    const dir = laneDir(n);
    const j = CONFIG.GUST_LEN_JITTER;
    const len = CONFIG.GUST_LEN[n - 1] * (1 - j + 2 * j * this.rng());
    this.gusts.push({ lane: n, dir: dir, x: dir > 0 ? -CONFIG.SPAWN_MARGIN : CONFIG.W + CONFIG.SPAWN_MARGIN, len: len,
                      seed: this.rng(), alpha: 1, formA: 1, whooshed: false, sudden: false });
  }

  startWalk() {
    const p = this.p;
    this.arming = null;
    this.run = null;
    this.state = 'WORD_WALK';
    this.stats.wordWalks++;
    this.tele = [];
    p.stillT = 0;
    p.trailX = p.x;
    this.emit('walk');
  }
  exitWalk(reason) {
    const p = this.p;
    let n = nearestLane(p.y);
    if (n === 0 && Math.abs(p.col) > CONFIG.BOAT_MAX_COL) n = 1;
    p.lane = n; p.y = laneY(n);
    this.state = 'PLAYING';
    this.arming = null;
    p.stillT = 0;
    p.cooldownUntil = this.t + CONFIG.STEP_COOLDOWN_MS / 1000;
    if (n > this.stats.maxLane) this.stats.maxLane = n;
    // The last lane is always guarded, so an exit there can never become a plain crossing.
    if (n >= 1 && (n >= LANES || this.rng() < CONFIG.WALK_EXIT_SUDDEN_P)) this.addTele(n, p.x, CONFIG.WALK_EXIT_TELEGRAPH_S);
    this.emit('walkExit', { reason: reason, lane: n });
  }
  reach() {
    const p = this.p;
    this.state = 'REACHED';
    this.reachT = 0;
    this.arming = null;
    this.run = null;
    this.tele = [];
    this.stats.reached = true;
    this.stats.maxLane = LANES;
    this.reachFrom = { x: p.x, y: p.y };
    this.emit('reached', { text: TEXT.v27.ko });
  }
  sink(reason) {
    const p = this.p;
    this.state = 'SINKING';
    this.sinkT = 0;
    this.arming = null;
    this.run = null;
    this.tele = [];
    this.stats.sinks++;
    this.sinkFlags = { cry: false, hand: false, line: false };
    let key = 'v31';
    if (CONFIG.SINK_LINE === 'v27') key = 'v27';
    else if (CONFIG.SINK_LINE === 'alternate') key = this.sinkCount % 2 === 0 ? 'v31' : 'v27';
    this.sinkCount++;
    this.sinkLine = TEXT[key];
    this.sinkPos = { x: p.x, y: p.y };
    this.emit('sink', { reason: reason, lane: p.lane });
  }
  respawn() {
    const p = this.p;
    p.col = 0; p.x = CX; p.lane = 0; p.y = laneY(0); p.stillT = 0; p.trailA = 0;
    this.state = 'RESPAWN';
    this.respawnT = 0;
    this.tele = [];
    this.calmUntil = this.t + CONFIG.RESPAWN_CALM_S;   // the wind ceased (14:32)
    this.emit('respawn');
  }

  hitTest() {
    const p = this.p, hw = CONFIG.HITBOX_W / 2;
    const x0 = p.x - hw, x1 = p.x + hw, y0 = p.y + CONFIG.HITBOX_DY, y1 = y0 + CONFIG.HITBOX_H;
    for (let i = 0; i < this.gusts.length; i++) {
      const g = this.gusts[i];
      if (g.lane !== p.lane) continue;
      const cy = laneY(g.lane);
      if (y1 < cy - CONFIG.GUST_CORE_HALF_H || y0 > cy + CONFIG.GUST_CORE_HALF_H) continue;
      const c = coreSpan(g);
      if (c[1] >= x0 && c[0] <= x1) return g;
    }
    return null;
  }

  // ---- per-tick update ----------------------------------------------------
  update(dt) {
    this.t += dt;
    const s = this.state;
    if (s === 'PLAYING' || s === 'WORD_WALK' || s === 'SINKING' || s === 'RESPAWN') {
      this.turnT += dt;
      this.updateWord();
    }
    this.updateGusts(dt);
    switch (s) {
      case 'PLAYING': this.updatePlaying(dt); break;
      case 'WORD_WALK': this.updateWalk(dt); break;
      case 'SINKING': this.updateSinking(dt); break;
      case 'RESPAWN':
        this.respawnT += dt;
        if (this.respawnT >= CONFIG.SINK_TIMELINE.end - CONFIG.SINK_TIMELINE.respawn) {
          this.state = 'PLAYING';
          this.p.stillT = 0;
          this.emit('resume');
        }
        break;
      case 'REACHED': this.updateReached(dt); break;
      case 'TIMEUP':
        this.timeupT += dt;
        if (this.timeupT >= CONFIG.TIMEUP_S) this.toTurnEnd();
        break;
    }
    this.updateVisuals(dt);
  }

  updateWord() {
    if (this.word && this.turnT >= this.word.end) { this.word = null; this.emit('wordClose'); }
    // He speaks when the next planned way comes clear, if Peter is out on the sea (or walking); while he is
    // sinking that one is missed. Each way that comes plans the next one an interval after the last.
    const w = this.ways.find(x => !x.done);
    if (!w || !isFinite(this.nextWordAt)) return;
    if (this.gt < w.at) { this.nextWordAt = this.turnT + w.at - this.gt + Math.max(0, this.calmUntil - this.t); return; }
    w.done = true;
    this.planWay(this.ways[this.ways.length - 1].at + this.wordInterval);
    const s = this.state;
    if (!this.word && (s === 'PLAYING' || s === 'WORD_WALK') && this.turnT < CONFIG.PLAYER_TIME_S) {
      this.word = { start: this.turnT, end: this.turnT + CONFIG.WORD_DURATION_S };
      this.lastWordStart = this.turnT;
      this.stats.wordsHeard++;
      this.emit('wordOpen');
    }
    this.nextWordAt = this.turnT + this.ways.find(x => !x.done).at - this.gt;   // when He speaks next (debug view)
  }

  updatePlaying(dt) {
    const p = this.p;
    if (this.turnT >= CONFIG.PLAYER_TIME_S && !this.arming && !this.run) { this.toTimeUp(); return; }
    if (this.arming) {
      if (!this.held.ArrowUp) this.arming = null;
      else if (this.turnT - this.arming.t0 >= CONFIG.WORD_HOLD_ARM_S - 1e-6) { this.startWalk(); return; }
    }
    if (this.run && this.turnT - this.run.last > CONFIG.RUN_GAP_S + 1e-9) this.endRun('stop');   // he stopped
    if (this.arming) return;                       // stepping out: wind cannot touch him yet
    if (p.lane >= 1) {
      p.stillT += dt;
      if (p.stillT >= CONFIG.STILL_LIMIT_S - 1e-6) { this.sink('still'); return; }
    }
    for (let i = this.tele.length - 1; i >= 0; i--) {
      const tl = this.tele[i];
      tl.t -= dt;
      if (tl.t <= 0) { this.tele.splice(i, 1); this.formGust(tl); }
    }
    if (p.lane >= 1 && this.hitTest()) this.sink('wind');
  }

  updateWalk(dt) {
    const p = this.p;
    if (!this.held.ArrowUp) { this.exitWalk('release'); return; }
    p.y -= walkSpeed() * dt;
    const ln = clamp(laneFromY(p.y), 0, LANES);
    p.lane = ln;
    if (ln > this.stats.maxLane) this.stats.maxLane = ln;
    if (p.y <= CONFIG.TOP_H) this.reach();
  }

  updateSinking(dt) {
    const T = CONFIG.SINK_TIMELINE, f = this.sinkFlags;
    this.sinkT += dt;
    if (!f.cry && this.sinkT >= T.cry) { f.cry = true; this.emit('cry', { text: TEXT.cryKo }); }
    if (!f.hand && this.sinkT >= T.handEnd) { f.hand = true; this.emit('hand'); }
    if (f.hand && !f.line && this.sinkT >= T.lineStart) {
      f.line = true;
      this.emit('line', { text: this.sinkLine.ko, en: this.sinkLine.en });
    }
    if (this.sinkT >= T.respawn) this.respawn();
  }

  updateReached(dt) {
    this.reachT += dt;
    this.calmMul = lerp(1, 0.15, easeOut(this.reachT / 1.5));
    const p = this.p, k = easeInOut(this.reachT / 1.4);
    const tx = this.reachFrom.x <= CX ? CX - 36 : CX + 36;
    p.x = lerp(this.reachFrom.x, tx, k);
    p.y = lerp(this.reachFrom.y, CONFIG.JESUS_FEET_Y - 20, k);
    if (this.reachT >= CONFIG.REACHED_S) this.toTurnEnd();
  }

  updateGusts(dt) {
    const s = this.state, p = this.p;
    const paused = this.t < this.calmUntil;
    if (!paused) {
      this.gt += dt;
      if (this.spawnEnabled) {
        for (let n = 1; n <= LANES; n++) {
          this.laneTimer[n] -= dt;
          if (this.laneTimer[n] > 0) continue;
          const wait = this.holdSpawn(n);
          if (wait > 0) this.laneTimer[n] = wait;        // it would cross the middle way while that must be clear
          else { this.spawnGust(n); this.laneTimer[n] += this.gap(n); }
        }
      }
      for (let i = 0; i < this.gusts.length; i++) {
        const g = this.gusts[i];
        g.x += g.dir * this.laneSpeed(g.lane) * this.calmMul * dt;
      }
      while (this.ways.length && this.ways[0].done && this.gt > this.ways[0].B[LANES] + 1) this.ways.shift();
      let w = 0;
      for (let i = 0; i < this.gusts.length; i++) {
        const g = this.gusts[i];
        const edge = CONFIG.SPAWN_MARGIN + 20;
        const alive = g.dir > 0 ? g.x - g.len < CONFIG.W + edge : g.x + g.len > -edge;
        if (alive) this.gusts[w++] = g;
      }
      this.gusts.length = w;
    }
    if (this.warm) return;
    const near = CONFIG.WHOOSH_DIST * CONFIG.WHOOSH_DIST;
    const walking = s === 'WORD_WALK';
    const r = CONFIG.WALK_FADE_RADIUS;
    const ka = Math.min(1, dt * 8);
    for (let i = 0; i < this.gusts.length; i++) {
      const g = this.gusts[i];
      if (!g.whooshed && (s === 'PLAYING' || s === 'WORD_WALK')) {
        const dx = g.x - p.x, dy = laneY(g.lane) - p.y;
        if (dx * dx + dy * dy < near) { g.whooshed = true; this.emit('whoosh', { x: g.x, lane: g.lane }); }
      }
      let target = 1;
      if (walking) {
        const lo = Math.min(g.x, g.x - g.dir * g.len), hi = Math.max(g.x, g.x - g.dir * g.len);
        if (hi >= p.x - r && lo <= p.x + r) target = CONFIG.WALK_FADE_ALPHA;
      } else if (s === 'REACHED') target = 0.25;
      g.alpha += (target - g.alpha) * ka;
      if (g.formA < 1) g.formA = Math.min(1, g.formA + dt * 7);
    }
  }

  updateVisuals(dt) {
    const s = this.state, p = this.p;
    const speaking = !!this.word && (s === 'PLAYING' || s === 'WORD_WALK');
    this.vis.wordGlow += ((speaking ? 1 : 0) - this.vis.wordGlow) * Math.min(1, dt * 4);
    // The bubble is tied to the window itself: it has faded out by the moment ↑ stops answering.
    const w = this.word;
    if (speaking) this.vis.bubbleA = clamp(Math.min((this.turnT - w.start) / 0.2, (w.end - this.turnT) / 0.3), 0, 1);
    else this.vis.bubbleA = s === 'PLAYING' ? 0 : Math.max(0, this.vis.bubbleA - dt * 8);
    if (s === 'WORD_WALK') { p.trailA = Math.min(1, p.trailA + dt * 4); p.trailTop = p.y; }
    else p.trailA = Math.max(0, p.trailA - dt * 1.4);
  }
}

// ============================================================================
// Touch gestures: a swipe is an arrow press and a tap is one step up. Swiping up and keeping the finger
// down holds ↑; lifting it releases the key. A finger that comes down while He speaks and stays there
// holds ↑ too: on a touch screen that is pressing the key inside the window. Any other resting finger
// presses nothing until it lifts (then it is a tap). When a second finger touches, the newest one counts.
// ============================================================================
class Gestures {
  constructor(game, cfg) {
    this.game = game;
    this.SWIPE = cfg.SWIPE_PX;          // CSS px before a touch becomes a swipe
    this.LOOK = cfg.LOOK_PX;            // CSS px a held finger must travel sideways or down to press another arrow
    this.TAP = cfg.TAP_S;               // a finger cut short by a newer one still steps if it was down less than this
    this.HOLD = cfg.HOLD_S;             // a finger that came down while He speaks holds ↑ once it has rested this long
    this.GRACE = cfg.TURN_END_GRACE_S;  // "Next player" takes no touch for this long after it appears
    this.g = null;
  }
  press(code) { this.game.keyDown(code, false, code); }
  tap() { this.press('ArrowUp'); this.game.keyUp('ArrowUp'); }
  // Returns true when the touch was taken (the caller then prevents the browser default).
  down(id, x, y, t) {
    const old = this.g;
    if (old) {
      // A second finger never breaks a walk, or the moment before one.
      if (old.id !== id && !old.done && (this.game.state === 'WORD_WALK' || this.game.arming)) return false;
      // Otherwise the new finger takes over, as if the old one had lifted: a held arrow is released, a quick
      // tap still in progress keeps its step, and a resting thumb is dropped quietly. The same id again
      // means its release was missed, so nothing steps.
      this.g = null;
      if (!old.done) {
        if (old.code) this.game.keyUp(old.code);
        else if (old.id !== id && t - old.t0 < this.TAP) this.tap();
      }
    }
    const s = this.game.state;
    if (s === 'TITLE' || s === 'TURN_END' || s === 'TIMEUP') {
      // This touch is used up, so lifting it never steps. "Time's up" runs its course, and taps carried
      // over from the turn do not start the next player before the screen has been seen.
      if (s === 'TITLE' || (s === 'TURN_END' && this.game.t - this.game.turnEndT >= this.GRACE)) {
        this.game.keyDown('Enter', false, 'Enter');
        this.game.keyUp('Enter');
      }
      this.g = { id: id, done: true };
      return true;
    }
    // inWord: the finger came down while He speaks (a fresh press inside the window).
    this.g = { id: id, x0: x, y0: y, t0: t, x: x, y: y, ax: x, ay: y, code: null, resting: false, done: false,
               inWord: s === 'PLAYING' && !!this.game.word };
    return true;
  }
  move(id, x, y) {
    const g = this.g;
    if (!g || g.id !== id || g.done) return;
    g.x = x; g.y = y;
    if (g.resting && this.game.state !== 'PLAYING') g.resting = false;   // the walk has begun: an ordinary held ↑
    if (!g.code || g.resting) {
      const dx = x - g.x0, dy = y - g.y0;
      if (Math.hypot(dx, dy) < this.SWIPE) return;
      const c = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight') : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
      g.ax = x; g.ay = y;
      if (g.resting) {
        // A finger resting since He spoke (↑ held, no step yet) now swipes: up takes the step and keeps ↑
        // held; any other way lets go of ↑ first, so a hesitant dodge is still only a dodge.
        g.resting = false;
        if (c === 'ArrowUp') { this.game.onArrow('ArrowUp'); return; }
        this.game.keyUp('ArrowUp');
      }
      g.code = c;
      this.press(c);
      return;
    }
    if (g.code !== 'ArrowUp') return;
    // Holding ↑: moving further up changes nothing; a clear sideways or downward drag presses that arrow.
    const dx = x - g.ax, dy = y - g.ay;
    if (-dy >= Math.abs(dx)) { if (dy < 0) { g.ax = x; g.ay = y; } return; }
    if (Math.hypot(dx, dy) < this.LOOK) return;
    const c = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight') : 'ArrowDown';
    this.press(c);
    this.game.keyUp(c);
    g.ax = x; g.ay = y;
  }
  // Called every frame: a finger that came down while He speaks and rests there now holds ↑ (no step).
  tick(t) {
    const g = this.g;
    if (!g || g.done || g.code || !g.inWord || t - g.t0 < this.HOLD) return;
    if (this.game.state !== 'PLAYING' || !this.game.word) { g.inWord = false; return; }   // too late: an ordinary rest
    g.code = 'ArrowUp'; g.resting = true; g.ax = g.x; g.ay = g.y;
    this.game.holdUp();
  }
  up(id) {
    const g = this.g;
    if (!g || g.id !== id) return;
    this.g = null;
    if (g.done) return;
    if (!g.code) { this.tap(); return; }       // lifted without swiping: one step up
    const s = this.game.state;
    this.game.keyUp(g.code);
    if (g.resting && s === 'PLAYING') this.tap();   // a rest that never became a walk is still a tap
  }
  cancel(id) {
    const g = this.g;
    if (!g || (id !== undefined && g.id !== id)) return;
    this.g = null;
    if (g.code && !g.done) this.game.keyUp(g.code);
  }
}

// ============================================================================
// Audio (procedural; the Word itself is silent)
// ============================================================================
function quiet(p) { if (p && typeof p.catch === 'function') p.catch(() => {}); }

// Seamlessly looping noise: 'pink' (1/f, soft surf) or 'brown' (deep rumble). The tail is
// cross-faded into the head so the loop point never clicks; RMS is normalised to 0.25.
function makeNoise(c, seconds, kind) {
  const sr = c.sampleRate, L = Math.floor(sr * seconds), F = Math.floor(sr * 0.4);
  const raw = new Float32Array(L + F);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, br = 0;
  for (let i = 0; i < L + F; i++) {
    const w = Math.random() * 2 - 1;
    if (kind === 'brown') { br = (br + 0.02 * w) / 1.02; raw[i] = br; continue; }
    // Paul Kellet's pink-noise filter
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    raw[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
  }
  let mean = 0;
  for (let i = 0; i < raw.length; i++) mean += raw[i];
  mean /= raw.length;
  let ss = 0;
  for (let i = 0; i < raw.length; i++) { raw[i] -= mean; ss += raw[i] * raw[i]; }
  const k = 0.25 / (Math.sqrt(ss / raw.length) || 1);
  const buf = c.createBuffer(1, L, sr), d = buf.getChannelData(0);
  for (let i = F; i < L; i++) d[i] = raw[i] * k;
  for (let i = 0; i < F; i++) { const u = i / F; d[i] = (raw[i] * Math.sqrt(u) + raw[L + i] * Math.sqrt(1 - u)) * k; }
  return buf;
}

const Sound = {
  ctx: null, master: null, windBus: null, pink: null, brown: null, layers: null,
  muted: false, lastWhoosh: 0, voices: 0,
  MASTER: 1.25,                 // overall level; only rare overlapping peaks reach the soft clipper
  // Builds the graph on the first user gesture; level is the sea level for the current state.
  unlock(level) {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let c;
    try { c = new AC(); } catch (e) { return; }
    this.ctx = c;
    // master -> soft clipper -> speakers. The clipper is linear below 0.6 (-4.4 dBFS) and only rounds off
    // rare overlapping peaks; unlike a compressor it adds no make-up gain.
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : this.MASTER;
    const clip = c.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) {
      const x = i / (curve.length - 1) * 2 - 1, a = Math.abs(x);
      curve[i] = a < 0.6 ? x : Math.sign(x) * (0.6 + 0.4 * Math.tanh((a - 0.6) / 0.4));
    }
    clip.curve = curve;
    this.master.connect(clip); clip.connect(c.destination);
    this.pink = makeNoise(c, 6.3, 'pink');
    this.brown = makeNoise(c, 5.1, 'brown');
    this.windBus = c.createGain();
    this.windBus.gain.value = level === undefined ? 0.7 : level;
    this.windBus.connect(this.master);
    // A faint low swell under everything (laptop speakers and headphones; phones barely play it)
    const rumble = c.createBufferSource(); rumble.buffer = this.brown; rumble.loop = true;
    const rl = c.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 160; rl.Q.value = -3;
    const rg = c.createGain(); rg.gain.value = 0.03;
    rumble.connect(rl); rl.connect(rg); rg.connect(this.windBus);
    rumble.start(0, Math.random() * 4);
    // Two independent surf layers, slightly left and right
    this.layers = [this.surf(-0.35, 0.4), this.surf(0.35, 0.34)];
    this.update();
    this.resume();                // some browsers create it suspended, even inside a tap
  },
  // One surf layer: pink noise, high-passed (no boom), then two soft low-pass filters (no hiss)
  // whose cutoff and level swell with every wave.
  surf(pan, level) {
    const c = this.ctx;
    const src = c.createBufferSource(); src.buffer = this.pink; src.loop = true;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320; hp.Q.value = -3;
    const f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter();
    for (const f of [f1, f2]) { f.type = 'lowpass'; f.Q.value = -3; f.frequency.value = 520; }
    const g = c.createGain(); g.gain.value = level * 0.4;
    src.connect(hp); hp.connect(f1); f1.connect(f2); f2.connect(g);
    let out = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(this.windBus);
    src.start(0, Math.random() * 6);
    return { f: [f1, f2], g: g, level: level, next: c.currentTime + Math.random() * 2.5 };
  },
  // Schedules each layer's next wave a little ahead; called every frame and cheap when nothing is due.
  update() {
    const c = this.ctx;
    if (!c || !this.layers) return;
    const now = c.currentTime;
    for (const L of this.layers) {
      while (L.next < now + 1.5) {
        const t = Math.max(L.next, now + 0.02);
        const rise = 1.4 + Math.random() * 1.3, fall = 2.6 + Math.random() * 2.4;
        const crest = 0.55 + Math.random() * 0.45;
        L.g.gain.setTargetAtTime(L.level * crest, t, rise / 3);
        L.g.gain.setTargetAtTime(L.level * 0.4, t + rise, fall / 3);
        for (const f of L.f) {
          f.frequency.setTargetAtTime(520 + 900 * crest, t, rise / 3);
          f.frequency.setTargetAtTime(520, t + rise, fall / 3);
        }
        L.next = t + rise + fall * (0.5 + Math.random() * 0.4);
      }
    }
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') quiet(this.ctx.suspend()); },
  resume() { if (this.ctx && this.ctx.state !== 'running' && this.ctx.state !== 'closed') quiet(this.ctx.resume()); },
  // One-off sounds start only while the context runs; a suspended or interrupted one would pile them up.
  live() { const c = this.ctx; return !!c && (!c.state || c.state === 'running'); },
  setWind(level) { if (this.ctx) this.windBus.gain.setTargetAtTime(level, this.ctx.currentTime, 0.4); },
  setMuted(m) { this.muted = m; if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : this.MASTER, this.ctx.currentTime, 0.05); },
  // A soft swish when a gust passes close by: band-passed pink noise, no hiss above ~1.5 kHz.
  whoosh(x) {
    const c = this.ctx;
    if (!this.live() || this.voices >= 3) return;
    const t0 = c.currentTime;
    if (t0 - this.lastWhoosh < 0.22) return;
    this.lastWhoosh = t0;
    const src = c.createBufferSource(); src.buffer = this.pink;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, t0);
    bp.frequency.exponentialRampToValueAtTime(760, t0 + 0.32);
    bp.frequency.exponentialRampToValueAtTime(380, t0 + 0.9);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = -3;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.7, t0 + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    src.connect(bp); bp.connect(lp); lp.connect(g);
    let out = g;
    if (c.createStereoPanner) {
      const pn = c.createStereoPanner(); pn.pan.value = clamp((x - CX) / CX, -0.7, 0.7);
      g.connect(pn); out = pn;
    }
    out.connect(this.master);
    this.voices++;
    src.onended = () => { this.voices = Math.max(0, this.voices - 1); };
    src.start(t0, Math.random() * 5);
    src.stop(t0 + 0.95);
  },
  // Falling into the water: a low, soft plunge (every onset ramps, so nothing clicks).
  splash() {
    const c = this.ctx;
    if (!this.live()) return;
    const t0 = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.brown;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = -3;
    lp.frequency.setValueAtTime(1100, t0); lp.frequency.exponentialRampToValueAtTime(240, t0 + 0.9);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.45, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0, Math.random() * 3);
    src.stop(t0 + 1.05);
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(48, t0 + 0.35);
    const og = c.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(og); og.connect(this.master);
    o.start(t0); o.stop(t0 + 0.45);
  },
};

// ============================================================================
// Rendering (portrait 540 x 1080 frame; sky, sea and boat bleed to every screen edge)
// ============================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = CONFIG.W, H = CONFIG.H, SP = CONFIG.SPRITE;
// Frame placement: device px per logical px and offsets (device and CSS px), set by resize().
const VIEW = { s: 1, ox: 0, oy: 0, css: 1, cssX: 0, cssY: 0 };
// Visible logical bounds; wider than the frame on long or wide screens.
let VX0 = 0, VY0 = 0, VX1 = W, VY1 = H;
const MUTE_BTN = { x: W - 42, y: 44, r: 24 };

// Deterministic decoration (rain, clouds).
const DECO = mulberry32(20261031);
const RAIN = Array.from({ length: 110 }, () => ({ x: DECO() * 900, y: DECO() * 1500, s: 0.7 + DECO() * 0.6, l: 12 + DECO() * 12 }));
const CLOUDS = Array.from({ length: 7 }, (_, i) => {
  const n = 3 + Math.floor(DECO() * 3), parts = [];
  for (let k = 0; k < n; k++) parts.push({ dx: (k - n / 2) * 34 + DECO() * 18, dy: DECO() * 14 - 7, rx: 34 + DECO() * 38, ry: 14 + DECO() * 12 });
  return { x: i * 150 + DECO() * 90, y: 40 + DECO() * 110, v: 2 + DECO() * 4, parts: parts, a: 0.35 + DECO() * 0.3 };
});

let GR = null;   // cached gradients (logical coordinates, transform applied at fill time)
let SCALE = 1;   // backing-store px per logical px; shadowBlur ignores the transform, so blurs use it
function gradients() {
  if (GR) return GR;
  const sky = ctx.createLinearGradient(0, 0, 0, CONFIG.TOP_H);
  sky.addColorStop(0, '#060b15'); sky.addColorStop(1, '#0a1424');
  const sea = ctx.createLinearGradient(0, CONFIG.TOP_H, 0, SEA_BOTTOM);
  sea.addColorStop(0, '#0b1b2e'); sea.addColorStop(1, '#06121f');
  const boat = ctx.createLinearGradient(0, SEA_BOTTOM, 0, H);
  boat.addColorStop(0, '#06111d'); boat.addColorStop(1, '#040a12');
  GR = { sky: sky, sea: sea, boat: boat };
  return GR;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Largest font size (down to min) at which text fits the width.
function fitFont(text, size, min, maxW, family) {
  ctx.font = size + 'px ' + family;
  while (size > min && ctx.measureText(text).width > maxW) { size -= 1; ctx.font = size + 'px ' + family; }
  return size;
}

function drawBackground(t) {
  const gr = gradients(), x0 = VX0, w = VX1 - VX0;
  ctx.fillStyle = gr.sky; ctx.fillRect(x0, VY0, w, CONFIG.TOP_H - VY0);
  const span = w + 400;
  for (const c of CLOUDS) {
    const x = VX0 - 200 + (((c.x + t * c.v) % span) + span) % span;
    ctx.fillStyle = 'rgba(3,6,12,' + c.a + ')';
    for (const pt of c.parts) { ctx.beginPath(); ctx.ellipse(x + pt.dx, c.y + pt.dy, pt.rx, pt.ry, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = gr.sea; ctx.fillRect(x0, CONFIG.TOP_H, w, SEA_BOTTOM - CONFIG.TOP_H);
  ctx.fillStyle = gr.boat; ctx.fillRect(x0, SEA_BOTTOM, w, VY1 - SEA_BOTTOM);
  for (let n = 1; n <= LANES; n++) {
    ctx.fillStyle = n % 2 ? 'rgba(20,48,76,.30)' : 'rgba(10,30,54,.30)';
    ctx.fillRect(x0, laneTop(n), w, CONFIG.LANE_H);
  }
  // Three thin wave lines per lane
  ctx.lineWidth = 1.2;
  const alphas = [0.05, 0.07, 0.09];
  const xs = Math.floor(VX0 / 30) * 30;
  for (let n = 1; n <= LANES; n++) {
    const d = laneDir(n);
    for (let k = 0; k < 3; k++) {
      const y0 = laneTop(n) + 18 + k * 23;
      ctx.strokeStyle = 'rgba(150,190,230,' + alphas[k] + ')';
      ctx.beginPath();
      for (let x = xs; x <= VX1 + 30; x += 30) {
        const y = y0 + Math.sin(x * 0.014 + t * (0.6 + 0.15 * k) * d + n * 1.7 + k * 2.1) * 2.8;
        if (x === xs) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
}

function drawRain(t) {
  ctx.strokeStyle = 'rgba(180,200,230,.08)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  const w = VX1 - VX0 + 120, h = VY1 - VY0 + 60;
  for (const d of RAIN) {
    const y = VY0 - 30 + (((d.y + t * 560 * d.s) % h) + h) % h;
    const x = VX0 - 60 + (((d.x - t * 140 * d.s) % w) + w) % w;
    ctx.moveTo(x, y); ctx.lineTo(x - d.l * 0.27, y + d.l);
  }
  ctx.stroke();
}

// Three tapered strands with a curl at the leading end and a few spray dots.
const STRANDS = [[-7, 0, 1.0, 2.2, true], [0.6, 0.06, 0.82, 1.8, false], [7.5, 0.13, 0.62, 1.4, false]];
function drawGust(g, t) {
  const a = 0.55 * g.alpha * g.formA;
  if (a < 0.01) return;
  const cy = laneY(g.lane), d = g.dir, L = g.len;
  ctx.strokeStyle = 'rgba(226,236,246,' + a.toFixed(3) + ')';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineCap = 'round';
  const wob = t * 3 + g.seed * 10;
  for (let s = 0; s < STRANDS.length; s++) {
    const st = STRANDS[s], yo = st[0];
    const lead = g.x - d * st[1] * L, tail = lead - d * st[2] * L;
    const N = 10;
    let px = 0, py = 0;
    for (let i = 0; i <= N; i++) {
      const u = i / N;   // 0 = tail, 1 = leading end
      const x = tail + (lead - tail) * u;
      const y = cy + yo + Math.sin(u * Math.PI * 1.3 + wob + yo) * 1.8 * (1 - u * 0.6);
      if (i > 0) { ctx.lineWidth = 0.3 + st[3] * u; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke(); }
      px = x; py = y;
    }
    if (st[4]) {
      // Curl at the leading end: forward, up and back over the strand
      const r = 8;
      ctx.lineWidth = st[3];
      ctx.beginPath();
      if (d > 0) ctx.arc(px, py - r, r, Math.PI / 2, -Math.PI * 1.08, true);
      else ctx.arc(px, py - r, r, Math.PI / 2, Math.PI * 2.08, false);
      ctx.stroke();
    }
  }
  // Spray dots just ahead of the leading end
  for (let k = 0; k < 5; k++) {
    const ph = (g.seed * 7 + k * 0.37 + t * 0.9) % 1;
    const x = g.x + d * (2 + ph * 15) - d * k * 6.5;
    const y = cy - 13 + ((k * 37 + Math.floor(g.seed * 100)) % 19);
    ctx.beginPath(); ctx.arc(x, y, 1.3 + (k % 2) * 0.45, 0, Math.PI * 2); ctx.fill();
  }
}

// Spray-burst warning where a sudden gust is about to form.
function drawTelegraph(tl, t) {
  const prog = clamp(1 - tl.t / tl.dur, 0, 1);
  const cy = laneY(tl.lane);
  const xs = tl.wide ? [tl.x - CONFIG.COL_W, tl.x, tl.x + CONFIG.COL_W] : [tl.x];
  for (const x of xs) {
    const r = 7 + prog * 26;
    const a = 0.2 + 0.55 * prog;
    ctx.fillStyle = 'rgba(232,240,250,' + a.toFixed(3) + ')';
    for (let k = 0; k < 14; k++) {
      const ang = (k / 14) * Math.PI * 2 + tl.seed * 6 + t * 1.5;
      const rr = r * (0.7 + 0.3 * Math.sin(k * 2.3 + t * 9));
      ctx.beginPath(); ctx.arc(x + Math.cos(ang) * rr, cy + Math.sin(ang) * rr * 0.55, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(232,240,250,' + (a * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(x, cy, r * 0.8, r * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawBoat() {
  // Dark wood with a little moonlight on it: the boat reads without brightening the night
  const hull = ctx.createLinearGradient(0, 918, 0, 962);
  hull.addColorStop(0, '#36425a'); hull.addColorStop(1, '#171e2b');
  ctx.fillStyle = hull;
  ctx.beginPath();
  ctx.moveTo(130, 918); ctx.lineTo(410, 918);
  ctx.bezierCurveTo(402, 939.6, 386, 961.2, 351, 962);
  ctx.lineTo(189, 962);
  ctx.bezierCurveTo(154, 961.2, 138, 939.6, 130, 918);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(170,195,230,.30)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(160,185,220,.16)'; ctx.lineWidth = 1;                  // a plank seam
  ctx.beginPath(); ctx.moveTo(146, 936); ctx.lineTo(394, 936); ctx.stroke();
  ctx.strokeStyle = 'rgba(210,225,248,.55)'; ctx.lineWidth = 2;                  // the moonlit gunwale
  ctx.beginPath(); ctx.moveTo(132, 918.5); ctx.lineTo(408, 918.5); ctx.stroke();
  // Mast and a stay
  ctx.fillStyle = '#3c4860'; ctx.fillRect(309, 843, 3, 75);
  ctx.strokeStyle = 'rgba(175,190,215,.40)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(311, 845); ctx.lineTo(368, 907); ctx.stroke();
  // Four disciples, clear of Peter's three places on deck
  ctx.fillStyle = '#2b3549';
  for (const x of [150, 172, 368, 390]) {
    ctx.beginPath(); ctx.arc(x, 891, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 5, 897); ctx.lineTo(x + 5, 897); ctx.lineTo(x + 7, 918); ctx.lineTo(x - 7, 918); ctx.closePath(); ctx.fill();
  }
}

function drawGlow(g) {
  const w = g.vis.wordGlow;
  let boost = 0;
  if (g.state === 'REACHED') boost = easeOut(g.reachT / 1.2);
  const r = 230 * (1 + 0.06 * w) * (1 + 0.45 * boost);
  const a = Math.min(0.85, 0.55 * (1 + 0.2 * w) * (1 + 0.25 * boost));
  const cy = CONFIG.JESUS_FEET_Y - 34 * SP;
  const gr = ctx.createRadialGradient(CX, cy, 0, CX, cy, r);
  gr.addColorStop(0, 'rgba(255,238,200,' + a.toFixed(3) + ')');
  gr.addColorStop(0.22, 'rgba(255,236,196,' + (a * 0.5).toFixed(3) + ')');
  gr.addColorStop(0.55, 'rgba(255,232,190,' + (a * 0.14).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,232,190,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(CX - r, cy - r, r * 2, r * 2);
}

function drawReflection(t) {
  ctx.lineWidth = 1.7;
  ctx.lineCap = 'butt';
  for (let i = 0; i < 9; i++) {
    const y = CONFIG.TOP_H - 3 + i * (143 / 8);
    const w = lerp(100, 24, i / 8);
    const a = lerp(0.5, 0.14, i / 8);
    const sx = Math.sin(t * 2.1 + i * 1.3) * 3;
    ctx.strokeStyle = 'rgba(232,200,140,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(CX - w / 2 + sx, y); ctx.lineTo(CX + w / 2 + sx, y); ctx.stroke();
  }
}

function drawJesus(g) {
  ctx.save();
  ctx.translate(CX, CONFIG.JESUS_FEET_Y);
  ctx.scale(SP, SP);
  ctx.shadowColor = 'rgba(255,214,140,.9)';
  ctx.shadowBlur = (22 + 8 * g.vis.wordGlow) * SCALE * SP;
  ctx.fillStyle = 'rgba(255,246,226,.95)';
  ctx.beginPath(); ctx.arc(0, -67, 9.5, 0, Math.PI * 2); ctx.fill();
  const top = -55;
  ctx.beginPath();
  ctx.moveTo(-5, top);
  ctx.bezierCurveTo(-11, top + 4, -12, top + 20, -14, top + 34);
  ctx.lineTo(-19, -2);
  ctx.quadraticCurveTo(0, 3, 19, -2);
  ctx.lineTo(14, top + 34);
  ctx.bezierCurveTo(12, top + 20, 11, top + 4, 5, top);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawWordBubble(a) {
  const x = CX + 36, y = CONFIG.JESUS_FEET_Y - 90, w = 152, h = 54, r = 14;
  ctx.save();
  ctx.globalAlpha = a;
  // One outline: rounded box whose lower-left corner becomes a small tail toward Jesus
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.lineTo(x + 16, y + h);
  ctx.lineTo(x - 10, y + h - 3);
  ctx.lineTo(x, y + h - 17);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(30,30,36,.32)'; ctx.fill();
  ctx.strokeStyle = 'rgba(222,190,128,.62)'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = '27px ' + FONT_SERIF;
  ctx.fillStyle = 'rgba(255,242,220,.95)';
  ctx.fillText(TEXT.wordKo, x + 20, y + h / 2 + 1);
  const kw = ctx.measureText(TEXT.wordKo).width;
  ctx.font = '17px ' + FONT_SANS;
  ctx.fillStyle = 'rgba(255,242,220,.6)';
  ctx.fillText(TEXT.wordEn, x + 20 + kw + 12, y + h / 2 + 2);
  ctx.restore();
}

function drawHalo(x, y, word) {
  const r = (word ? 58 : 44) * SP, cy = y - 10 * SP;
  const hg = ctx.createRadialGradient(x, cy, 0, x, cy, r);
  hg.addColorStop(0, word ? 'rgba(255,226,160,.42)' : 'rgba(120,160,225,.30)');
  hg.addColorStop(1, word ? 'rgba(255,226,160,0)' : 'rgba(120,160,225,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(x - r, cy - r, r * 2, r * 2);
}

function drawPeterBody(x, y, word, armsUp) {
  const col = word ? '#f4e6c6' : '#a9bdd6';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(SP, SP);
  if (word) { ctx.shadowColor = 'rgba(255,210,130,.95)'; ctx.shadowBlur = 18 * SCALE * SP; }
  ctx.fillStyle = col; ctx.strokeStyle = col;
  ctx.lineWidth = 4.2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (armsUp) {
    // Right arm reaches up for the hand; the left one hangs into the water
    ctx.moveTo(-6, -14); ctx.lineTo(-16, 1);
    ctx.moveTo(6, -14); ctx.lineTo(12, -42);
  } else {
    ctx.moveTo(-6, -14); ctx.lineTo(-16, 1);
    ctx.moveTo(6, -14); ctx.lineTo(16, 1);
  }
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, -18); ctx.lineTo(7, -18);
  ctx.lineTo(13, 20); ctx.lineTo(-13, 20);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -29, 9.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = word ? 'rgba(150,120,70,.35)' : 'rgba(50,70,100,.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-9.5, -1); ctx.lineTo(9.5, -1); ctx.stroke();
  ctx.restore();
}

function drawTrail(p) {
  if (p.trailA <= 0.01) return;
  const top = p.trailTop + 18 * SP, bottom = CONFIG.BOAT_Y + 14;
  if (bottom <= top) return;
  const gr = ctx.createLinearGradient(0, top, 0, bottom);
  gr.addColorStop(0, 'rgba(255,236,190,' + (0.42 * p.trailA).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(p.trailX - 11 * SP, top, 22 * SP, bottom - top);
}

function drawPeter(g) {
  const p = g.p, s = g.state;
  if (s === 'SINKING') { drawSinkingPeter(g); return; }
  const word = s === 'WORD_WALK' || s === 'REACHED' || !!g.run;   // he glows while he goes on the Word
  drawTrail(p);
  drawHalo(p.x, p.y, word);
  drawPeterBody(p.x, p.y, word, false);
}

// Sinks to the waist by sinkEnd; once the hand of light arrives it lifts him back onto the water.
function sinkGeom(g) {
  const T = CONFIG.SINK_TIMELINE;
  const lift = easeInOut((g.sinkT - T.handEnd) / 0.8);
  const k = easeOut(g.sinkT / T.sinkEnd) * (1 - lift);
  const sp = g.sinkPos, dy = 6 * SP * k;
  return { x: sp.x, y: sp.y + dy, waterY: sp.y + lerp(22, 5, k) * SP, handX: sp.x + 13 * SP, handY: sp.y + dy - 50 * SP };
}

function drawSinkingPeter(g) {
  const s = sinkGeom(g);
  drawHalo(s.x, s.y, false);
  ctx.save();
  ctx.beginPath(); ctx.rect(VX0, VY0, VX1 - VX0, s.waterY - VY0); ctx.clip();
  drawPeterBody(s.x, s.y, false, true);
  ctx.restore();
  ctx.lineWidth = 1.3;
  for (let i = 0; i < 3; i++) {
    const ph = (g.sinkT * 0.9 + i / 3) % 1;
    const rx = (14 + ph * 26) * SP;
    ctx.strokeStyle = 'rgba(170,200,235,' + (0.45 * (1 - ph)).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(s.x, s.waterY + 1, rx, rx * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

// A glowing curved arm that reaches from Jesus to Peter's raised hand.
function drawHandOfLight(g) {
  const T = CONFIG.SINK_TIMELINE;
  if (g.sinkT < T.handStart) return;
  const prog = easeOut((g.sinkT - T.handStart) / (T.handEnd - T.handStart));
  if (prog <= 0) return;
  const s = sinkGeom(g);
  const p0 = { x: CX + 6 * SP, y: CONFIG.JESUS_FEET_Y - 32 * SP }, p2 = { x: s.handX, y: s.handY };
  const c = { x: p0.x + (p2.x - p0.x) * 0.08, y: p0.y + (p2.y - p0.y) * 0.85 };
  const q = u => ({ x: (1 - u) * (1 - u) * p0.x + 2 * (1 - u) * u * c.x + u * u * p2.x,
                    y: (1 - u) * (1 - u) * p0.y + 2 * (1 - u) * u * c.y + u * u * p2.y });
  const N = 40, pts = [];
  for (let i = 0; i <= N; i++) pts.push(q(prog * i / N));
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i <= N; i++) ctx.lineTo(pts[i].x, pts[i].y); };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = 'rgba(255,226,160,.20)'; ctx.lineWidth = 18; ctx.stroke();
  ctx.shadowColor = 'rgba(255,214,140,.95)'; ctx.shadowBlur = 18 * SCALE * SP;
  path(); ctx.strokeStyle = 'rgba(255,243,214,.96)'; ctx.lineWidth = 7; ctx.stroke();
  // Open hand at the tip, oriented along the arm
  const u = prog;
  const tx = 2 * (1 - u) * (c.x - p0.x) + 2 * u * (p2.x - c.x);
  const ty = 2 * (1 - u) * (c.y - p0.y) + 2 * u * (p2.y - c.y);
  const end = pts[N];
  ctx.translate(end.x, end.y);
  ctx.rotate(Math.atan2(ty, tx));
  ctx.scale(SP, SP);
  ctx.fillStyle = 'rgba(255,243,214,.97)'; ctx.strokeStyle = 'rgba(255,243,214,.97)';
  ctx.beginPath(); ctx.ellipse(4, 0, 12, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 4; ctx.beginPath();
  for (let k = -1.5; k <= 1.5; k += 1) { ctx.moveTo(11, k * 4.6); ctx.lineTo(23, k * 6.8); }
  ctx.moveTo(3, -9); ctx.lineTo(11, -17);
  ctx.stroke();
  ctx.restore();
}

function drawCry(g) {

function vignetteAmount(g) {
  const T = CONFIG.SINK_TIMELINE, V = CONFIG.VIGNETTE;
  if (g.state === 'SINKING') {
    const st = g.sinkT;
    if (st < T.sinkEnd) return V[0] * st / T.sinkEnd;
    if (st < T.handStart) return V[0];
    if (st < T.handEnd) return lerp(V[0], V[1], (st - T.handStart) / (T.handEnd - T.handStart));
    return V[1];
  }
  if (g.state === 'RESPAWN') return V[1] * (1 - clamp(g.respawnT / (T.end - T.respawn), 0, 1));
  return 0;
}
function fullRect() { ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0); }
// On screens wider than the frame (landscape, tablets) the sea fades to dark at the sides, so the play
// column stays clear and gusts never visibly appear out of thin air (they enter 160 px beyond the frame).
function drawCurtains() {
  const k = 150;
  if (VX0 < -2) {

    ctx.fillStyle = gr; ctx.fillRect(VX0, VY0, -VX0, VY1 - VY0);
  }
  if (VX1 > W + 2) {
    const gr = ctx.createLinearGradient(W, 0, W + k, 0);
    gr.addColorStop(0, 'rgba(3,6,12,0)'); gr.addColorStop(1, 'rgba(3,6,12,.92)');
    ctx.fillStyle = gr; ctx.fillRect(W, VY0, VX1 - W, VY1 - VY0);

}
function drawVignette(v) {
  ctx.fillStyle = 'rgba(2,5,10,' + (v * 0.55).toFixed(3) + ')';

function fadeAmount(g) {
  const T = CONFIG.SINK_TIMELINE;
  if (g.state === 'SINKING' && g.sinkT > T.lineEnd) return clamp((g.sinkT - T.lineEnd) / (T.respawn - T.lineEnd), 0, 1);
  if (g.state === 'RESPAWN') return 1 - clamp(g.respawnT / (T.end - T.respawn), 0, 1);

}

function drawSelftestPanel(r) {
  ctx.save();

  if (r) lines.unshift(r.pass ? 'SELF-TEST: ALL PASS' : 'SELF-TEST: FAILURES');

function render(g, fps) {
  ctx.setTransform(VIEW.s, 0, 0, VIEW.s, VIEW.ox, VIEW.oy);
  SCALE = VIEW.s;
  VX0 = -VIEW.ox / VIEW.s; VY0 = -VIEW.oy / VIEW.s;
  VX1 = (canvas.width - VIEW.ox) / VIEW.s; VY1 = (canvas.height - VIEW.oy) / VIEW.s;
  const t = g.t, s = g.state;
  drawBackground(t);
  for (const tl of g.tele) drawTelegraph(tl, t);
  for (const gs of g.gusts) {
    const lo = Math.min(gs.x, gs.x - gs.dir * gs.len), hi = Math.max(gs.x, gs.x - gs.dir * gs.len);
    if (hi > VX0 - 30 && lo < VX1 + 30) drawGust(gs, t);   // skip gusts still off screen
  }
  drawBoat();
  const v = vignetteAmount(g);
  if (v > 0) drawVignette(v);
  drawGlow(g);
  drawReflection(t);
  drawJesus(g);
  drawPeter(g);
  if (g.vis.bubbleA > 0.01) drawWordBubble(g.vis.bubbleA);
  drawRain(t);
  drawCurtains();
  if (s !== 'TITLE' && s !== 'TURN_END') drawHUD(g);
  if (s === 'SINKING') {
    const T = CONFIG.SINK_TIMELINE;
    drawHandOfLight(g);
    drawCry(g);
    if (g.sinkT >= T.lineStart) drawCaptionBox(g.sinkLine, clamp((g.sinkT - T.lineStart) / 0.25, 0, 1), TEXT.restart);
  }
  if (s === 'REACHED') drawCaptionBox(TEXT.v27, clamp(g.reachT / 0.3, 0, 1));
  if (s === 'TIMEUP') drawTimeUp();
  if (s === 'TITLE') drawTitle(g);
  if (s === 'TURN_END') drawTurnEnd(g);
  const f = fadeAmount(g);
  if (f > 0) { ctx.fillStyle = 'rgba(0,0,0,' + f.toFixed(3) + ')'; fullRect(); }
  drawMuteButton(g);
  if (g.debug) drawDebug(g, fps);
  if (SELFTEST) drawSelftestPanel(window.__selftest);
}

// ============================================================================
// Self-test (?selftest=1): headless simulations, results logged to the console
// ============================================================================
const SELFTEST = new URLSearchParams(location.search).get('selftest') === '1';

// Time window [ts, te] in which a gust core overlaps the span [a, b] (linear motion).
function overlapWindow(x0, dir, len, v, a, b) {
  const c = len * CONFIG.GUST_CORE_FRAC;
  if (v === 0) {
    const lo = dir > 0 ? x0 - c : x0, hi = dir > 0 ? x0 : x0 + c;
    return hi < a || lo > b ? null : [-Infinity, Infinity];
  }
  return dir > 0 ? [(a - x0) / v, (b + c - x0) / v] : [(x0 - b) / v, (x0 + c - a) / v];
}
// True when standing at x in lane would be hit during [t0, t1] from now.
function danger(g, lane, x, t0, t1, react) {
  if (lane < 1 || lane > LANES) return false;
  const a = x - CONFIG.HITBOX_W / 2, b = x + CONFIG.HITBOX_W / 2;
  const v = g.t < g.calmUntil ? 0 : g.laneSpeed(lane) * g.calmMul;
  for (const gs of g.gusts) {
    if (gs.lane !== lane) continue;
    const w = overlapWindow(gs.x, gs.dir, gs.len, v, a, b);
    if (w && w[0] <= t1 && w[1] >= t0) return true;
  }
  for (const tl of g.tele) {
    if (tl.lane !== lane) continue;
    if (react && tl.dur - tl.t < react) continue;   // not noticed yet
    const dir = laneDir(lane);
    const len = tl.wide ? CONFIG.WIDE_GUST_LEN : CONFIG.GUST_LEN[lane - 1];
    const lead = tl.wide ? tl.x + dir * CONFIG.WIDE_GUST_LEAD : tl.x + dir * len * CONFIG.SUDDEN_LEAD_FRAC;
    const tf = Math.max(0, tl.t);
    const w = overlapWindow(lead - dir * v * tf, dir, len, v, a, b);
    if (w && Math.max(w[0], tf) <= Math.min(w[1], t1) && w[1] >= t0) return true;
  }
  return false;
}
// Greedy dodging bot: steps up when the lane above looks clear for 0.6 s, sidesteps when threatened.
// Optional bot.react (s) delays noticing telegraphs; bot.every (ticks) slows decisions.
function botTick(g, bot) {
  if (bot.key) { g.keyUp(bot.key); bot.key = null; }
  if (g.state !== 'PLAYING') return;
  const p = g.p;
  if (g.t < p.cooldownUntil) return;
  if (bot.every && (bot.tick = (bot.tick || 0) + 1) % bot.every !== 0) return;
  const R = bot.react || 0;
  const threatened = p.lane >= 1 && danger(g, p.lane, p.x, 0, 0.3, R);
  let act = null;
  const upClear = p.lane >= LANES ? true : !danger(g, p.lane + 1, p.x, 0, 0.6, R);
  if (upClear && !(p.lane >= LANES && threatened)) act = 'ArrowUp';
  if (!act && (threatened || (p.lane >= 1 && p.stillT > 1.4))) {
    const order = bot.rng() < 0.5 ? [-1, 1] : [1, -1];
    const maxC = p.lane === 0 ? CONFIG.BOAT_MAX_COL : MAX_COL;
    for (const dx of order) {
      const c = p.col + dx;
      if (Math.abs(c) > maxC) continue;
      if (!danger(g, p.lane, colX(c), 0, 0.45, R)) { act = dx < 0 ? 'ArrowLeft' : 'ArrowRight'; break; }
    }
    if (!act && p.lane >= 1 && !(p.lane === 1 && Math.abs(p.col) > CONFIG.BOAT_MAX_COL) && !danger(g, p.lane - 1, p.x, 0, 0.45, R)) act = 'ArrowDown';
    if (!act) act = p.lane >= LANES ? 'ArrowUp' : (order[0] < 0 ? 'ArrowLeft' : 'ArrowRight');
  }
  if (act) { g.keyDown(act, false); bot.key = act; }
}

async function runSelfTest() {
  const STEP = 1 / 60;

  const until = (g, pred, maxS) => { const n = Math.round(maxS / STEP); for (let i = 0; i < n; i++) { if (pred(g)) return true; g.update(STEP); } return pred(g); };
  const run = (g, secs, each) => { const n = Math.round(secs / STEP); for (let i = 0; i < n; i++) { if (each) each(g); g.update(STEP); } };
  const yieldUI = () => new Promise(r => setTimeout(r, 0));

      if (type === 'reached') maxSeen = LANES;
