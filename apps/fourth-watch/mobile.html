    if (r % 10 === 9) await yieldUI();
  }
  check(9, 'Swipe controls: swipe ↑ and hold, or press and hold while He speaks, reaches Jesus; taps and earlier rests do not; turn ends are not skipped',
        a9 === n9 && b9 === n9 && k9 === n9 && c9 === 0 && d9 === 0 && e9 === n9 && f9 === n9 && g9 === n9 && h9 === n9 && i9 === n9,
        'swipe and hold ' + a9 + '/' + n9 + ' (' + t9lo.toFixed(3) + '–' + t9hi.toFixed(3) + ' s), press and hold ' + b9 + '/' + n9 +
        ', short rest = one step and hesitant dodge = dodge ' + k9 + '/' + n9 + ', walks from taps ' + c9 +
        ', from a swipe or finger held before the window ' + d9 + ', look ends walk ' + e9 + '/' + n9 +
        ', title tap ' + f9 + '/' + n9 + ', one swipe one step ' + g9 + '/' + n9 + ', time-up kept ' + h9 + '/' + n9 +
        ', second finger ' + i9 + '/' + n9);

  // 10: "Come": the wind flows on as always, yet while He speaks the way from the bow straight up to Him comes
  //     clear; stepping out of the boat there and going up without stopping reaches Jesus. Stopping, stepping
  //     aside, starting out on the sea or off the bow, or running without the Word does not.
  const upTap = g => { g.keyDown('ArrowUp', false); g.keyUp('ArrowUp'); };
  const tapEvery = (g, gap, secs, first) => {
    let next = g.turnT + (first || 0);
    for (let i = 0, n = Math.round(secs / STEP); i < n && g.state === 'PLAYING'; i++) {
      if (g.turnT >= next - 1e-9) { upTap(g); next += gap; }
      g.update(STEP);
    }
  };
  const press = (g, code, key) => { g.keyDown(code, false, key); g.keyUp(code); };
  const wordN = (g, k) => { for (let i = 0; i < k; i++) { until(g, x => !x.word, 20); until(g, x => !!x.word, 30); } };
  let a10 = 0, k10 = 0, b10 = 0, c10 = 0, cs10 = 0, d10 = 0, e10 = 0, f10 = 0, g10 = 0, h10 = 0, i10 = 0, j10 = 0;
  for (let r = 0; r < 200; r++) {
    const rr = mulberry32(12500 + r);
    // a: from the bow, leaving at any moment while the bubble shows, three to seven steps a second
    const g = make(12000 + r);
    until(g, x => !!x.word, 20);
    const ws = g.word.start;
    const off = rr() * (CONFIG.WORD_DURATION_S - 0.05);        // drawn once: any moment while the bubble shows
    until(g, x => x.turnT >= ws + off, 3);
    tapEvery(g, 0.15 + (1 / 3 - 0.15) * rr(), 9);
    if (g.state === 'REACHED' && g.stats.comeRuns === 1 && g.stats.wordWalks === 0) a10++;
    // a2: the slowest run the teacher is told about: leaving as the bubble ends, three steps a second
    const sl = make(12100 + r);
    until(sl, x => !!x.word, 20);
    const ws2 = sl.word.start;
    until(sl, x => x.turnT >= ws2 + CONFIG.WORD_DURATION_S - 0.04, 3);
    tapEvery(sl, 1 / 3, 9);
    if (sl.state === 'REACHED') k10++;
    // b: already out on the middle column as He speaks: ordinary steps, no run, never through
    const h = make(12200 + r);
    until(h, x => !!x.word, 20);
    const lane = 1 + Math.floor(rr() * LANES);
    Object.assign(h.p, { lane: lane, col: 0, x: CX, y: laneY(lane), stillT: 0 });
    tapEvery(h, CONFIG.WAY_PACE_S, 8, 0.05);
    if (!h.stats.reached && h.stats.comeRuns === 0) b10++;
    // c: stopping halfway (in lane 4) ends the run: he does not reach Jesus (and the wind usually comes)
    const k = make(12400 + r);
    let stopped = false;
    k.on((type, d) => { if (type === 'runEnd' && d.reason === 'stop') stopped = true; });
    until(k, x => !!x.word, 20);
    for (let s = 0; s < 4; s++) { upTap(k); run(k, 0.25); }
    run(k, 1.6);
    if (stopped && !k.stats.reached) c10++;
    if (k.stats.sinks > 0) cs10++;
    // d: stepping aside mid-run ends it at once ("he saw the wind")
    const q = make(12600 + r);
    let looked = false;
    q.on((type, d) => { if (type === 'runEnd' && d.reason === 'look') looked = true; });
    until(q, x => !!x.word, 20);
    for (let s = 0; s < 3; s++) { upTap(q); run(q, 0.25); }
    press(q, 'ArrowLeft');
    if (looked && !q.run) d10++;
    // e: the same run without the Word never gets through (the last lane is guarded)
    const o = make(12800 + r);
    o.nextWordAt = Infinity;
    for (let i = 0; i < 60 * 14 && o.state !== 'REACHED' && o.state !== 'TURN_END'; i++) {
      if (o.state === 'PLAYING' && i % 15 === 0) upTap(o);
      o.update(STEP);
    }
    if (!o.stats.reached) e10++;
    // f: stepping out of the boat beside the bow while He speaks is no run: ordinary steps, never through
    const f = make(13200 + r);
    const side = (r % 2 ? 1 : -1) * CONFIG.BOAT_MAX_COL;
    Object.assign(f.p, { col: side, x: colX(side) });
    until(f, x => !!x.word, 20);
    for (let i = 0; i < 60 * 10 && f.state !== 'REACHED' && f.state !== 'TURN_END'; i++) {
      if (f.state === 'PLAYING' && i % 15 === 0) upTap(f);
      f.update(STEP);
    }
    if (f.stats.comeRuns === 0 && !f.stats.reached) f10++;
    // g: the wind flows as always: every gust moves exactly its lane's speed each tick (none slows, stops or
    //    jumps), except while the wind has ceased after a respawn
    const w = make(13000 + r);
    let natural = true, seen = 0;
    let prev = new Map(w.gusts.map(x => [x, x.x]));
    for (let i = 0; i < 60 * 14; i++) {
      if (w.word && w.state === 'PLAYING' && i % 15 === 0) upTap(w);
      const still = w.t + STEP < w.calmUntil, cm = w.calmMul;
      w.update(STEP);
      for (const x of w.gusts) {
        if (!prev.has(x)) continue;
        const dx = x.x - prev.get(x), want = still ? 0 : x.dir * w.laneSpeed(x.lane) * cm * STEP;
        seen++;
        if (Math.abs(dx - want) > 1e-6) natural = false;
      }
      prev = new Map(w.gusts.map(x => [x, x.x]));
    }
    if (natural && seen > 0) g10++;
    // h: while He speaks, no gust crosses the way up from the bow in a lane while a run could be in it
    const m = make(13400 + r);
    until(m, x => !!x.word, 20);
    const st = m.word.start, hw = CONFIG.HITBOX_W / 2, cd = CONFIG.STEP_COOLDOWN_MS / 1000;
    let crossed = false;
    for (let i = 0; i < 60 * 6; i++) {
      m.update(STEP);
      for (const x of m.gusts) {
        const since = m.turnT - st;
        if (since < (x.lane - 1) * cd || since > CONFIG.WAY_START_S + x.lane * CONFIG.WAY_PACE_S) continue;
        const c = coreSpan(x);
        if (c[1] >= CX - hw && c[0] <= CX + hw) crossed = true;
      }
    }
    if (!crossed) h10++;
    // i: a difficulty key pressed before a later Word does not spoil that Word's way (the wind changes next turn)
    const dk = make(13600 + r);
    const keyAt = 1 + 10 * rr();
    until(dk, x => x.turnT >= keyAt, 12);
    press(dk, ['Digit1', 'Digit3'][r % 2], ['1', '3'][r % 2]);
    wordN(dk, 1);
    if (!dk.word) wordN(dk, 1);
    tapEvery(dk, 0.25, 9, 0.3);
    if (dk.state === 'REACHED') i10++;
    // j: the Word interval turned down just before He speaks does not spoil the Word after next
    const iv = make(13800 + r);
    press(iv, 'Minus', '-');                                   // 10 -> 9 s, early: the way after next moves
    until(iv, x => !!x.word, 20);
    until(iv, x => !x.word, 5);
    const w2 = iv.ways.find(x => !x.done), early = 0.05 + 0.3 * rr();
    until(iv, x => x.gt >= w2.at - early, 15);
    press(iv, 'Minus', '-');                                   // 9 -> 8 s, just before the second Word
    wordN(iv, 2);
    tapEvery(iv, 0.2, 9);                                      // out of the boat as He speaks
    if (iv.state === 'REACHED') j10++;
    if (r % 20 === 19) await yieldUI();
  }
  check(10, '"Come": the wind flows as always, yet while He speaks the way from the bow comes clear; stepping out and going up without stopping reaches Jesus, nothing else does',
        a10 === 200 && k10 === 200 && b10 === 200 && c10 === 200 && d10 === 200 && e10 === 200 && f10 === 200 && g10 === 200 && h10 === 200 &&
        i10 === 200 && j10 === 200,
        'run from the bow ' + a10 + '/200, slowest promised run ' + k10 + '/200, out on the sea never ' + b10 + '/200, stopping ends it ' + c10 + '/200 (then sank: ' + cs10 +
        '), stepping aside ends it ' + d10 + '/200, never through without the Word ' + e10 + '/200, beside the bow never ' + f10 +
        '/200, wind flows as always ' + g10 + '/200, way clear while He speaks ' + h10 + '/200, after a difficulty key ' + i10 +
        '/200, after a late interval key ' + j10 + '/200');

  const pass = results.every(x => x.pass);
  log(pass ? 'ALL PASS' : 'SOME CHECKS FAILED', '(' + ((performance.now() - t0) / 1000).toFixed(1) + ' s)');
  return { done: true, pass: pass, results: results };
}

// ============================================================================
// Boot: full-screen canvas, touch and keyboard input, main loop
// ============================================================================
const game = new Game();

game.on((type, d) => {
  switch (type) {
    case 'whoosh': Sound.whoosh(d.x); break;
    case 'sink': Sound.splash(); break;
    case 'mute': Sound.setMuted(d.muted); break;
    case 'reached': Sound.setWind(0.3); break;
    case 'turnStart': case 'respawn': Sound.setWind(1); break;
    case 'title': Sound.setWind(0.7); break;
    case 'turnEnd': Sound.setWind(0.55); break;
  }
});

// Sea level per state (matches the event wiring above); used when audio starts mid-state.
function windLevel(s) { return s === 'TITLE' ? 0.7 : s === 'TURN_END' ? 0.55 : s === 'REACHED' ? 0.3 : 1; }

// The canvas covers the whole screen; the 540 x 1080 frame is fitted inside the safe area
// (notch, home indicator) and the background fills the rest.
const safe = document.getElementById('safe');
let lastDpr = 0, lastVW = 0, lastVH = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.MAX_DPR);
  const vw = window.innerWidth, vh = window.innerHeight;
  lastDpr = dpr; lastVW = vw; lastVH = vh;
  const cs = getComputedStyle(safe);
  const it = parseFloat(cs.paddingTop) || 0, ir = parseFloat(cs.paddingRight) || 0;
  const ib = parseFloat(cs.paddingBottom) || 0, il = parseFloat(cs.paddingLeft) || 0;
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  canvas.width = Math.max(1, Math.round(vw * dpr));
  canvas.height = Math.max(1, Math.round(vh * dpr));
  const aw = Math.max(1, vw - il - ir), ah = Math.max(1, vh - it - ib);
  const s = Math.min(aw / W, ah / H);
  VIEW.css = s;
  VIEW.cssX = il + (aw - W * s) / 2;
  VIEW.cssY = it + (ah - H * s) / 2;
  VIEW.s = s * dpr; VIEW.ox = VIEW.cssX * dpr; VIEW.oy = VIEW.cssY * dpr;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

// Keyboard works too (tablets with keyboards, and trying the phone version on a computer).
const BLOCK = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1, Tab: 1 };
// Esc is not a user activation; creating audio without one only leaves it suspended with warnings.
function mayUnlock(e) {
  return !SELFTEST && e.code !== 'Escape' && (!navigator.userActivation || navigator.userActivation.isActive);
}
window.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (BLOCK[e.code]) e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey || sideways) return;
  game.keyDown(e.code || e.key, e.repeat, e.key);   // first, so an opening M mutes before any sound exists
  if (mayUnlock(e)) Sound.unlock(windLevel(game.state));
});
window.addEventListener('keyup', e => {
  if (e.key === 'Meta') game.releaseAll();           // macOS drops key-ups for keys released while Cmd is held
  else game.keyUp(e.code || e.key);
});
window.addEventListener('blur', () => { gestures.cancel(); game.releaseAll(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { gestures.cancel(); game.releaseAll(); Sound.suspend(); }
  else Sound.resume();
});

// Touch: every pointer (finger, pen, or a mouse when trying it on a computer) drives the swipe controls.
const gestures = new Gestures(game, CONFIG);
const nowS = () => performance.now() / 1000;
function onMuteButton(e) {
  const x = (e.clientX - VIEW.cssX) / VIEW.css, y = (e.clientY - VIEW.cssY) / VIEW.css;
  return Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) <= MUTE_BTN.r + 16;
}
window.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (sideways) return;                               // waiting for the phone to be turned upright
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (onMuteButton(e)) { game.keyDown('KeyM', false, 'm'); game.keyUp('KeyM'); return; }
  gestures.down(e.pointerId, e.clientX, e.clientY, nowS());
}, { passive: false });
window.addEventListener('pointermove', e => gestures.move(e.pointerId, e.clientX, e.clientY));
window.addEventListener('pointerup', e => {
  gestures.up(e.pointerId);
  if (!SELFTEST) Sound.unlock(windLevel(game.state));   // touch grants audio on release
  guardBack();
});
window.addEventListener('pointercancel', e => gestures.cancel(e.pointerId));
// iOS: audio may only start inside touchend; no scrolling, zooming or long-press menus under a swipe.
document.addEventListener('touchend', () => { if (!SELFTEST) Sound.unlock(windLevel(game.state)); }, { passive: true });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
// A swipe from the screen edge (iOS Safari back, Android gesture navigation) during a turn should not leave
// the game: the first Back is caught; a second one within 2 s, or Back between turns, leaves as usual.
// Pushed on a release, which counts as a user action, so the browser keeps the entry.
let guarded = false, backAt = -1e9;
function guardBack() {
  if (SELFTEST || guarded || game.state === 'TITLE') return;
  guarded = true;
  history.pushState({ fw: 1 }, '');
}
window.addEventListener('popstate', () => {
  guarded = false;
  const now = performance.now();
  if (game.state === 'TITLE' || game.state === 'TURN_END' || now - backAt < 2000) { history.back(); return; }
  backAt = now;
  guardBack();
});
// A phone held sideways would show the portrait frame tiny, so the game waits until it is upright again
// (tablets keep the side-curtained layout).
const PHONE = Math.min(screen.width, screen.height) < 600;
let sideways = false;

const STEP = 1 / 60;
let last = performance.now(), acc = 0, fps = 60;
function frame(now) {
  // Rotation, the toolbar sliding away or a new pixel ratio do not always fire a resize event.
  if (Math.min(window.devicePixelRatio || 1, CONFIG.MAX_DPR) !== lastDpr ||
      window.innerWidth !== lastVW || window.innerHeight !== lastVH) resize();
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0) fps = fps * 0.95 + (1 / dt) * 0.05;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  const side = PHONE && window.innerWidth > window.innerHeight;
  if (side && !sideways) { gestures.cancel(); game.releaseAll(); }
  sideways = side;
  if (sideways) acc = 0;                              // the turn clock waits too
  gestures.tick(now / 1000);
  let n = 0;
  while (acc >= STEP && n < 20) { game.update(STEP); acc -= STEP; n++; }
  Sound.update();
  if (sideways) drawTurnUpright(); else render(game, fps);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); });
canvas.focus();

if (SELFTEST) {
  window.__selftest = null;
  setTimeout(() => {
    runSelfTest().then(r => { window.__selftest = r; })
      .catch(err => { console.warn('[selftest] crashed', err); window.__selftest = { done: true, pass: false, results: [{ id: 0, name: 'crash: ' + err, pass: false }] }; });
  }, 30);
}
</script>
</body>
