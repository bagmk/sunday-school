    beats: [
      // ---------------------------------------------------------------

          ko: "하난이 말한다. “선생님, 예수라는 사람이 오늘 돌아온대요. 병도 고친대요!”",
          en: "Hanan says, “Teacher, this Jesus is coming back today. They say he heals the sick, too!”"

        options: [
          {
            id: "a",
            // The flag drives the highlight of the Ps 103:3 echo at the first words.
            set: { dawn: "lord" },
            text: { ko: "“병은 주님이 고치신다. 직접 가서 보자.”", en: "“Healing is the Lord's work. Let's go and see.”" }
          },
          {
            id: "b",
            bad: "typo",
            text: { ko: "“잠깐, 이 글자 오타 아니냐?”", en: "“Wait—is this letter a typo?”" },
            reaction: [
              { type: "line", speaker: "menahem", text: { ko: "하난, 등잔 좀 더 가까이 대 봐라.", en: "Hanan, bring the lamp closer." } }
            ]
          }
        ]
      },

      // ---------------------------------------------------------------
      // LATE MORNING: THE LANE (SPEC 6.3). The passerby's line is byte-identical to the SPEC.
      // They step aside; Menahem's eyes meet Asher's; neither says a word to the other.
      // No reaction on c2's continue option: the cut path at c4 (rebuttal) is at the 20-screen cap.

      // ---------------------------------------------------------------
      { id: "lane", type: "scene", bg: "lane", caption: { ko: "늦은 아침 · 골목", en: "Late morning · The lane" } },
      { type: "line", text: { ko: "므나헴과 하난이 골목을 내려간다. 뒤에서 사람들이 누군가를 침상째 들고 온다.", en: "Menahem and Hanan head down the lane. Behind them, some men are carrying someone on a bed." } },

      { type: "line", text: { ko: "두 사람은 벽 쪽으로 비켜선다. 그 순간, 므나헴과 침상 위 아셀의 눈이 마주친다. 서로 아무 말도 하지 않는다.", en: "The two step back against the wall. For a moment, Menahem looks right at Asher, the man on the bed, and Asher looks back. Neither says a word." } },
      {
        type: "choice",
        id: "c2",
        prompt: { ko: "행인의 말이 아직 귀에 남아 있다. 므나헴은?", en: "The passerby's words still hang in the air. What does Menahem do?" },
        options: [
          {
            id: "a",
            text: { ko: "속으로 그 사람을 위해 기도한다.", en: "Silently pray for the man." }
          },
          {
            id: "b",
            // Job's friends said it too, and God rebuked them (Job 42:7).
            text: { ko: "“그러게. 다 이유가 있겠지.”", en: "“Right. There's always a reason.”" },
            scold: {
              speaker: "hanan",
              text: { ko: "선생님, 그건 좀… 욥의 친구들도 그렇게 말했다가 혼났잖아요.", en: "Teacher, um… Job's friends said the same thing, and God told them off." }
            }
          },
          {
            id: "c",
            // The quarrel: pedantry about words, not about the man. The passerby talks back (made-up lines).
            bad: "wordWar",
            text: { ko: "“잠깐, 용어 정의부터 합시다.”", en: "“Hold on. Let's define our terms.”" },
            reaction: [
              { type: "line", speaker: "passerby", text: { ko: "정의는 무슨 정의요? 잘못이면 잘못이지.", en: "Define what? Wrong is wrong." } }
            ]
          },
          {
            id: "d",
            // He backs away from the passerby's talk (not from the man on the bed).
            bad: "dyeVat",
            text: { ko: "괜히 엮이지 말자. 슬금슬금 물러난다.", en: "Stay out of it. Back away slowly." },
            reaction: [
              { type: "line", speaker: "hanan", text: { ko: "선생님? 선생님, 뒤에…!", en: "Teacher? Teacher, behind you—!" } }
            ]
          }
        ]
      },

      // ---------------------------------------------------------------
      // AROUND NOON: THE CROWD, fixed order of SPEC 6.4 (MT_9_1 omitted; optional).
      // ---------------------------------------------------------------
      { id: "crowd", type: "scene", bg: "crowd", caption: { ko: "정오 무렵 · 바닷가", en: "Around noon · By the shore" } },
      { type: "fx", fx: "light", level: "soft" },
      // A small callback to c2 (praying is the one way through the lane that keeps the story going).
      { type: "line", text: { ko: "므나헴은 맨 앞, 서기관 몇 사람 틈에 선다. 골목에서 기도해 준 그 사람이 침상째 실려 들어온다.", en: "Menahem stands at the very front with a few other scribes. The man he prayed for in the lane is carried in on his bed." } },
      { type: "verse", key: "MT_9_2A" },

      // The first words: bright light, the world goes quiet, the morning's psalm comes back.
      { id: "first-words", type: "fx", fx: "light", level: "bright" },
      { type: "fx", fx: "hush" },
      { type: "verse", key: "MT_9_2B" },
      {
        type: "fx",
        fx: "echoVerse",
        key: "PS_103_3",
        highlight: { flag: "dawn", map: { lord: { ko: ["그가", "사하시며"], en: ["who forgives"] } } }
      },
      { type: "line", speaker: "thought", text: { ko: "병 고치는 걸 보러 왔는데… 죄를 사한다고? 그건 주님이 하시는 일이다.", en: "I came to see a healing. He's forgiving sins? That's the Lord's work." } },
      { type: "fx", fx: "light", level: "soft" },

      // Matt 9:3 as Menahem's own unspoken thought; it stays pinned until the read receipt at 9:4.
      { id: "thought-9-3", type: "verse", key: "MT_9_3Q", speaker: "scribes" },
      { type: "fx", fx: "pinThought", items: ["verse:MT_9_3Q"] },
      {
        type: "choice",
        id: "c3",
        prompt: { ko: "므나헴은 아직 한마디도 입 밖에 내지 않았다. 이제 어떻게 할까?", en: "Menahem hasn't said a word out loud. Now what?" },
        options: [
          {
            id: "a",
            bad: "guardhouse",
            text: { ko: "“신성모독이다!” 외치며 앞으로 나간다.", en: "Shout “Blasphemy!” and push forward." }
          },
          {
            id: "b",
            text: { ko: "기록장에 ‘신성모독’이라고 크게 쓴다.", en: "Write ‘BLASPHEMY’ in his notes, in huge letters." },
            scold: {
              speaker: "hanan",
              text: { ko: "선생님, 그건 좀… 그렇게 크게 쓰시면 소리치시는 거랑 똑같아요.", en: "Teacher, um… writing it that big is basically shouting." }
            }
          },
          {
            id: "c",
            // Not a walk-out: he goes to check the man's authority (Matt 9:6 answers it) and the crowd
            // swallows him before he can ask. He never says it aloud.
            bad: "permit",
            text: { ko: "죄 사함 허가증이 있나? 확인하러 간다.", en: "Go check if he has a permit to forgive sins." },
            reaction: [
              { type: "line", text: { ko: "므나헴이 앞줄에서 한 발 나서자, 무리가 확 밀려든다. 뒤로, 뒤로, 또 뒤로…", en: "Menahem steps out of the front row, and the crowd surges in. He's swept back, and back, and back…" } }
            ]
          },
          {
            id: "d",
            text: { ko: "속으로 삼킨다. 끝까지 지켜본다.", en: "Keep it inside. Watch to the end." }
          }
        ]
      },

      // Matt 9:4: the thought no one heard is answered. Read receipt on the pinned bubble.
      { id: "read-receipt", type: "fx", fx: "readReceipt" },
      { type: "verse", key: "MT_9_4N" },
      { type: "verse", key: "MT_9_4Q" },
      { type: "fx", fx: "unpinThought" },
      { type: "verse", key: "MT_9_5" },
      {
        type: "choice",
        id: "c4",
        prompt: { ko: "어느 쪽이 쉬울까?", en: "Which is easier?" },
        options: [
          {
            id: "a",
            text: { ko: "말로는 죄 사함이 쉽지. 아무도 확인 못 하니까.", en: "Forgiveness is easier to say. Nobody can check it." },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "확인 못 하는 말은 누구나 할 수 있지.", en: "Anyone can say something nobody can check." } }
            ]
          },
          {
            id: "b",
            bad: "rebuttal",
            text: { ko: "당장 집에 가서 반박문을 쓴다.", en: "Rush home and write a rebuttal." }
          },
          {
            id: "c",
            text: { ko: "말로는 둘 다 쉽다. 증명이 어렵지.", en: "Both are easy to say. Proving it is hard." },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "그럼 증명해 봐라.", en: "Then prove it." } }
            ]
          }
        ]
      },

      // Matt 9:6-9:8: the claim, the command, he rises, the crowd.
      { type: "verse", key: "MT_9_6A" },
      { type: "verse", key: "MT_9_6N" },
      { type: "fx", fx: "light", level: "bright" },
      { type: "verse", key: "MT_9_6B" },
      { type: "fx", fx: "light", level: "soft" },
      { type: "verse", key: "MT_9_7" },
      { type: "verse", key: "MT_9_8" },
      {
        type: "choice",
        id: "c5",
        prompt: { ko: "모두가 하나님께 영광을 돌린다. 그 사이에서 므나헴은?", en: "Everyone around him is giving glory to God. What does Menahem do?" },
        options: [
          {
            id: "a",
            text: { ko: "침상을 들고 가는 그 사람을 본다.", en: "Watch the man carry his bed away." }
          },
          {
            id: "b",
            text: { ko: "예수라는 사람을 다시 본다. 누구지?", en: "Look at this Jesus again. Who is he?" }
          },
          {
            id: "c",
            text: { ko: "소리 없이 하나님께 영광을 돌린다.", en: "Give glory to God, without a sound." }

          {
            id: "d",
            text: { ko: "못 본 걸로 한다.", en: "Pretend it never happened." },
            scold: {
              speaker: "hanan",
              text: { ko: "선생님, 그건 좀… 저 사람 지금 침상 들고 바로 앞을 지나가는데요.", en: "Teacher, um… he's walking right past us. With his bed." }

    endings: {
      // The one true ending: title card -> memory verse (engine) -> beats -> last.
      good: {
        title: { ko: "남은 질문 하나", en: "One Question Left" },
        verse: "MT_9_6A",
        beats: [
          // The light leaves with the moment, after the memory verse card.
          { type: "fx", fx: "light", level: "off" },

          { when: { choice: "c5", is: "a" }, type: "line", speaker: "thought", text: { ko: "그 권능으로 아무도 벌하지 않았다. 그저 한 사람을 집으로 돌려보냈다.", en: "He didn't use that authority to punish anyone. He just sent a man home." } },
          { when: { choice: "c5", is: "b" }, type: "line", speaker: "thought", text: { ko: "죄를 사하는 건 하나님의 일이다. 그런데 그 일을 저 사람이 했다.", en: "Forgiving sins is God's work. And that man just did it." } },
          { when: { choice: "c5", is: "c" }, type: "line", text: { ko: "무리 속에서 므나헴의 입술도 소리 없이 움직인다. 하나님께 영광을.", en: "In the crowd, Menahem's lips move too, without a sound. Glory to God." } },

          { type: "line", speaker: "thought", text: { ko: "인자…? 다니엘이 밤 환상 중에 본, 하늘 구름을 타고 오는 그 인자 말인가.", en: "Son of Man…? The one Daniel saw in a night vision, coming with the clouds of heaven?" } },
          { type: "verse", key: "DN_7_14A" }
        ],
        last: { ko: "하나님에 대해서는 네가 옳았다. 남은 질문은 하나다. 저 사람은 누구인가.", en: "You were right about God. That leaves one question: who is this man?" }
      },

      // Cut branches: the story stops here (snip card, Try again). The event itself never changes.
      bad: {
        // c1 b: the scroll eats the whole day.
        typo: {
          title: { ko: "오타 사냥", en: "Typo Hunt" },
          beats: [
            { type: "line", text: { ko: "므나헴은 시편을 처음부터 한 글자씩 짚어 나간다. 하난은 자꾸 문 쪽을 본다.", en: "Menahem goes through the Psalms letter by letter, from the very start. Hanan keeps glancing at the door." } },
            { type: "line", text: { ko: "해가 높이 떴다. 바닷가 쪽에서 큰 함성이 들린다. 므나헴은 고개도 들지 않는다.", en: "The sun is high now. A huge shout rises from the shore. Menahem doesn't even look up." } },
            { type: "line", speaker: "hanan", text: { ko: "선생님! 걷지 못하던 사람이 자기 침상을 들고 걸어서 집에 갔대요!", en: "Teacher! They say a man who couldn't walk just carried his own bed home!" } }
          ],
          last: { ko: "그날 므나헴은 ‘고치시며’라는 단어를 백 번은 확인했다. 정작 병이 나은 건 바닷가에서였다.", en: "That day, Menahem checked the word ‘heals’ a hundred times. The actual healing happened down at the shore." }
        },

        // c2 c: a word war with the passerby over the words for "sin" (Ps 32:5 uses all three) lasts
        // all day. The man walks home through the same lane, and they step aside without noticing.
        wordWar: {
          title: { ko: "말꼬리 대전", en: "The Great Nitpick" },
          beats: [
            // He first denies the premise (no cause is given in Matthew), then gets lost in the vocabulary.
            { type: "line", speaker: "menahem", text: { ko: "잘못이라니! 저 사람이 뭘 잘못해서 저렇게 됐다고 누가 그랬소? 게다가 죄, 죄악, 허물은 히브리어로 다 다른 말이오!", en: "Wrong? Who says he did something to end up like that? Besides, sin, iniquity, transgression—in Hebrew, those are three different words!" } },
            { type: "line", text: { ko: "“다 같은 말이지!” “같은 말이라니!” 창문마다 구경꾼이 고개를 내민다. 하난은 벽에 기대 한숨만 쉰다.", en: "“It's all the same!” “The same?!” Heads pop out of every window. Hanan leans on the wall and sighs." } },
            { type: "line", text: { ko: "얼마 뒤, 아침에 침상에 실려 가던 그 사람이 자기 침상을 들고 집으로 간다. 두 사람은 말싸움을 멈추지도 않고 나란히 비켜선다.", en: "Later, the man who was carried down on that bed walks by on his way home, carrying it. Without missing a word, the two step aside for him." } }
          ],
          last: { ko: "해 질 녘, 므나헴은 ‘죄’를 완벽하게 정의해 냈다. 바닷가에서는 벌써 죄가 사해진 뒤였다.", en: "By sunset, Menahem had defined ‘sin’ perfectly. Down at the shore, sins had already been forgiven." }
        },

        // c2 d: backing away from the passerby's talk, he sits down in a dyer's vat. Wet and blue, not hurt.
        dyeVat: {
          title: { ko: "파란 서기관", en: "The Blue Scribe" },
          beats: [
            { type: "line", text: { ko: "첨벙! 므나헴이 염색집 항아리에 엉덩이부터 빠진다.", en: "Splash! Menahem lands bottom-first in a dyer's vat." } },
            { type: "line", text: { ko: "항아리에서 기어 나온 므나헴은 수염까지 새파랗다. 이 꼴로는 아무 데도 못 간다. 뒷골목으로 집에 숨어든다.", en: "He climbs out blue, beard and all. He can't go anywhere like this. He sneaks home through the back alleys." } },
            { type: "scene", bg: "lamp_night", caption: { ko: "저녁 · 므나헴의 방", en: "Evening · Menahem's room" } },

          ],
          last: t("평생 제일 많이 잡은 날. 하필 아무도 고기 얘기를 안 하는 날이었다.", "The biggest catch of his life—on the one day nobody cared about fish.")
        },

            say("passerby", "방금 건 연습이야! 삼세판! …아니, 다섯 판!", "That one was just practice! Best of three! …No, best of five!")

          // Not Asher walking up the lane: that picture belongs to stayedInLane, at the same choice.

            "The passerby took it back only after losing every single round. Meanwhile, down at the shore, Asher stood up."
          )
        },

        // c3 d: he sets the bed down because everyone is staring; the others carry Asher on.
        stayedInLane: {
          title: t("오늘은 안 돼", "Not Today"),
          beats: [
            say(null, "한참 뒤, 누군가 골목을 걸어 올라온다. 자기 침상을 든 아셀이다.", "A long while later, someone comes walking up the lane. It's Asher, carrying his own bed."),
            // Asher's own words carry the first words this branch never heard (forgiveness, then healing).
            say(
              null,
              "아셀이 요나를 지나며 씩 웃는다. “그분이 나한테 먼저 하신 말씀이 있어. 나중에 들려줄게.”",
              "Asher grins as he passes Yonah. “He said something to me first. I'll tell you later.”"
            )
          ],
          last: t("결국 다들 쳐다보긴 했다. 걸어 올라오는 아셀을.", "Everyone stared after all—at Asher, walking up the lane.")
        },

        // c4 d: he faints from excitement right after the first words, misses everything after them, and
        // wakes up on the very bed he brought, with Asher (walking) on one of its corners. The event holds:
        // Asher rose, picked up his bed and went home (MT 9:7); it just had Yonah on it.
        // The scene keeps the normal pov: the sky_carried art already shows the view from the bed, and a
        // lying pov here would replay Asher's rise animation on Try again.
        fainted: {
          title: t("자리 바꾸기", "Switching Places"),
          beats: [
            { type: "scene", bg: "sky_carried", caption: t("오후 · 집으로 가는 길", "Afternoon · The road home") },
            say(null, "요나가 눈을 뜬다. 하늘이 흔들거린다. 누가 요나를 침상째 들고 가고 있다.", "Yonah opens his eyes. The sky is swaying. Someone is carrying him on a bed."),
            say(
              null,
              "침상 귀퉁이를 잡은 손 하나를 따라 올려다본다. 아셀이다. 걸으면서 침상을 들고 있다.",
              "He follows one of the hands on the corners up to a face. It's Asher—walking, and carrying the bed."
            ),
            say(null, "아셀이 요나를 내려다보며 웃는다. “깼어? 이번엔 내가 들 차례야.”", "Asher looks down at him and grins. “You're up? My turn to carry.”")
          ],
          last: t("그날 아셀은 자기 침상을 들고 집에 갔다. 생각보다 좀 무거웠다.", "That day, Asher picked up his bed and went home. It was a little heavier than he expected.")

      }
    }
  };

<script>/* data/routes/asher.js */
/* Asher route, version 4 (story mode): "What Did He Call Me?" Owner: asher writer.
 * Rules: docs/SPEC.md, version 4.1 (route shape, choices and endings: sections 3.5, 4.5, 4.6, 8).
 * Schema basics, canon and guardrails: docs/SPEC.md §4.5, §6, §7.
 *
 * Shape: six choices c1-c6. Every option has exactly one outcome:
 * - continue (no `bad`, no `scold`), with an optional one-beat reaction;
 * - `bad: "<id>"`: its reaction plays, then endings.bad[<id>] (a cut branch, closed by the snip card);
 * - `scold: { speaker, text }`: the line plays, the option is removed, the same choice is asked again.
 *   Asher's "can't" options (Get up / Go outside / Try to get up) use the scold mechanic with
 *   speaker "thought"; every other scold comes from Yonah.
 * Choice map (continue / cut branch / scold):
 * - c1 dawn:                    a, d continue | c cut nap        | b "can't" thought
 * - c2 Yonah at the door:       a continue    | b cut hotSprings, d cut stayedHome | c "can't" thought
 * - c3 THE LANE:                a continue    | b cut fishChase (the quarrel), d cut longWay | c Yonah
 * - c4 THE CROWD, at its edge:  a continue    | b cut bedSurf    | c Yonah (the bargain)
 * - c5 after MT_9_2B2:          b, d continue | a "can't" thought, c Yonah
 * - c6 after MT_9_8:            b continue    | a Yonah
 * Teacher's v4.1 note: the lane has a comic quarrel that ends in an absurd cut (fishChase), and the
 * crowd has an absurd cut that is not just leaving (bedSurf). Asher's cuts all happen before he
 * reaches Jesus: in his own branches he is simply not there, so Matt 9:2-8 itself never changes.
 * No persistent action buttons (teacher's third note): the old gray buttons are ordinary options,
 * and the "Get up" press after MT_9_6B is a one-off label press that finally works.
 * Conditions on a choice refer to the pick that moved the story on (a scolded pick is not a pick).
 * True path: 29 screens on every combination of continue options (choice, line, verse and press
 * beats, plus the memory verse card, the ending beat and the last line).
 */
(function () {
  var BHS = (window.BHS = window.BHS || {});
  BHS.routes = BHS.routes || {};

  // Tiny builders. They only return plain objects in the SPEC §4.5 shape.
  function t(ko, en) {
    return { ko: ko, en: en };
  }
  function withId(b, id) {
    if (id) b.id = id;
    return b;
  }
  function line(ko, en, id) {
    return withId({ type: "line", text: t(ko, en) }, id);
  }
  function say(speaker, ko, en, id) {
    return withId({ type: "line", speaker: speaker, text: t(ko, en) }, id);
  }
  function thought(ko, en, id) {
    return say("thought", ko, en, id);
  }
  function sign(ko, en, id) {
    return say("sign", ko, en, id);
  }
  function verse(key, id) {
    return withId({ type: "verse", key: key }, id);
  }
  function scene(bg, pov, ko, en, time) {
    var b = { type: "scene", bg: bg, pov: pov };
    if (ko) b.caption = t(ko, en);
    if (time) b.time = time;
    return b;
  }
  function fx(name, params) {
    var b = { type: "fx", fx: name };
    if (params) {
      for (var k in params) {
        if (Object.prototype.hasOwnProperty.call(params, k)) b[k] = params[k];
      }
    }
    return b;
  }
  function press(ko, en, id) {
    return withId({ type: "press", label: t(ko, en) }, id);
  }
  function when(cond, beat) {
    beat.when = cond;
    return beat;
  }
  function choice(id, ko, en, options) {
    return { type: "choice", id: id, prompt: t(ko, en), options: options };
  }

  // Option builders: go = continue, snip = cut branch (endings.bad), nope = scold (option removed).
  function go(id, ko, en, reaction) {
    var o = { id: id, text: t(ko, en) };
    if (reaction) o.reaction = reaction;
    return o;
  }
  function snip(id, ko, en, endingId, reaction) {
    var o = { id: id, text: t(ko, en), bad: endingId };
    if (reaction) o.reaction = reaction;
    return o;
  }
  function nope(id, ko, en, speaker, sko, sen) {
    return { id: id, text: t(ko, en), scold: { speaker: speaker, text: t(sko, sen) } };
  }

  BHS.routes.asher = {
    id: "asher",

    beats: [
      // ---------- Dawn, on his back (lying POV) ----------
      scene("asher_ceiling", "lying", "새벽 · 아셀의 집", "Dawn · Asher's house"),

      // c1: one psalm among livelier options. Neither continue option has a reaction:
      // Yonah's arrival (the c2 prompt) cuts into the prayer or the counting.
      choice("c1", "눈 뜨면 또 이 천장. 벌써 네 해째다. 오늘 아침엔 뭘 하지?", "Same ceiling again. Four years now. What should I do this morning?", [
        go("a", "{{v:PS_41_4Q}}", "{{v:PS_41_4Q}}"),
        nope("b", "일어나기", "Get up", "thought", "다리가 대답하지 않는다.", "My legs don't answer."),
        snip("c", "“오 분만 더…”", "“Five more minutes…”", "nap", [
          line("아셀이 갈색 겉옷을 머리끝까지 끌어당긴다.", "Asher pulls his brown cloak up over his head.")
        ]),
        go("d", "들보를 또 센다. 하나, 둘, 셋…", "Count the beams again. One, two, three…")
      ]),

      // ---------- Morning: Yonah at the door ----------
      scene("asher_ceiling", "lying", "아침 · 아셀의 집", "Morning · Asher's house"),
      // Yonah's words are the friend route's words. "Shouts" (not "bursts in") so the prompt still
      // reads naturally when the choice is asked again after a removed option.
      choice("c2", "문간에서 요나가 숨을 헐떡이며 외친다. “아셀! 그분이 배로 돌아오신대. 같이 가자!”", "Yonah stands in the doorway, out of breath. “Asher! Jesus is coming back by boat. Come with me!”", [
        go("a", "“가고 싶어. 근데 겁나.”", "“I want to go. But I'm scared.”", [
          say("yonah", "겁나도 돼. 드는 건 우리가 할게.", "It's okay to be scared. We'll do the carrying.")
        ]),
        snip("b", "“차라리 디베랴 온천에 데려가 줘.”", "“Take me to the Tiberias hot springs instead.”", "hotSprings", [
          say("yonah", "온천? …좋아, 배 타고 가면 금방이지!", "Hot springs? …Sure. By boat it's no time at all!")
        ]),
        nope("c", "밖으로 나가기", "Go outside", "thought", "문은 바로 저긴데, 혼자서는 못 간다.", "The door is right there. I can't get there on my own."),
        // Teacher's fourth note: if he won't go out, the story stops here. No scold, no second chance.
        snip("d", "“싫어. 안 나가.”", "“No. I'm not going out.”", "stayedHome", [
          say("yonah", "…알았어. 억지로는 안 데려가.", "…Okay. I won't drag you.")
        ])
      ]),

      // ---------- THE LANE (SPEC §6.3), carried POV ----------
      scene("sky_carried", "lying", "늦은 아침 · 골목", "Late morning · The lane"),
      say(
        "passerby",
        "고통 뒤에 무슨 사연이 있는지 누가 알겠어. 저 사람은 무슨 잘못을 했기에 저렇게 됐을까.",
        "Who knows what's behind suffering like that. What did he do to end up like that?",
        "lane-passerby"
      ),
      // c3: the comeback answers the passerby; Menahem's silent moment closes the lane after it.
      // Top row talks back to the passerby, bottom row asks Yonah to get away from him.
      choice("c3", "저 사람, 내가 못 듣는 줄 아나?", "Does he think I can't hear him?", [
        go("a", "“다 들리거든요?”", "“I can hear you, you know.”"),
        // The quarrel (teacher's v4.1 note). It stays a war of words; the passerby speaks after the
        // fixed SPEC §6.3 line only inside this branch.
        snip("b", "“아저씨 사연부터 들어 볼까요?”", "“How about *your* backstory first?”", "fishChase", [
          say("passerby", "사연은 무슨! 나는 그런 거 없어!", "My backstory? I don't have one!")
        ]),
        nope("c", "“요나, 내려 줘. 집에 갈래.”", "“Yonah, put me down. I'm going home.”", "yonah", "안 돼! 다 왔는데 어딜 가.", "Nope! We're almost there!"),
        snip("d", "“요나, 사람 없는 뒷길로 가자.”", "“Yonah, take the back way. Away from people.”", "longWay", [
          say("yonah", "…알았어. 좀 돌아가도 괜찮겠지.", "…Okay. A little detour can't hurt.")
        ])
      ]),
      line(
        "회당에서 보던 서기관 므나헴이 제자와 함께 비켜선다. 잠깐 서로 눈이 마주친다. 둘 다 아무 말이 없다.",
        "Menahem, a scribe from the synagogue, steps aside with his student. For a moment, his eyes meet Asher's. Neither says a word.",
        "lane-menahem"
      ),

      // ---------- THE CROWD (SPEC §6.4) ----------
      // c4: the edge of the crowd, still carried. He can't see Jesus yet, so the light stays off.
      // The crowd cut sits here, before MT_9_2A, on purpose: Asher never leaves once Jesus has
      // spoken to him, so in his own branches he simply never gets there and the event stays whole.
      scene("sky_carried", "lying", "정오 무렵 · 바닷가 공터", "Around noon · Open ground by the shore"),
      choice("c4", "바닷가 공터가 사람들로 꽉 찼다. 보이는 건 하늘이랑 팔꿈치뿐이다.", "The open ground by the shore is packed. All I can see is sky and elbows.", [
        // No reaction: the scene change and MT_9_2A ("some people brought to him...") carry him in.
        go("a", "“요나, 손 놓지 마.”", "“Yonah, don't let go.”"),
        snip("b", "“저 좀 앞으로 보내 주세요!”", "“Could you pass me to the front?”", "bedSurf", [
          line("“앞으로!” 사방에서 손이 뻗어 와 침상을 번쩍 든다. 침상이 머리 위로, 손에서 손으로 넘어간다.", "“To the front!” Hands reach in from every side and lift the bed high. Over everyone's heads it goes, hand to hand.")
        ]),
        // The haggling is what gets scolded, not the wish to be healed: his friends brought him for that.
        nope("c", "“고쳐 주시면 요나네 생선 평생 공짜!”", "“Heal me, and Yonah's fish are free for life!”", "yonah", "흥정하는 거 아니야! …그리고 그거 내 생선이거든?", "We're not here to haggle! …And those are my fish, by the way.")
      ]),

      // The bed is set down before him (faces above, light); MT_9_2A narrates it.
      scene("crowd_lying", "lying", "정오 무렵 · 그분 앞", "Around noon · In front of Jesus"),
      fx("light", { level: "soft" }),
      verse("MT_9_2A"),
      fx("light", { level: "bright" }),
      verse("MT_9_2B1", "first-words-1"),
      // Route title moment. The word means "child"; paraphrased, never quoted.
      thought("나를 뭐라고 부르셨지? 꼭 어린아이를 부르듯이.", "What did he just call me? Son—the way you'd call a little kid.", "what-did-he-call-me"),
      fx("hush"),
      verse("MT_9_2B2", "first-words-2"),
      fx("light", { level: "soft" }),

      // c5: no option carries a "right answer" feel. Trying to stand still answers that nothing has
      // changed (no "sin removed, body released"; SPEC §7.2).
      choice("c5", "죄를 용서받았다고 하셨다. 이제 어쩌지?", "He said my sins are forgiven. Now what?", [
        nope("a", "일어나 본다.", "Try to get up.", "thought", "다리는 그대로다.", "My legs haven't changed."),
        go("b", "정말 나한테 하시는 말씀인가?", "Is he really saying this to me?", [
          // Calls back his only way out of the house: "I want to go. But I'm scared."
          thought("다른 누구도 아니고, 아침에 겁난다던 나한테.", "Not to anyone else. To me, the guy who said he was scared this morning.")
        ]),
        nope("c", "“저기요… 제 다리는요?”", "“Um… what about my legs?”", "yonah", "쉿! 아직 말씀 중이시잖아.", "Shh! He's not finished!"),
        go("d", "그럼 내 잘못이었다는 건가?", "So it was my fault after all?", [
          // His own noticing, not a narrator's ruling (SPEC §7.2). The variant recalls the c1 psalm.
          when(
            { choice: "c1", is: "a" },
            thought("아침에 기도할 때도 그게 무서웠다. 그런데 그 말씀 어디에도 ‘때문에’라는 말은 없었다.", "That's what scared me when I prayed this morning. But nothing he said had a ‘because’ in it.")
          ),
          when({ not: { choice: "c1", is: "a" } }, thought("그런데 그 말씀 어디에도 ‘때문에’라는 말은 없었다.", "But nothing he said had a ‘because’ in it."))
        ])
      ]),

      // Fixed sequence. The scribes' thought text is never shown in this route.
      line(
        "앞쪽에 선 서기관 몇 사람의 얼굴이 굳는다. 므나헴도 있다. 아무도 입을 열지 않는다.",
        "Up front, a few scribes' faces go stiff. Menahem is one of them. None of them says a word.",
        "scribes-stiff"
      ),
      verse("MT_9_4N"),
      verse("MT_9_4Q"),
      verse("MT_9_5"),
      verse("MT_9_6A"),
      verse("MT_9_6N"),
      fx("light", { level: "bright" }),
      verse("MT_9_6B", "rise"),

      // The payoff: the same words that answered "can't" at dawn now work. Then eye level.
      press("일어나기", "Get up", "press-getup"),
      fx("pov", { pov: "standing" }),
      scene("crowd", "standing"),
      fx("light", { level: "soft" }),
      press("침상을 들어", "Pick up your bed", "press-bed"),
      press("집으로", "Go home", "press-home"),
      verse("MT_9_7"),
      verse("MT_9_8"),

      // c6: his first words standing. The question leads straight into the memory verse card.
      choice("c6", "집으로 가는 길. 네 해 만에 사람들과 눈높이가 같다. 요나한테 뭐라고 하지?", "On the way home, eye to eye with people for the first time in four years. What do I tell Yonah?", [
        nope("a", "“요나, 침상은 네가 들어.”", "“Yonah, you carry the bed.”", "yonah", "그건 아니지! 네 침상은 네가 들어!", "No way! Your bed—you carry it!"),
        go("b", "“요나, 들었어? 나를 뭐라고 부르셨는지.”", "“Yonah, did you hear what he called me?”")
      ]),

      // He has gone home (MT_9_7): the light of his presence leaves before the ending card.
      fx("light", { level: "off" })
    ],

    endings: {
      // True ending: title card -> memory verse MT_9_2B (the answer to his question) -> beat -> last.
      good: {
        title: t("내가 일어나기 전", "Before I Stood"),
        verse: "MT_9_2B",
        beats: [
          scene("lane", "standing", "오후 · 골목", "Afternoon · The lane"),
          say("yonah", "들었지. 나도 바로 옆에 있었잖아. 자, 집까지 달리기다!", "I heard. I was right there. Now—race you home!", "end-race")
        ],
        // The passerby asked why; nothing in the story answers it. What he was called, he knows.
        last: t("왜 아팠는지는 모른다. 그분이 나를 뭐라고 부르셨는지는 안다.", "I still don't know why I got sick. But I know what he called me.")
      },

      // Cut branches (story-tree twigs). That day Jesus still comes to Capernaum; Asher misses it.
      bad: {
        // c1 c: "Five more minutes…"
        nap: {
          title: t("오 분만 더", "Five More Minutes"),
          beats: [
            scene("asher_ceiling", "lying", "해 질 녘 · 아셀의 집", "Dusk · Asher's house", "evening"),
            line("눈을 뜨니 문밖이 주황빛이다. 온 동네가 그분 얘기로 떠들썩하다.", "When Asher opens his eyes, the doorway is glowing orange. The whole town is buzzing about Jesus.", "nap-dusk"),
            say("brother", "아침에 요나 형이 와서 형을 막 흔들었어. 근데 하나도 안 깨더라.", "Yonah came this morning and shook you like crazy. You didn't even budge.", "nap-brother")
          ],
          last: t("온 동네가 깨어난 날, 나만 잤다.", "The day the whole town woke up, I slept in.")
        },

        // c2 d: "No. I'm not going out." He stays home and is not healed (teacher's fourth note).
        stayedHome: {
          title: t("들보 세기", "Counting Beams"),
          beats: [
            line("요나의 발소리가 골목 아래로 멀어진다.", "Yonah's footsteps fade down the lane.", "home-footsteps"),
            when({ choice: "c1", is: "d" }, thought("아침에 세다 만 들보를 끝까지 센다. 마흔둘.", "I finish counting the beams I started this morning. Forty-two.", "home-beams-again")),
            when({ not: { choice: "c1", is: "d" } }, thought("들보나 끝까지 세 본다. 마흔둘.", "Might as well count every beam. Forty-two.", "home-beams")),
            scene("asher_ceiling", "lying", "정오 무렵 · 아셀의 집", "Around noon · Asher's house"),
            sign("― 바닷가 쪽에서 함성이 들려온다 ―", "— A roar goes up from the shore —", "home-roar")
          ],
          // A story beat, not a rule: a housebound student must not hear "staying in is the problem".
          last: t("요나는 같이 가자고 했다. 나는 들보랑 남았다.", "Yonah said, “Come with me.” I stayed with the beams.")
        },

        // c2 b: the hot springs of Tiberias instead (Korean text uses the Korean Revised Version spelling,
        // as in John 6:1). Warm water, same legs; his boat came the other way.
        hotSprings: {
          title: t("디베랴 온천", "Tiberias Hot Springs"),
          beats: [
            scene("shore_dawn", "normal", "아침 · 갈릴리 바다", "Morning · The Sea of Galilee"),
            line("요나의 배가 남쪽으로 간다. 반대편에서 배 한 척이 가버나움 쪽으로 지나간다.", "Yonah's boat heads south. Another boat passes the other way, toward Capernaum.", "springs-boat"),
            thought("디베랴 온천. 물은 뜨끈하다. 다리는 그대로다.", "The hot springs of Tiberias. The water is nice and hot. My legs are the same.", "springs-water")
          ],
          last: t("그분은 배를 타고 오셨다. 우리는 반대로 갔다.", "He came by boat. We went the other way.")
        },

        // c3 b: the quarrel in the lane escalates; Yonah turns to join in and the bed turns with him.
        // Words only, and the slapstick hurts no one: a basket tips over and the fish all get caught.
        // The joke is the chaos and his deadpan, never his body.
        fishChase: {
          title: t("생선 대소동", "The Great Fish Chase"),
          beats: [
            say("asher", "네. 딱 그래 보여요.", "Yeah. It shows.", "fish-comeback"),
            line("요나도 거들겠다고 홱 돌아선다. 침상도 같이 홱 돈다. 쿵! 생선 장수의 바구니가 엎어진다.", "Yonah spins around to join in. So does the bed. Thump! Over goes a fish seller's basket.", "fish-basket"),
            thought("온 골목이 펄떡이는 생선을 쫓는다. 한 마리가 내 가슴에 툭 떨어진다. 생선도 나도, 이럴 줄은 몰랐다.", "The whole lane is chasing flopping fish. One lands smack on my chest. Neither of us saw that coming.", "fish-chest")
          ],
          // The Korean verb means both "let a fish slip away" and "miss someone"; English uses caught / missed.
          last: t("생선은 한 마리도 안 놓쳤다. 그분만 놓쳤다.", "We caught every last fish. We just missed him.")
        },

        // c3 d: the back way, where no person stares. The goats do.
        longWay: {
          title: t("염소 관객", "An Audience of Goats"),
          beats: [
            scene("sky_carried", "lying", "오후 · 언덕 뒷길", "Afternoon · The back way"),
            thought("언덕을 빙 도는 길이다. 사람은 없고 염소만 잔뜩 있다. 다들 나만 쳐다본다.", "It's the long way around the hill. No people, just a lot of goats. Every one of them is staring at me.", "back-goats"),
            line("바닷가 공터에 닿았을 때, 사람들은 벌써 집으로 돌아가고 있다.", "By the time they reach the shore, people are already heading home.", "back-late")
          ],
          last: t("사람은 아무도 나를 쳐다보지 않았다. 쳐다볼 사람이 남아 있지 않았으니까.", "Not one person stared at me. There was nobody left to stare.")
        },

        // c4 b: "Could you pass me to the front?" The crowd passes the bed over their heads the wrong way,
        // into a fishing boat (never Jesus' boat). The sea is calm and Yonah is right there: no danger.
        bedSurf: {
          title: t("침상 파도타기", "Bed Surfing"),
          beats: [
            scene("sky_carried", "lying", "정오 무렵 · 사람들 머리 위", "Around noon · Over everyone's heads"),
            thought("잠깐, 이쪽이 앞이야? 바다 냄새가 점점 진해지는데.", "Wait—is this the front? It smells more and more like the sea.", "surf-smell"),
            line("마지막 손이 물가의 고깃배에 침상을 살며시 내려놓는다. 밧줄이 스르르 풀린다.", "The last pair of hands sets the bed gently into a fishing boat at the water's edge. The rope slips loose.", "surf-boat"),
            line("바다는 오늘따라 아주 잔잔하다. 배가 둥실둥실 떠간다. 물가에서 요나가 외친다. “아셀! 그쪽 아니야!”", "The sea is very calm today. The boat bobs gently away. On the shore, Yonah is yelling, “Asher! Not that way!”", "surf-drift")
          ],
          // The pun works in both languages: the Korean word for "front" also starts the word for the sea
          // just off the shore; in English, front -> waterfront.
          last: t("앞으로 보내 달랬더니, 앞바다로 보내 줬다.", "I asked them to pass me to the front. They passed me to the waterfront.")
        }
      }
    }
  };
})();

<script>/* js/engine.js */
/*
 * js/engine.js - pure game logic for "Before He Stood" (SPEC version 4: story mode).
 * No DOM access anywhere in this file. Loadable in Node with `globalThis.window = globalThis`.
 *
 * Route shape (SPEC 4.5): one story with choices c1..cN of 2-4 options. Each option has exactly one
 * outcome (optionOutcome):
 *   continue (default)  its reaction plays, then the story goes on;
 *   bad: "<id>"         its reaction plays, then the cut branch endings.bad[id]: beats -> last -> snip card;
 *   scold: {speaker?, text}  its reaction plays, then the scold line, then the option is removed and the
 *                       same choice is asked again.
 * One true ending: endingPreface (optional) -> title card (endings.good.title) -> memory-verse card
 * (endings.good.verse) -> endings.good.beats -> last -> endingCoda -> end.
 *
 * Public API (BHS.engine):
 *   optionOutcome(option)                -> "continue" | "bad" | "scold"
 *   goodId(routeId) / branchId(routeId, badId) / parseSeenId(id)
 *                                        -> seen ids "<route>-good" and "<route>-bad-<id>"
 *   treeOf(routeOrId)                    -> { routeId, levels: [{ id, branches: [{ badId, id, title, last }] }],
 *                                             good: { id, title, verse } }  (the story tree, SPEC 5.8)
 *   badTargets(routeOrId)                -> [{ choice, option, badId }] every option that cuts the story
 *   evalCond(cond, state)                -> boolean                                      (SPEC 4.5)
 *   resolveText(t, lang, state)          -> string, tokens resolved, *emphasis* markers kept
 *   plainText(t, lang, state)            -> string, tokens resolved, emphasis markers removed
 *   resolveSegments(t, lang, state)      -> [{ text, em, kind?, key? }] for renderers
 *   quoteVerse(text)                     -> “text” with inner double quotes turned into ‘ ’
 *   verseText(key, lang) / verseRef(key, lang) / verseSpeaker(key)
 *   verseDisplay(key, lang)              -> verse text as shown: an English excerpt that starts with a
 *                                           lowercase letter gets a leading "…" (SPEC 4.3); data unchanged
 *   memoryDisplay(key, lang)             -> the memory-verse card's text: verseDisplay plus a trailing "…"
 *                                           when the key stops mid-sentence (SPEC 4.6); data unchanged
 *   fingerprint(routeOrId)               -> short structural hash of a route ("prologue" = common.prologue)
 *   canRestore(savedState)               -> true when a snapshot fits the current data (state version + fingerprint)
 *   createGame(routeId, opts)            -> Game   (routeId may be "prologue")
 *   createSequence(beats, opts)          -> Game   (plays an arbitrary beat list, for tests)
 *   restoreGame(savedState)              -> Game   (throws when canRestore(savedState) is false)
 *
 * Game (driven by the UI):
 *   game.step                 current blocking step (see STEP KINDS below)
 *   game.view()               { step, now: {hush, echo}, stage, actions, ending, routeId }
 *   game.next()               advance from line / verse / endingTitle / memory / last
 *   game.choose(optionId)     answer the current choice (only options still shown)
 *   game.press()              answer the current press beat
 *   game.retry()              "Try again": back to the last choice exactly as it was shown
 *   game.canRetry()           true once a choice has been shown
 *   game.continueOption(step) first option of a choice step whose outcome is "continue"
 *   game.optionMarks(seenIds) { optionId: true } for options whose cut branch was already seen
 *   game.tapAction(actionId)  tap a persistent action (route-level `actions`, optional)
 *   game.serialize()          JSON-safe snapshot; restore with restoreGame(snapshot)
 *   game.fastForward(opts)    debug helper: auto-play until a predicate holds (default pick: continue)
 *
 * STEP KINDS: line {speaker, text} | verse {key, speaker} | memory {key, speaker}
 *   | choice {id, prompt, options:[{id,text}], removed:[ids], justRemoved: {id,text,at}|null, again}
 *   | press {action?, label?, hint?} | endingTitle {routeId, title} | last {text}
 *   | snip {routeId, id, badId, title} | routeSelect {} | end {}
 * Choice steps never expose outcomes, so the UI cannot leak which option cuts the story (SPEC 7.2).
 * Every choice presentation (the re-ask after a scold included) stores a snapshot in state.retry;
 * retry() restores it, so scolded options stay removed and picks made before stay made.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var BHS = (root.BHS = root.BHS || {});

  var LIGHT_LEVELS = { off: true, soft: true, bright: true };
  var POVS = { normal: true, lying: true, standing: true };
  var TIMES = { day: true, evening: true, night: true };
  // Speakers that may appear as portraits (never Jesus; the protagonist is excluded per route).
  var PORTRAIT_IDS = { menahem: true, hanan: true, yonah: true, asher: true, mother: true, brother: true, neighbor: true, passerby: true, partners: true, scribes: true };
  var MAX_CAST = 2;
  // 3 = story mode (version 4): option outcomes, scold re-asks, retry snapshots.
  // Snapshots of earlier versions (lens routes) are never restored.
  var STATE_VERSION = 3;

  var warnings = [];

  function warn(msg) {
    if (warnings.length < 200) warnings.push(String(msg));
    if (api.debug && root.console && root.console.warn) root.console.warn("[BHS.engine] " + msg);
  }

  function own(o, k) {
    return o != null && Object.prototype.hasOwnProperty.call(o, k);
  }

  function clone(x) {
    return x == null ? x : JSON.parse(JSON.stringify(x));
  }

  // ---------------------------------------------------------------------------
  // Data access
  // ---------------------------------------------------------------------------

  function getRoute(routeOrId) {
    if (routeOrId && typeof routeOrId === "object") return routeOrId;
    return (BHS.routes && BHS.routes[routeOrId]) || null;
  }

  function choiceBeats(route) {
    var out = [];
    var seen = {};
    if (!route || !route.beats) return out;
    for (var i = 0; i < route.beats.length; i++) {
      var b = route.beats[i];
      if (b && b.type === "choice") {
        if (seen[b.id]) {
          warn("duplicate choice id " + b.id + " in route " + route.id + "; only the first counts");
          continue;
        }
        seen[b.id] = true;
        out.push(b);
      }
    }
    return out;
  }

  function findChoice(route, id) {
    var list = choiceBeats(route);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findOption(choiceBeat, optId) {
    if (!choiceBeat || !choiceBeat.options) return null;
    for (var i = 0; i < choiceBeat.options.length; i++) {
      if (choiceBeat.options[i] && choiceBeat.options[i].id === optId) return choiceBeat.options[i];
    }
    return null;
  }

  // The outcome of an option (SPEC 4.5). Unknown old fields (lens, cut) are ignored.
  function optionOutcome(opt) {
    if (!opt || typeof opt !== "object") return "continue";
    if (typeof opt.bad === "string" && opt.bad) return "bad";
    if (opt.scold && typeof opt.scold === "object") return "scold";
    return "continue";
  }

  function goodEnding(route) {
    var e = route && route.endings && route.endings.good;
    return e && typeof e === "object" ? e : null;
  }

  function badEnding(route, badId) {
    var bad = route && route.endings && route.endings.bad;
    return bad && typeof bad === "object" && own(bad, badId) && bad[badId] && typeof bad[badId] === "object" ? bad[badId] : null;
  }

  function routeIdOf(route, fallback) {
    return (route && typeof route.id === "string" && route.id) || (typeof fallback === "string" ? fallback : "");
  }

  function goodId(routeId) {
    return routeId + "-good";
  }

  function branchId(routeId, badId) {
    return routeId + "-bad-" + badId;
  }

  // "<route>-good" -> { routeId, kind: "good" }; "<route>-bad-<id>" -> { routeId, kind: "bad", badId }.
  // Anything else (ids from the lens releases such as "scribe-1" or "friend-cut") -> null.
  function parseSeenId(id) {
    if (typeof id !== "string") return null;
    var m = /^([a-z][a-z0-9]*)-good$/.exec(id);
    if (m) return { routeId: m[1], kind: "good" };
    m = /^([a-z][a-z0-9]*)-bad-([A-Za-z][A-Za-z0-9_]*)$/.exec(id);
    if (m) return { routeId: m[1], kind: "bad", badId: m[2] };
    return null;
  }

  // Every option that cuts the story, in beat order.
  function badTargets(routeOrId) {
    var route = getRoute(routeOrId);
    var out = [];
    choiceBeats(route).forEach(function (cb) {
      (cb.options || []).forEach(function (o) {
        if (optionOutcome(o) === "bad") out.push({ choice: cb.id, option: o.id, badId: o.bad });
      });
    });
    return out;
  }

  // The story tree of a route (SPEC 5.8): the trunk runs through every choice point to the true ending;
  // each cut branch grows at the first choice point that leads to it. Scolded options are not part of it.
  function treeOf(routeOrId) {
    var route = getRoute(routeOrId);
    if (!route) return null;
    var rid = routeIdOf(route, routeOrId);
    var placed = {};
    var levels = choiceBeats(route).map(function (cb) {
      var branches = [];
      (cb.options || []).forEach(function (o) {
        if (optionOutcome(o) !== "bad" || placed[o.bad]) return;
        placed[o.bad] = true;
        var e = badEnding(route, o.bad);
        branches.push({ badId: o.bad, id: branchId(rid, o.bad), title: (e && e.title) || null, last: (e && e.last) || null });
      });
      return { id: cb.id, branches: branches };
    });
    var good = goodEnding(route);
    return { routeId: rid, levels: levels, good: { id: goodId(rid), title: (good && good.title) || null, verse: (good && good.verse) || null } };
  }

  function scriptureEntry(key) {
    return (BHS.scripture && own(BHS.scripture, key) && BHS.scripture[key]) || null;
  }

  function verseText(key, lang) {
    var s = scriptureEntry(key);
    if (!s || s.refOnly) return null;
    var txt = s[lang === "en" ? "en" : "ko"];
    return typeof txt === "string" && txt.length ? txt : null;
  }

  // Display form of a verse text (SPEC 4.3). An English excerpt that starts mid-sentence (its first
  // character is a lowercase letter, e.g. "your sins are forgiven.") is shown with a leading ellipsis.
  // The stored text stays an exact substring of the verse; Korean text is never changed.
  var ELLIPSIS = "…";
  function verseDisplay(key, lang) {
    var txt = verseText(key, lang);
    if (txt == null) return null;
    return lang === "en" && /^[a-z]/.test(txt) ? ELLIPSIS + txt : txt;
  }

  // True when a key is an excerpt that stops mid-sentence: its `full` verse goes on after it with more
  // words, and the excerpt does not end in terminal punctuation (. ? ! closing quotes, an ellipsis).
  // The Korean Bible text has no full stops, so a Korean excerpt stops mid-sentence whenever words follow.
  var TERMINAL_END = /[.?!”’"'…]$/;
  var WORD_CHAR = /[0-9A-Za-zᄀ-ᇿㄱ-ㆎ가-힣]/;
  function stopsMidSentence(key, lang) {
    var s = scriptureEntry(key);
    var txt = verseText(key, lang);
    var l = lang === "en" ? "en" : "ko";
    if (!s || txt == null || !s.full || typeof s.full[l] !== "string") return false;
    var full = s.full[l];
    // The last place the excerpt fits, so a phrase that also ends the verse is never marked.
    var at = full.lastIndexOf(txt);
    if (at < 0) return false;
    if (!WORD_CHAR.test(full.slice(at + txt.length))) return false;
    return !TERMINAL_END.test(txt.replace(/\s+$/, ""));
  }

  // The memory-verse card of the true ending (SPEC 4.6) shows the verse in its display form, plus a
  // trailing "…" when the key stops mid-sentence (the scribe's MT_9_6A). Display only; data unchanged.
  function memoryDisplay(key, lang) {
    var txt = verseDisplay(key, lang);
    if (txt == null) return null;
    return stopsMidSentence(key, lang) ? txt + ELLIPSIS : txt;
  }

  function verseRef(key, lang) {
    var s = scriptureEntry(key);
    if (!s || !s.ref) return null;
    var r = s.ref[lang === "en" ? "en" : "ko"];
    return typeof r === "string" && r.length ? r : null;
  }

  function verseSpeaker(key) {
    var s = scriptureEntry(key);
    return (s && s.speaker) || "narrator";
  }

  // ---------------------------------------------------------------------------
  // Conditions (SPEC 4.5)
  // ---------------------------------------------------------------------------

  function looseEq(v, x) {
    if (v === undefined) v = null;
    // An unset flag or choice counts as `false` so `{ flag: "far", is: false }` reads naturally.
    if (x === false && v === null) return true;
    if (x === null) return v === null;
    return v === x;
  }

  function matchValue(v, cond) {
    if (own(cond, "is")) return looseEq(v, cond.is);
    if (own(cond, "in")) {
      var arr = Array.isArray(cond["in"]) ? cond["in"] : [];
      for (var i = 0; i < arr.length; i++) if (looseEq(v, arr[i])) return true;
      return false;
    }
    // A bare `{ flag: "x" }` tests truthiness.
    return v !== undefined && v !== null && v !== false;
  }

  function evalCond(cond, state) {
    if (cond == null) return true;
    state = state || {};
    if (Array.isArray(cond)) {
      for (var i = 0; i < cond.length; i++) if (!evalCond(cond[i], state)) return false;
      return true;
    }
    if (typeof cond !== "object") return !!cond;
    if (own(cond, "all")) {
      var all = cond.all || [];
      for (var a = 0; a < all.length; a++) if (!evalCond(all[a], state)) return false;
      return true;
    }
    if (own(cond, "any")) {
      var any = cond.any || [];
      for (var b = 0; b < any.length; b++) if (evalCond(any[b], state)) return true;
      return false;
    }
    if (own(cond, "not")) return !evalCond(cond.not, state);
    if (own(cond, "choice")) return matchValue((state.choices || {})[cond.choice], cond);
    if (own(cond, "flag")) return matchValue((state.flags || {})[cond.flag], cond);
    if (own(cond, "var")) {
      // Extension (not in SPEC 4.5): numeric test on a runtime variable.
      var n = Number((state.vars || {})[cond["var"]] || 0);
      if (own(cond, "is")) return n === Number(cond.is);
      if (own(cond, "gte")) return n >= Number(cond.gte);
      if (own(cond, "gt")) return n > Number(cond.gt);
      if (own(cond, "lte")) return n <= Number(cond.lte);
      if (own(cond, "lt")) return n < Number(cond.lt);
      return n !== 0;
    }
    warn("unknown condition " + JSON.stringify(cond));
    return false;
  }

  // ---------------------------------------------------------------------------
  // Text and tokens (SPEC 3.1-3.2)
  // ---------------------------------------------------------------------------

  var TOKEN_SRC = "\\{\\{\\s*(v|r|var)\\s*:\\s*([A-Za-z0-9_]+)\\s*\\}\\}";
  var OPEN_Q = "“";
  var CLOSE_Q = "”";

  function isDebug(state) {
    return !!((state && state.debug) || api.debug);
  }

  function pickLang(t, lang) {
    if (t == null) return "";
    if (typeof t === "string") return t;
    var l = lang === "en" ? "en" : "ko";
    if (typeof t[l] === "string") return t[l];
    var other = l === "en" ? "ko" : "en";
    return typeof t[other] === "string" ? t[other] : "";
  }

  // Inside our curly double quotes, any double quote in the verse becomes a single curly quote,
  // so quotes never nest double-in-double. Straight quotes open after whitespace or an opening
  // bracket/dash, and close otherwise.
  function nestQuotes(text) {
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "“") out += "‘";
      else if (ch === "”") out += "’";
      else if (ch === '"') {
        var prev = i > 0 ? text.charAt(i - 1) : "";
        out += prev === "" || /[\s(\[{—–]/.test(prev) ? "‘" : "’";
      } else out += ch;
    }
    return out;
  }

  function quoteVerse(text) {
    return OPEN_Q + nestQuotes(String(text)) + CLOSE_Q;
  }

  function tokenValue(kind, key, lang, state) {
    if (kind === "v") {
      var v = verseDisplay(key, lang);
      if (v == null) {
        warn("missing verse text for " + key);
        return isDebug(state) ? "[" + key + "]" : OPEN_Q + "…" + CLOSE_Q;
      }
      return quoteVerse(v);
    }
    if (kind === "r") {
      var r = verseRef(key, lang);
      if (r == null) {
        warn("missing verse reference for " + key);
        return isDebug(state) ? "[" + key + "]" : "…";
      }
      return r;
    }
    if (kind === "var") {
      var vars = (state && state.vars) || {};
      var n = Number(vars[key]);
      return String(isFinite(n) ? Math.round(n) : 0);
    }
    return "";
  }

  // ---------------------------------------------------------------------------
  // Route fingerprints (save compatibility)
  // ---------------------------------------------------------------------------

  // A snapshot stores list names and beat indexes, so it only fits the route data it was made from.
  // The fingerprint hashes the route's skeleton: the beat types of every list in order, choice ids,
  // option ids and outcomes, reaction lengths, ending ids and lengths, the memory verse, and action
  // ids. Text edits keep it; added, removed or reordered beats and changed outcomes change it.
  function skeletonOf(list) {

  function fingerprint(routeOrId) {

    var route = getRoute(routeOrId);

    var parts = ["v4", "beats:" + skeletonOf(route.beats), "preface:" + skeletonOf(route.endingPreface)];
    var good = goodEnding(route);
    parts.push("good:" + (good ? skeletonOf(good.beats) + (good.last ? "+last" : "") + "@" + (good.verse || "") : "-"));

    if (!Array.isArray(saved.segs) || !Array.isArray(saved.stack) || typeof saved.seg !== "number") return false;
    if (!saved.stage || typeof saved.stage !== "object" || !saved.step || typeof saved.step.kind !== "string") return false;
    if (!saved.choices || typeof saved.choices !== "object") return false;
    if (saved.removed != null && typeof saved.removed !== "object") return false;

  // ---------------------------------------------------------------------------

    this.debug = !!opts.debug;

      this.state = clone(opts.state);

      vars: st.vars,

  // A choice beat by id: the route's own, or one inside a custom sequence (tests).

  };

  Game.prototype._list = function (name) {

    if (name === "prologue") return (BHS.common && BHS.common.prologue) || [];

    if (name.indexOf("react:") === 0) {
      parts = name.split(":");

      return (ro && ro.reaction) || [];
    }
    if (name.indexOf("scold:") === 0) {

      parts = name.split(":");

      var sc = so && so.scold;
      if (!sc || typeof sc !== "object" || !sc.text) return [];

    if (!opt) return false;

  // ---------------------------------------------------------------------------
  // Factories
  // ---------------------------------------------------------------------------

  function createGame(routeId, opts) {
    return new Game(routeId, opts);
  }

  function createSequence(beats, opts) {
    opts = opts || {};
    return new Game(opts.routeId || "custom", { beats: beats, route: opts.route || null, debug: opts.debug });
  }

  function restoreGame(saved, opts) {
    if (!saved || !saved.routeId) throw new Error("No saved state");

  }

  var api = {
    version: "4.0.0",
    STATE_VERSION: STATE_VERSION,
    debug: false,
    warnings: warnings,
    PORTRAIT_IDS: PORTRAIT_IDS,
    getRoute: getRoute,
    choiceBeats: choiceBeats,
    findChoice: findChoice,
    findOption: findOption,
    optionOutcome: optionOutcome,
    goodId: goodId,
    branchId: branchId,
    parseSeenId: parseSeenId,
    badTargets: badTargets,
    treeOf: treeOf,
    evalCond: evalCond,
    resolveText: resolveText,
    resolveSegments: resolveSegments,
    plainText: plainText,
    pickLang: pickLang,
    quoteVerse: quoteVerse,
    nestQuotes: nestQuotes,
    verseText: verseText,
    verseDisplay: verseDisplay,
    memoryDisplay: memoryDisplay,
    verseRef: verseRef,
    verseSpeaker: verseSpeaker,
    fingerprint: fingerprint,
    canRestore: canRestore,
    createGame: createGame,
    createSequence: createSequence,
    restoreGame: restoreGame,
    Game: Game

  BHS.engine = api;
})();

<script>/* js/art.js */

        "C" + r1(x + w * 0.45) + " " + r1(b - fh * 0.38) + " " + r1(x + w * 0.5) + " " + r1(b - fh * 0.15) + " " + x + " " + (b - 1) + "Z", "#fffdf4") +

  var scenes = {};

  // Menahem's room. Shared by dawn_lamp and lamp_night so both read as the same place.

  function room(c, night) {
    var rnd = c.rnd, i;
    var wx = 990, wy = 828;                  // wick point of the lamp on the table
    var fh = night ? 30 : 46;                // flame height ("lower" at night)
    var gx = wx, gy = wy - fh * 0.5;         // light center
    var reach = night ? 470 : 620;

    c.add(full(night ? "#0a0b0d" : "#0e0f12"));

    // Back wall: fieldstones that only show where lamp or window light reaches them.
    var tones = night
      ? ["#141517", "#1b1b1c", "#25221f", "#302a24", "#3d342b", "#151a22", "#1a2029"]
      : ["#17181b", "#211f1f", "#2d2824", "#3c332b", "#4f4133", "#1c222c", "#26303c"];

      u0: 0, u1: W, v0: 150, v1: 852, ch: [46, 70], sw: [72, 138], gap: 4, jit: 5, n: 7,
      tone: function (x, y, r) {
        var dx = x - gx, dy = (y - gy) * 1.2;
        var L = Math.pow(clamp(1 - Math.sqrt(dx * dx + dy * dy) / reach, 0, 1), 1.5);
        var wdx = x - 590, wdy = (y - 600) * 1.25, wd = Math.sqrt(wdx * wdx + wdy * wdy);
        if (L < 0.16 && wd < 250 && r() < 0.85) return wd < 150 ? 6 : 5;
        if (L < 0.08 && r() < 0.8) return -1;
        return clamp(Math.floor(L * 5 + (r() - 0.5) * 1.1), 0, 4);
      }
    }), tones);

    // Ceiling: dark reeds above a heavy wall-plate beam (portrait only).
    c.add(rect(0, 0, W, 104, "#09090a"));
    c.add(path("M0 100L1600 92V140L0 148Z", night ? "#211913" : "#291f18"));
    c.add(path("M0 141L1600 133V144L0 152Z", night ? "#2b2118" : "#3a2b1f"));

    // Small high window: deep basalt reveal; its sky is drawn after the lamplight.
    c.add(path("M486 498L682 494V522L486 526Z", night ? "#221a13" : "#2b2018"));
    c.add(path("M486 518L682 514V522L486 526Z", night ? "#302419" : "#463428"));
    c.add(path(poly([[500, 522], [536, 527], [536, 674], [500, 690]]), night ? "#171c25" : "#353e4c"));
    c.add(path(poly([[500, 690], [668, 690], [668, 674], [536, 674]]), night ? "#1c2230" : "#56657a"));
    c.add(path(poly([[500, 522], [668, 520], [668, 527], [536, 527]]), night ? "#11151c" : "#28303b"));
    c.glow("win", 600, 610, 300, night ? "#5b74a0" : "#86a2c8", night ? 0.07 : 0.2);

    // Wall niche with two rolled scrolls.
    c.add(path(poly([[1018, 540], [1140, 538], [1140, 558], [1018, 560]]), night ? "#2a241e" : "#383029"));
    c.add(rect(1026, 558, 106, 124, "#09090a"));
    c.add(rect(1042, 620, 78, 20, night ? "#56462f" : "#6f5c41", ' rx="9"'));
    c.add(rect(1036, 640, 86, 22, night ? "#625138" : "#7f6a4c", ' rx="10"'));
    c.add(ell(1047, 630, 5, 9, night ? "#94805c" : "#b9a27a"));
    c.add(ell(1041, 651, 5, 10, night ? "#a08a64" : "#c8b088"));

    // Landscape extras: a doorway to the inner room and a storage jar, both in shadow.
    c.add(path("M1306 540L1486 536V562L1306 566Z", night ? "#1d1610" : "#261c14"));
    c.add(rect(1320, 562, 152, 286, "#050506"));
    c.add(path("M232 852C204 790 214 726 252 700C246 690 250 682 262 680H318C330 682 334 690 328 700C366 726 376 790 348 852Z",
      c.lin("sjar", 214, 0, 376, 0, [[0, "#141313"], [0.75, night ? "#1d2029" : "#262c38"], [1, "#151517"]])));

    // Floor.
    c.add(rect(0, 846, W, 754, c.lin("floor", 0, 846, 0, 1400, [[0, night ? "#14110f" : "#191511"], [1, "#090807"]])));
    c.add(rect(0, 846, W, 3, "#000", op(0.4)));

    c.add(path(poly([[576, 796], [1144, 796], [1202, 902], [518, 902]]),
      c.lin("top", 518, 0, 1202, 0, [[0, night ? "#20170f" : "#271c13"], [0.68, night ? "#4a3523" : "#5e432a"], [1, night ? "#33251a" : "#3e2c1d"]])));
    c.add(rect(518, 902, 684, 26, "#1c130c"));
    c.add(rect(536, 928, 28, 78, "#130d08"));
    c.add(rect(1156, 928, 28, 78, "#130d08"));
    c.add(ell(860, 1008, 360, 18, "#000", op(0.5)));

    var ln = "";
    if (!night) {
      // Open scroll: parchment between two rolled ends, faint ruled columns (no letters).
      c.add(path(poly([[684, 808], [916, 808], [944, 884], [654, 884]]),
        c.lin("sheet", 654, 0, 944, 0, [[0, "#bfa47a"], [0.7, "#ead6ab"], [1, "#f3e2b9"]])));
      for (i = 0; i < 8; i++) {
        var y = lerp(816, 876, i / 7), f = (y - 808) / 76;
        var xl = lerp(684, 654, f) + 18, xr = lerp(916, 944, f) - 18, mid = (xl + xr) / 2;
        ln += "M" + ri(xl) + " " + ri(y) + "h" + ri((mid - 10 - xl) * (i === 7 ? 0.5 : 0.86 + rnd() * 0.14)) +

      c.add(path("M641 882L672 802Q683 799 692 810L667 892Q650 895 641 882Z", "#a3855a"));
      c.add(ell(654, 888, 14, 6, "#d6bf91"));
      c.add(path("M957 882L926 802Q915 799 906 810L931 892Q948 895 957 882Z", "#b8996b"));
      c.add(ell(944, 888, 14, 6, "#ead29f"));

      c.add(rect(618, 800, 196, 18, "#7a6446", ' rx="9"'));
      c.add(ell(622, 809, 5, 9, "#b0976c"));
      c.add(path(poly([[680, 826], [796, 820], [806, 868], [676, 876]]), "#b39a73"));
      c.add(path(poly([[770, 834], [890, 840], [880, 888], [758, 882]]), "#cbb58c"));
      for (i = 0; i < 5; i++) {

      c.add(line(ln, "#5d4a35", 1.6, op(0.5)));
      c.add(line("M820 896L940 872", "#6e5638", 3.4));
      c.add(rect(924, 832, 26, 26, "#1b1714"));
      c.add(ell(937, 832, 13, 4, "#2e2721"));
      c.add(ell(937, 832, 8, 2.4, "#070606"));
    }

    var lamp = oilLamp(c, wx, wy, fh, 1.35, "lamp");
    c.add(lamp.body);

    // Lamplight on the wall, the table and the floor.
    c.add(full(c.rad("light", gx, gy, reach, night
      ? [[0, "#ffbf72", 0.42], [0.12, "#f0a050", 0.24], [0.4, "#b86a2c", 0.08], [1, "#6a3d18", 0]]
      : [[0, "#ffd08c", 0.5], [0.12, "#f5ae5e", 0.3], [0.4, "#c77a33", 0.11], [1, "#7a4a1f", 0]], reach * 0.9)));

    // Sky through the window stays cool (drawn after the warm light).
    c.add(rect(536, 527, 132, 147, c.lin("sky", 0, 527, 0, 674, night
      ? [[0, "#04070d"], [0.6, "#0b1222"], [1, "#141d31"]]
      : [[0, "#192846"], [0.5, "#34507a"], [0.85, "#829db6"], [1, "#b3b2a6"]])));
    c.add(path("M536 654L600 649L668 645V674H536Z", night ? "#020305" : "#0d1119"));
    c.add(rect(640, 637, 11, 9, night ? "#020305" : "#0d1119"));
    c.add(ell(648, 552, 1.8, 1.8, "#eef2f9", op(night ? 0.9 : 0.7)));
    if (night) c.add(ell(576, 586, 1.3, 1.3, "#dfe6f2", op(0.7)));

    // Flame and halo on top.
    c.glow("halo", wx, ri(wy - fh * 0.55), night ? 66 : 92, "#fff0c8", night ? 0.7 : 0.85, 0, 0.3);
    c.add(lamp.flame);

    c.vignette("#000", night ? 0.85 : 0.75, gx - 100, gy - 40, night ? 1100 : 1250);
    c.grain(0.35, 0.25);

  // Narrow lane of black basalt houses sloping down to the lake, late morning.

  scenes.lane = function (c) {
    var rnd = c.rnd;
    var F = 900, CY = 600, EYE = 1.6, G = 0.11;
    var XL = -1.55, XR = 1.5, ZN = 1.0, ZEND = 13.5;

    c.add(rect(0, 0, W, 606, c.lin("sky", 0, 0, 0, 600, [[0, "#6894b9"], [0.55, "#a6c3d4"], [1, "#e1e8e3"]])));

    c.add(path(poly([Pf(-30, 26), Pf(30, 26), Pf(30, ZEND), Pf(-30, ZEND)]), "#dccba7"));

      "L" + ri(b1[0] - 4) + " " + ri(bb[1] - 6) + "Q" + ri(bb[0]) + " " + ri(bb[1] + 3) + " " + ri(b0[0] + 6) + " " + ri(bb[1] - 5) + "Z", "#3e3129"));

      var tones = lit ? ["#4b4944", "#58554f", "#66625a", "#747066", "#848075"] : ["#24272c", "#2a2e33", "#30353b", "#383d43"];
      for (var h = 0; h < houses.length; h++) {

        c.add(path(poly([P(x, top, z0), P(x, top, z1), Pf(x, z1), Pf(x, z0)]), lit ? "#3a3733" : "#1c1f23"));
        (function (topY) {

            u0: z0, u1: z1, v0: 0.26, v1: houses[h][2] + G * (z1 - z0) + 0.2, ch: [0.26, 0.4], sw: [0.45, 0.9],
            gap: 0.035, jit: 0.05, n: tones.length, skip: lit ? 0.14 : 0.42, skipMaxW: 70, minW: 5,

    var cob = "";

  var CLOTH = ["#b7a785", "#6e5642", "#45506a", "#7b4536", "#a3824e", "#5d6243", "#3d3b38", "#c9bea6", "#8a6f55", "#5a4c5e", "#94846a"];

  // ---------------------------------------------------------------- carried and lying views

  function circ(x, y, r) {
    return "M" + ri(x - r) + " " + ri(y) + "a" + ri(r) + " " + ri(r) + " 0 1 0 " + ri(2 * r) + " 0a" + ri(r) + " " + ri(r) + " 0 1 0 " + -ri(2 * r) + " 0z";

      else c.add(path(poly([P(hx1, hh, hz), P(hx1, hh, hz + dep), G(hx1, hz + dep), G(hx1, hz)]), "#4d4553"));
      c.add(path(poly([P(hx0, hh, hz), P(hx1, hh, hz), G(hx1, hz), G(hx0, hz)]), "#6f6159"));
      c.add(path(poly([P(hx0, hh + 0.12, hz), P(hx1, hh + 0.12, hz), P(hx1, hh, hz), P(hx0, hh, hz)]), "#d2b286"));
      var dx = lerp(hx0, hx1, 0.3 + rnd() * 0.3);
      c.add(path(poly([G(dx, hz), P(dx, 1.5, hz), P(dx + 0.7, 1.5, hz), G(dx + 0.7, hz)]), "#2c2522"));
    }

    // The road of packed dust narrowing toward the town, with worn tracks.
    c.add(path(poly([G(-2.2, 1.1), G(-1.5, 29), G(1.5, 29), G(2.2, 1.1)]), c.lin("road", 0, 640, 0, 1500, [[0, "#e6cb98"], [1, "#d1ae78"]])));
    c.add(path(poly([G(-0.75, 1.3), G(-0.62, 28), G(-0.5, 28), G(-0.55, 1.3)]) + poly([G(0.55, 1.3), G(0.5, 28), G(0.62, 28), G(0.75, 1.3)]), "#c29f6c", op(0.6)));

    // Olive trees: [x, z]. Long shadows fall to the right and away from the low western sun,
    // so the canopies of the left-hand trees lay bands of shade across the road.
    var trees = [[-3.9, 17], [4.6, 14], [-4.4, 10.5], [3.8, 7.5], [-3.6, 5.0]];
    var shade = "";
    for (i = 0; i < trees.length; i++) {
      var tx = trees[i][0], tz = trees[i][1], pts = [];
      for (k = 0; k < 14; k++) {
        var a = (k / 14) * Math.PI * 2, along = 5.6 + Math.cos(a) * 2.5, across = Math.sin(a) * 1.5;
        pts.push(G(tx + along * 0.92 - across * 0.38, tz + along * 0.38 + across * 0.92));
      }
      shade += poly(pts) + poly([G(tx - 0.1, tz), G(tx + 3.2 * 0.92 - 0.1, tz + 3.2 * 0.38 + 0.22), G(tx + 3.2 * 0.92 + 0.1, tz + 3.2 * 0.38 - 0.22), G(tx + 0.1, tz)]);
    }
    c.add(path(shade, "#6f5446", op(0.4)));

    // Stones and dry tufts along the roadside.
    var rs = "", tf = "";
    for (i = 0; i < 26; i++) {
      var sz = 3 + Math.pow(rnd(), 1.4) * 20, sx = (rnd() < 0.5 ? -1 : 1) * (2.3 + rnd() * 1.6), ss = 0.12 + rnd() * 0.18;
      var sp = G(sx, sz), sw = (F * ss) / sz;
      rs += "M" + ri(sp[0] - sw) + " " + ri(sp[1]) + "q" + ri(sw) + " " + ri(-sw * 0.9) + " " + ri(sw * 2) + " 0z";
      if (i % 2) tf += "M" + ri(sp[0] + sw * 2) + " " + ri(sp[1]) + "l" + ri(-sw * 0.4) + " " + ri(-sw * 1.6) + "M" + ri(sp[0] + sw * 2.2) + " " + ri(sp[1]) + "l" + ri(sw * 0.5) + " " + ri(-sw * 1.4);
    }
    c.add(path(rs, "#7d6b55"));
    c.add(line(tf, "#8f7c4c", 2.4, op(0.8)));

    // Olive trees: gnarled, forked trunks and wide, broken, silver-green crowns (local units = meters).
    var trunk = "M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.66-2.42L-.04-1.86L.04-1.9L.72-2.56L.86-2.42L.24-1.55C.42-1 .14-.5.34 0Z";
    for (i = 0; i < trees.length; i++) {
      var bx = trees[i][0], bz = trees[i][1], s = r2(F / bz), base = G(bx, bz);
      var g = '<g transform="translate(' + ri(base[0]) + " " + ri(base[1]) + ")scale(" + s + ')">';
      g += path(trunk, "#4a3a2c") + path("M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.74-2.36L-.08-1.62C-.3-1-.02-.6-.12 0Z", "#8a7458", op(0.6));
      var cd = "", cs = "", cl = "";
      for (k = 0; k < 13; k++) {
        // Clumps sit around a connected, flattened crown (outer ring) plus a few inside.
        var ca = (k / 9) * Math.PI * 2 + rnd() * 0.4, cr = k < 9 ? 0.85 + rnd() * 0.15 : rnd() * 0.5;
        var px = Math.cos(ca) * cr * 1.45, py = -2.95 + Math.sin(ca) * cr * 0.55, pr = 0.4 + rnd() * 0.22;
        var arc = "M" + r2(px - pr) + " " + r2(py) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        cd += arc;
        cs += "M" + r2(px - pr) + " " + r2(py + 0.16) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        if (px < 0.3) cl += "M" + r2(px - pr * 0.9) + " " + r2(py - 0.08) + "a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(pr * 1.2) + " 0a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(-pr * 1.2) + " 0z";
      }
      g += path(cs, "#545a3c") + path(cd, "#7c8462") + path(cl, "#b6b98e", op(0.85));
      c.add(g + "</g>");
    }

    c.glow("haze", MX, 610, 980, "#ffe9bf", 0.3, 420);
    c.vignette("#5a3a1e", 0.4, MX, 700, 1300);
    c.grain(0.25, 0.6);
    return c.svg();
  };

  // Asher's doorway at dusk: amber lamplight inside, the sky turning violet; landscape also sees
  // down the lane to the lake, where one other window is lit.
  scenes.doorway_evening = function (c) {
    var rnd = c.rnd, i;
    var DL = 728, DR = 872, DT = 612, DB = 902;
    c.add(rect(0, 0, W, 720, c.lin("sky", 0, 0, 0, 660, [[0, "#1f1a35"], [0.35, "#3b3157"], [0.62, "#77587a"], [0.82, "#c07e79"], [1, "#e5a473"]])));
    c.add(path("M520 120h3v3h-3zM980 210h3v3h-3zM1262 80h3v3h-3zM300 260h2v2h-2z", "#f4f1ea", op(0.85)));

    // View down the lane (left, landscape): dusk lake, far hills, rooftops with one lit window.
    c.add(path(ridge(rnd, 612, 8, 5, 650), "#3d3350"));
    c.add(rect(0, 642, 420, 70, c.lin("lake", 0, 642, 0, 712, [[0, "#c28a86"], [1, "#4c3d5b"]])));
    c.add(path("M-10 700L80 690V662H170V700L240 694V676H330V712L400 706V1000H-10Z", "#1b1622"));
    c.add(rect(120, 676, 12, 10, "#f2b45a"));
    c.add(rect(0, 820, 400, 780, "#221c24"));

    // House front of black basalt, warmed only near the doorway.
    c.add(rect(380, 430, 1220, 1170, "#1d1922"));
    var tones = ["#2d2833", "#36303c", "#403846", "#5a4434", "#7a5534"];
    c.add('<g clip-path="' + c.clip("front", "M380 430H1600V920H380Z") + '">');
    addStones(c, stones(rnd, flat, {
      u0: 380, u1: W, v0: 448, v1: 920, ch: [46, 68], sw: [74, 136], gap: 4, jit: 5, n: 5,
      keep: function (u, v) { return !(u > DL - 24 && u < DR + 24 && v > DT - 30); },
      tone: function (x, y, r) {
        var d = Math.sqrt((x - 800) * (x - 800) + (y - 760) * (y - 760) * 1.3);
        if (d < 300) return 3 + (r() < 0.5 && d < 200 ? 1 : 0);
        return Math.floor(r() * 3);
      }
    }), tones);
    // Corner stones at the left edge of the house.
    var q = "";
    for (i = 0; i < 7; i++) q += poly([[380, 452 + i * 66], [380 + (i % 2 ? 60 : 96), 452 + i * 66], [380 + (i % 2 ? 60 : 96), 512 + i * 66], [380, 512 + i * 66]]);
    c.add(path(q, "#3c3644"));
    c.add("</g>");
    // Roof edge of packed mud over reeds, with beam ends under it.
    c.add(path("M370 414L1600 406V446L370 452Z", "#2b232a"));
    var fr = "M370 418";
    for (var fx = 370; fx < W; fx += 22 + rnd() * 26) fr += "L" + ri(fx) + " " + ri(400 + rnd() * 12);
    c.add(path(fr + "L1600 404V414L370 418Z", "#4a3a2c"));
    var be = "";
    for (i = 0; i < 11; i++) be += "M" + (430 + i * 112) + " 448h22v18h-22z";
    c.add(path(be, "#2a1e15"));

    // Doorway: amber interior with a lit lamp niche, the door leaf swung inward.
    c.add(rect(DL, DT, DR - DL, DB - DT, c.rad("inside", 815, 770, 220, [[0, "#ffd284"], [0.45, "#d98a3a"], [1, "#6e3714"]], 260)));
    c.add(rect(790, 712, 46, 40, "#ffe3a8", op(0.7)));
    c.add(path("M802 744h22l-4-10h-14z", "#7a4a2a"));
    c.add(path(poly([[DL, DT], [DL + 34, DT + 14], [DL + 34, DB - 8], [DL, DB]]), "#3a2414"));
    c.add(path(poly([[DR, DT], [DR, DB], [DR - 14, DB - 10], [DR - 14, DT + 8]]), "#c98446"));
    c.add(path(poly([[706, 588], [894, 586], [894, 614], [706, 616]]), "#3a2a1d"));
    c.add(path(poly([[716, 902], [884, 902], [892, 920], [708, 920]]), "#5e4a40"));

    // Water jar by the door, lit on the door side.
    c.add(path("M612 912C590 868 596 822 620 806C616 798 620 792 628 790H660C668 792 672 798 668 806C692 822 698 868 676 912Z",
      c.lin("jar", 594, 0, 700, 0, [[0, "#1e1418"], [0.7, "#4a2c22"], [1, "#c27a3c"]])));

    // Ground in front of the house and the warm spill from the door.
    c.add(rect(380, 918, 1220, 682, c.lin("ground", 0, 918, 0, 1400, [[0, "#3b3037"], [1, "#1c171c"]])));
    c.add(path(poly([[DL, 920], [DR, 920], [1010, 1300], [590, 1300]]), c.lin("spill", 0, 920, 0, 1300, [[0, "#f3a24a", 0.5], [1, "#f3a24a", 0]])));
    c.glow("door", 800, 760, 420, "#f2a24c", 0.38, 380);

    c.vignette("#0e0b16", 0.6, MX, 720, 1300);
    c.grain(0.28, 0.35);
    return c.svg();
  };

  // Calm neutral gradient for unknown ids.
  function fallback(c) {
    c.add(full(c.lin("bg", 0, 0, 0, 1600, [[0, "#3b3e44"], [0.6, "#5a5751"], [1, "#2c2b29"]])));
    c.vignette("#000", 0.4);
    return c.svg();
  }

  // ---------------------------------------------------------------- public API

  // Point of view can swap a scene for its lying or eye-level counterpart, so a camera
  // change (fx "pov") can simply re-render the current background with the new pov.
  var LYING = { asher_home: "asher_ceiling", lane: "sky_carried", crowd: "crowd_lying" };
  var STANDING = { asher_ceiling: "asher_home", sky_carried: "lane", crowd_lying: "crowd" };
  var TIMES = { day: 1, evening: 1, night: 1 };

  function resolve(bgId, pov) {
    var id = typeof bgId === "string" ? bgId : "";
    if (pov === "lying" && LYING[id]) return LYING[id];
    if (pov === "standing" && STANDING[id]) return STANDING[id];
    return id;
  }

  BHS.art = {
    ids: IDS.slice(),
    // Canvas size of every scene (viewBox), rendered with preserveAspectRatio "xMidYMid slice".
    viewBox: [W, H],
    // Where the luminous space sits in each crowd scene, in canvas units, so the UI can
    // anchor its presence light there. Map to the screen with the slice math:
    // s = max(stageW / 1600, stageH / 1600); x = stageW / 2 + (cx - 800) * s; y = stageH / 2 + (cy - 800) * s.
    lightAt: { crowd: [800, 650], crowd_lying: [1380, 720] },
    // Returns the bg id that render() will actually draw for this pov.
    resolve: resolve,
    // opts: { pov?: "normal"|"lying"|"standing", time?: "day"|"evening"|"night", uid?: string }
    render: function (bgId, opts) {
      var o = opts || {};
      var id = resolve(bgId, o.pov);
      var known = Object.prototype.hasOwnProperty.call(scenes, id);
      var uid = typeof o.uid === "string" && /^[A-Za-z0-9_-]{1,24}$/.test(o.uid) ? o.uid : (++renderCount).toString(36);
      var so = { pov: o.pov, time: TIMES[o.time] ? o.time : "day" };

        return known ? scenes[id](new Ctx(id, uid), so) : fallback(new Ctx("unknown", uid));
      } catch (err) {
        try { return fallback(new Ctx("unknown", uid)); } catch (e2) {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"><rect width="1600" height="1600" fill="#3b3e44"/></svg>';
        }
      }
    }
  };
})();
