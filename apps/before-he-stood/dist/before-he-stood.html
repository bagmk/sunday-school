<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1d1a">
<meta name="color-scheme" content="dark">
<meta name="description" content="마태복음 9:1–8을 세 인물의 눈으로 따라가는 한영 이야기 게임 · A bilingual story game on Matthew 9:1–8">
<title>그가 일어나기 전 · Before He Stood</title>
<style>
/*
 * css/style.css - one committed look for "Before He Stood".
 * Scene art fills the stage; story text sits on an opaque papyrus panel in iron-gall ink.
 * Palette from Capernaum: black basalt, limestone, Galilee blue, olive, lamp amber.
 * Jesus' presence is warm white light only (never a figure), and it never covers text.
 *
 * Two first-class displays (SPEC 5.6):
 *   - phone portrait (default rules below, px-based sizes);
 *   - TV / laptop landscape (the "TV" media query near the end swaps the size tokens to vh units:
 *     story text >= 3.6vh, names/options >= 3vh, nothing below 2.2vh).
 */

:root {
  color-scheme: dark;

  /* Place */
  --basalt: #1f1d1a;
  --basalt-2: #2b2824;
  --basalt-3: #3a3631;
  --limestone: #ebe3cf;
  --limestone-dim: #b8ae98;
  --galilee: #2c6a86;
  --galilee-hi: #4b93b4;
  --olive: #5f6d33;
  --amber: #c98a1f;
  --amber-soft: #e3b25c;

  /* Papyrus panel and ink */
  --papyrus-hi: #f6efdc;
  --papyrus: #ede2c5;
  --papyrus-lo: #dfd0ac;
  --vellum: #fbf7ec;
  --ink: #261d15;
  --ink-soft: #54463a;
  --ink-faint: #7a6a55;
  --rule: rgba(42, 33, 25, 0.22);

  /* Presence */
  --light: #fff3d3;
  --light-core: #fffaf0;
  --light-glow: rgba(255, 232, 172, 0.55);

  /* Interaction */
  --focus: #2f7fa6;
  --focus-light: #fff3d3;

  /* Type families */
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Noto Serif KR", "Noto Serif CJK KR", "Source Han Serif K", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --text-scale: 1;

  /* Size tokens (phone portrait). The TV query below redefines them in vh. */
  --fs-story: 17px;
  --fs-story-en: 15.3px;
  --fs-verse: 18.5px;
  --fs-verse-en: 16.2px;
  --fs-name: 13.5px;
  --fs-prompt: 16px;
  --fs-prompt-en: 14px;
  --fs-option: 16px;
  --fs-option-en: 14px;
  --fs-small: 12.5px;
  --fs-small-en: 11.5px;
  --fs-ui: 16px;
  --fs-ui-en: 12.8px;
  --fs-reply: 14.5px;
  --fs-pin: 15px;
  --fs-echo: 18px;
  --fs-last: 24px;
  --fs-card-title: 30px;
  --fs-action: 14.5px;
  --fs-press: 17px;

  --lh-story: 1.72;
  --panel-w: 100%;
  --panel-min-h: 132px;
  --panel-pad: 20px 18px 24px;
  --panel-radius: 6px;
  --dock-gap: 10px;
  --fs-memory: 22px;
  --fs-memory-en: 17px;
  --fs-snip-title: 28px;
  --fs-stamp: 34px;
  --hdr-btn: 44px;
  --fs-hdr: 13px;
  --focus-w: 3px;

  /* Layout */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --header-h: 60px;
  --ease-out: cubic-bezier(0.2, 0.7, 0.1, 1);
  --fade: 450ms;

  --paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ------------------------------------------------------------------ base */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--basalt);
  background-image: radial-gradient(120% 80% at 50% 0%, #2a2723 0%, var(--basalt) 60%);
  color: var(--limestone);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  touch-action: manipulation;
}

[hidden] {
  display: none !important;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: 2px;
}

/* The second language of a bilingual pair always sits on its own line. */
span.en {
  display: block;
}

/* Hide the pointer while a class watches the TV (set by main.js after 3 s without movement). */
body.is-idle,
body.is-idle * {
  cursor: none !important;
}

/* ------------------------------------------------------------------ app frame */

.app {
  position: relative;
  height: 100%;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background: var(--basalt);
}

/* ------------------------------------------------------------------ stage */

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--basalt);
}

.art {
  position: absolute;
  inset: -5%;
  transform-origin: 50% 60%;
  transition: transform 2.4s var(--ease-out), filter 0.8s ease;
}

.art__sway {
  position: absolute;
  inset: 0;
}

.art__layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--fade) ease;
}

.art__layer.is-on {
  opacity: 1;
}

.art__layer svg {
  display: block;
  width: 100%;
  height: 100%;
}

.art__fallback {
  position: absolute;
  inset: 0;
}

/* POV: lying feels tilted and close; standing levels the world. */
.stage[data-pov="lying"] .art {
  transform: rotate(-2deg) scale(1.07) translateY(1.5%);
}

.stage[data-pov="lying"] .art__sway {
  animation: sway 11s ease-in-out infinite;
}

.stage.is-rising .art {
  animation: rise 2.6s var(--ease-out) both;
}

@keyframes sway {
  0%,
  100% {
    transform: rotate(0deg) translateY(0);
  }
  50% {
    transform: rotate(0.6deg) translateY(-0.6%);
  }
}

@keyframes rise {
  0% {
    transform: rotate(-2deg) scale(1.12) translateY(9%);
  }
  100% {
    transform: none;
  }
}

/* Veil: a constant vignette for legibility; the hush deepens it (the light stays above it). */
.veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(14, 13, 11, 0.42) 0%, rgba(14, 13, 11, 0) 18%, rgba(14, 13, 11, 0) 52%, rgba(14, 13, 11, 0.5) 100%),
    radial-gradient(140% 100% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(8, 7, 6, 0.45) 100%);
  transition: background-color 0.9s ease;
}

body.is-hush .veil {
  background-color: rgba(8, 7, 6, 0.5);
}

body.is-hush .art {
  filter: saturate(0.3) brightness(0.72);
}

body.is-hush .topbar,
body.is-hush .caption {
  opacity: 0.25;
}

body[data-screen="title"] .veil,
body[data-screen="routeSelect"] .veil {
  background-color: rgba(10, 9, 8, 0.25);
}

body[data-screen="endingCard"] .veil,
body.is-last .veil {
  background-color: rgba(10, 9, 8, 0.6);
}

/* The light of Jesus' presence: a warm bloom inside the stage, never a figure, never over text. */
.light {
  position: absolute;
  inset: -10%;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 1.8s ease, transform 2.2s var(--ease-out);
  /* main.js/ui.js anchor the bloom to BHS.art.lightAt for the drawn scene via --light-x/--light-y. */
  background: radial-gradient(48% 36% at var(--light-x, 50%) var(--light-y, 38%), rgba(255, 251, 238, 0.95) 0%, rgba(255, 239, 200, 0.62) 28%, rgba(255, 224, 160, 0.22) 55%, rgba(255, 224, 160, 0) 78%);
}

.light::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 238, 200, 0.2);
  opacity: 0;
  transition: opacity 1.8s ease;
}

.stage[data-pov="lying"] .light {
  --light-y: 16%;
}

.light[data-level="soft"] {
  opacity: 0.6;
}

.light[data-level="bright"] {
  opacity: 1;
  transform: scale(1.18);
  animation: breathe 7s ease-in-out infinite;
}

.light[data-level="bright"]::after {
  opacity: 1;
}

@keyframes breathe {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.08);
  }
}

/* ------------------------------------------------------------------ portraits
   Busts stand on the top edge of the text panel (main.js measures it into --panel-top) and sink a
   little behind it. They sit under captions, overlays and the whole play layer, so they never
   cover text or choices. Slots 0/1 are the left and right thirds, clear of the central light. */

.cast {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  overflow: hidden;
  transition: opacity 0.2s ease;
  --cast-h: 26vh;
  --cast-x: 1.5vw;
  --cast-sink: 9vh;
}

.cast.is-away {
  opacity: 0;
}

.figure {
  position: absolute;
  bottom: calc(var(--panel-top, 30vh) - var(--cast-sink));
  height: var(--cast-h);
  aspect-ratio: 2 / 3;
  transition: opacity 0.22s ease, transform 0.22s ease, filter 0.22s ease;
}

.figure svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0.6vh 1.2vh rgba(0, 0, 0, 0.45));
  /* The bust's cut edge fades out instead of ending in a hard line beside the panel. */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
}

.figure.is-mirror svg {
  transform: scaleX(-1);
}

.figure[data-slot="0"] {
  left: var(--cast-x);
}

.figure[data-slot="1"] {
  right: var(--cast-x);
}

.figure.is-dim {
  filter: brightness(0.55) saturate(0.85);
}

.figure.is-in {
  animation: figure-in 0.22s ease-out both;
}

.figure[data-slot="1"].is-in {
  animation-name: figure-in-right;
}

.figure.is-out {
  opacity: 0;
  transform: translateY(1.5vh);
}

@keyframes figure-in {
  from {
    opacity: 0;
    transform: translateX(-2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes figure-in-right {
  from {
    opacity: 0;
    transform: translateX(2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ------------------------------------------------------------------ top bar */

.topbar {
  position: absolute;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--safe-top) + 8px) var(--gutter-r) 8px var(--gutter-l);
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.topbar > * {
  pointer-events: auto;
}

/* Outside the TV layout the page screens scroll under the header: give it a backdrop there. */
@media not all and (min-aspect-ratio: 5/4) and (min-width: 960px) and (min-height: 540px) {
  body[data-screen="routeSelect"] .topbar,
  body[data-screen="tree"] .topbar,
  body[data-screen="trees"] .topbar {
    background: linear-gradient(180deg, rgba(16, 15, 13, 0.96) 0%, rgba(16, 15, 13, 0.96) 72%, rgba(16, 15, 13, 0) 100%);
    padding-bottom: 16px;
  }
}

.topbar__spacer {
  flex: 1;
  pointer-events: none;
}

.iconbtn {
  display: inline-grid;
  place-items: center;
  width: var(--hdr-btn);
  height: var(--hdr-btn);
  border-radius: 50%;
  color: var(--limestone);
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.iconbtn svg {
  width: 45%;
  height: 45%;
}

.seg {
  display: inline-flex;
  border-radius: 999px;
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.seg__btn {
  position: relative;
  min-width: calc(var(--hdr-btn) + 2px);
  height: var(--hdr-btn);
  padding: 0 0.8em;
  border-radius: 999px;
  font: 600 var(--fs-hdr) / 1 var(--sans);
  color: var(--limestone-dim);
  z-index: 0;
}

.seg__btn::before {
  content: "";
  position: absolute;
  inset: 11% 6%;
  border-radius: 999px;
  z-index: -1;
  transition: background-color 0.2s ease;
}

.seg__btn[aria-pressed="true"] {
  color: var(--ink);
}

.seg__btn[aria-pressed="true"]::before {
  background: var(--limestone);
}

/* ------------------------------------------------------------------ caption chip */

.caption {
  position: absolute;
  z-index: 20;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  left: var(--gutter-l);
  max-width: calc(100% - var(--gutter-l) - var(--gutter-r));
  padding: 0.45em 0.85em 0.5em;
  border-radius: 6px;
  background: rgba(22, 20, 17, 0.72);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.35 var(--sans);
  letter-spacing: 0.01em;
  pointer-events: none;
  animation: fade-in 0.6s ease both;
  transition: opacity 0.6s ease;
}

.caption .en {
  color: var(--limestone-dim);
  font-size: var(--fs-small-en);
}

/* ------------------------------------------------------------------ echo verse overlay */

.echo {
  position: absolute;
  z-index: 16;
  left: var(--gutter-l);
  right: var(--gutter-r);
  top: calc(var(--safe-top) + var(--header-h) + 48px);
  padding: 1em 1.1em 0.8em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.74);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  color: var(--limestone);
  text-align: center;
  font: 400 calc(var(--fs-echo) * var(--text-scale)) / 1.7 var(--serif);
  pointer-events: none;
  animation: echo-in 1.1s ease both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.echo .en {
  margin-top: 0.3em;
  font-size: 0.86em;
  color: var(--limestone-dim);
}

.echo__ref {
  display: block;
  margin-top: 0.5em;
  font: 500 var(--fs-small) / 1.2 var(--sans);
  color: var(--limestone-dim);
}

.echo mark {
  color: var(--light-core);
  background: linear-gradient(180deg, transparent 58%, rgba(227, 178, 92, 0.75) 58%) no-repeat 0 0 / 0% 100%;
  animation: bleed 1.4s 0.5s ease-out forwards;
  padding: 0 1px;
}

@keyframes echo-in {
  from {
    opacity: 0;
    filter: blur(6px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

@keyframes bleed {
  to {
    background-size: 100% 100%;
  }
}

/* ------------------------------------------------------------------ pinned thought bubble */

.pin {
  position: absolute;
  z-index: 18;
  top: calc(var(--safe-top) + var(--header-h) + 68px);
  right: var(--gutter-r);
  width: min(78%, 330px);
  padding: 0.8em 1.05em 0.85em;
  border-radius: 1.3em;
  background: rgba(251, 247, 236, 0.96);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  font: italic 400 calc(var(--fs-pin) * var(--text-scale)) / 1.55 var(--serif);
  pointer-events: none;
  animation: pop-in 0.45s var(--ease-out) both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.pin::before,
.pin::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(251, 247, 236, 0.96);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.pin::before {
  width: 0.95em;
  height: 0.95em;
  left: 1.7em;
  bottom: -1.2em;
}

.pin::after {
  width: 0.55em;
  height: 0.55em;
  left: 1.05em;
  bottom: -2em;
}

.pin__item + .pin__item {
  margin-top: 0.5em;
  padding-top: 0.5em;
  border-top: 1px dashed var(--rule);
}

.pin__item .en {
  font-size: 0.88em;
  color: var(--ink-soft);
}

.pin__ref {
  display: block;
  font: normal 500 var(--fs-small-en) / 1.3 var(--sans);
  color: var(--ink-faint);
}

.receipt {
  position: absolute;
  right: 0.8em;
  bottom: -1.9em;
  padding: 0.2em 0.65em 0.25em;
  border-radius: 999px;
  background: rgba(18, 16, 14, 0.8);
  color: #a8d8ee;
  font: normal 600 var(--fs-small) / 1.2 var(--sans);
  letter-spacing: 0.02em;
  animation: stamp 0.5s var(--ease-out) both;
}

@keyframes stamp {
  0% {
    opacity: 0;
    transform: scale(1.6) rotate(-6deg);
  }
  60% {
    opacity: 1;
    transform: scale(0.95) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ------------------------------------------------------------------ play layer */

.play {
  position: absolute;
  inset: 0;
  z-index: 30;
}

.advance {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  cursor: pointer;
}

.advance:focus-visible {
  outline-offset: -8px;
}

.dock {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  width: 100%;
  max-width: calc(var(--panel-w) + var(--gutter-l) + var(--gutter-r));
  padding: 0 var(--gutter-r) calc(var(--safe-bottom) + 14px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  gap: var(--dock-gap);
  pointer-events: none;
  max-height: calc(100% - var(--safe-top) - var(--header-h) - 8px);
}

.dock > * {
  pointer-events: auto;
  flex-shrink: 0;
}

.dock > .panel,
.dock > .reply {
  pointer-events: none;
}

.dock > .choices {
  flex: 0 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------------ text panel */

.panel {
  position: relative;
  min-height: var(--panel-min-h);
  padding: var(--panel-pad);
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), radial-gradient(130% 120% at 30% 0%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 60%), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 45%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(120, 90, 50, 0.12), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  animation: panel-in 0.35s ease both;
  transition: box-shadow 0.8s ease, background-color 0.8s ease;
}

/* A darker rolled edge along the top, like the lip of a scroll. */
.panel::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 6px;
  border-radius: var(--panel-radius) var(--panel-radius) 0 0;
  background: linear-gradient(180deg, rgba(110, 80, 44, 0.3), rgba(110, 80, 44, 0));
  pointer-events: none;
}

@keyframes panel-in {
  from {
    opacity: 0.4;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.plate {
  position: absolute;
  left: 0.9em;
  top: 0;
  transform: translateY(-58%);
  max-width: calc(100% - 1.8em);
  padding: 0.35em 0.9em 0.42em;
  border-radius: 0.3em;
  background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), var(--plate, var(--basalt-3));
  color: #fbf5e6;
  font: 600 var(--fs-name) / 1.25 var(--sans);
  letter-spacing: 0.01em;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.plate__en {
  font-weight: 500;
  opacity: 0.9;
}

.plate__en--stack::before {
  content: " \00B7  ";
}

.plate--jesus {
  background: var(--light);
  color: #6f4b0c;
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.35), 0 0 22px rgba(255, 236, 190, 0.95);
}

.text {
  font-family: var(--serif);
  font-size: calc(var(--fs-story) * var(--text-scale));
  line-height: var(--lh-story);
  word-break: keep-all;
  overflow-wrap: anywhere;
  min-height: 1.5em;
}

.text p {
  margin: 0;
}

.text .en {
  margin-top: 0.35em;
  font-size: calc(var(--fs-story-en) * var(--text-scale));
  line-height: 1.5;
  color: var(--ink-soft);
}

.text em {
  font-style: normal;
  font-weight: 700;
}

.text .q {
  color: #44300f;
}

.c {
  opacity: 0;
}

.c.on {
  opacity: 1;
}

.more {
  position: absolute;
  right: 1em;
  bottom: 0.6em;
  width: 0;
  height: 0;
  border-left: 0.4em solid transparent;
  border-right: 0.4em solid transparent;
  border-top: 0.55em solid var(--ink-soft);
  font-size: var(--fs-story);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.panel.is-ready .more {
  opacity: 0.75;
  animation: nudge 1.4s ease-in-out infinite;
}

@keyframes nudge {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(3px);
  }
}

/* Inner voice: italic, no name plate. */
.panel--thought .text {
  font-style: italic;
  color: #382c20;
}

/* Scripture card. */
.panel--verse {
  background-color: var(--vellum);
  background-image: var(--paper-grain), linear-gradient(180deg, #fdfaf1, #f4ecd9);
  box-shadow: inset 0 0 0 5px var(--vellum), inset 0 0 0 6px rgba(138, 98, 42, 0.32), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
}

.panel--verse::before {
  display: none;
}

.panel--verse .text {
  font-size: calc(var(--fs-verse) * var(--text-scale));
  color: #241a10;
}

.panel--verse .text .en {
  font-size: calc(var(--fs-verse-en) * var(--text-scale));
}

/* No orphan word on a verse or memory card. */
.panel--verse .text p {
  text-wrap: balance;
}

/* The reference keeps clear of the "more" marker in the corner. */
.panel--verse .ref {
  padding-right: 1.6em;
}

.panel--jesus {
  box-shadow: inset 0 0 0 5px var(--light-core), inset 0 0 0 6px rgba(201, 138, 31, 0.5), 0 0 0 1px rgba(255, 240, 205, 0.85), 0 0 48px 12px var(--light-glow), 0 12px 32px rgba(0, 0, 0, 0.32);
}

.ref {
  margin-top: 0.6em;
  text-align: right;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  letter-spacing: 0.02em;
  color: var(--ink-faint);
}

/* Sign lines (story captions, sound cues, time skips): centered on the stage at body size. */
.play--sign .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--sign .panel {
  align-self: center;
  min-height: 0;
  max-width: 100%;
  padding: 0.8em 1.4em;
  border-radius: 10px;
  background: rgba(14, 13, 11, 0.72);
  background-image: none;
  box-shadow: none;
  color: var(--limestone);
  text-align: center;
}

.play--sign .panel::before,
.play--sign .more {
  display: none;
}

.play--sign .text {
  letter-spacing: 0.01em;
}

.play--sign .text .en {
  color: var(--limestone-dim);
}

/* The last line of an ending: large, centered, lit. */
.play--last .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--last .panel {
  background: none;
  box-shadow: none;
  min-height: 0;
  padding: 8px 6px;
  text-align: center;
  color: var(--light-core);
  animation: last-in 1.6s ease both;
}

.play--last .panel::before,
.play--last .more {
  display: none;
}

.play--last .text {
  font-size: calc(var(--fs-last) * var(--text-scale));
  line-height: 1.55;
  text-shadow: 0 2px 22px rgba(0, 0, 0, 0.85);
}

.play--last .text .en {
  margin-top: 0.6em;
  font-size: calc(var(--fs-last) * 0.74 * var(--text-scale));
  color: var(--limestone);
}

@keyframes last-in {
  from {
    opacity: 0;
    letter-spacing: 0.06em;
  }
  to {
    opacity: 1;
    letter-spacing: 0;
  }
}

/* ------------------------------------------------------------------ transient action reply */

.reply {
  align-self: flex-start;
  max-width: 92%;
  padding: 0.45em 0.8em 0.5em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.82);
  color: var(--limestone);
  font: italic 400 calc(var(--fs-reply) * var(--text-scale)) / 1.45 var(--serif);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.reply:empty {
  display: none;
}

.reply.is-on {
  opacity: 1;
  transform: none;
}

.reply .en {
  font-size: 0.9em;
  color: var(--limestone-dim);
}

/* ------------------------------------------------------------------ choices */

.choices {
  padding: 16px 14px 14px;
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 50%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: panel-in 0.35s ease both;
}

.choices__prompt {
  margin: 0 2px 0.75em;
  font: 700 calc(var(--fs-prompt) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
}

.choices__prompt .en {
  font-weight: 400;
  font-size: calc(var(--fs-prompt-en) * var(--text-scale));
  color: var(--ink-soft);
}

.choices__list {
  display: grid;
  gap: 9px;
  /* While the scold removal pins the list height, the rows must not stretch to fill it. */
  align-content: start;
}

.opt {
  position: relative;
  display: block;
  width: 100%;
  min-height: 52px;
  padding: 12px 16px 13px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.26);
  background: rgba(255, 252, 244, 0.78);
  color: var(--ink);
  text-align: left;
  font: 400 calc(var(--fs-option) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 1px 2px rgba(42, 33, 25, 0.08);
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  animation: opt-in 0.4s ease both;
}

.opt:nth-child(2) {
  animation-delay: 0.05s;
}

.opt:nth-child(3) {
  animation-delay: 0.1s;
}

.opt:nth-child(4) {
  animation-delay: 0.15s;
}

@keyframes opt-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.opt:hover {
  background: #fffaf0;
  border-color: rgba(42, 33, 25, 0.5);
}

.opt:active {
  transform: translateY(1px);
  background: #f3e9d2;
}

.opt__body {
  display: block;
  min-width: 0;
}

/* The small scissors: this option's cut branch was already seen on this device (no text). */
.opt__snip {
  position: absolute;
  top: 7px;
  right: 8px;
  width: 15px;
  height: 15px;
  color: var(--ink-faint);
  opacity: 0.9;
}

.opt[data-snipped="true"] {
  padding-right: 30px;
}

/* A choice asked again after a scold: no entrance animation (nothing pops in again); the scolded
   option fades out in place and the others glide to their new places (ui.js, FLIP). */
.choices.is-again,
.choices__list.is-again .opt {
  animation: none;
}

.opt--leaving {
  pointer-events: none;
  transition: opacity 0.26s ease, transform 0.26s ease;
}

.opt--leaving.is-going {
  opacity: 0;
  transform: scale(0.94);
}

/* The scolded option is struck through for a moment before it fades (ui.js, REMOVE_HOLD). */
.opt--leaving .opt__body {
  text-decoration-line: line-through;
  text-decoration-color: rgba(163, 57, 43, 0.85);
  text-decoration-thickness: 0.1em;
}

/* A clicker's next key held on a focused option fills it from the left; when the fill is complete the
   option is picked (main.js, HOLD_MS = 800 ms). */
.opt.is-holding::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  border-radius: inherit;
  background: rgba(227, 178, 92, 0.6);
  mix-blend-mode: multiply;
  pointer-events: none;
  animation: opt-hold 0.8s linear both;
}

@keyframes opt-hold {
  from {
    -webkit-clip-path: inset(0 100% 0 0);
    clip-path: inset(0 100% 0 0);
  }
  to {
    -webkit-clip-path: inset(0 0 0 0);
    clip-path: inset(0 0 0 0);
  }
}

.opt .en {
  margin-top: 0.2em;
  font-size: calc(var(--fs-option-en) * var(--text-scale));
  color: var(--ink-soft);
}

.opt em {
  font-style: normal;
  font-weight: 700;
}

/* ------------------------------------------------------------------ press + persistent actions */

.pressbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-bottom: 6px;
}

/* Asher stands up (the rise): the next press appears only once he is up (ui.js marks play--rising). */
.play--rising .pressbox {
  animation: fade-in 0.5s 1.8s both;
}

.pressbox__hint {
  margin: 0;
  padding: 0.35em 0.9em;
  border-radius: 999px;
  background: rgba(14, 13, 11, 0.7);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.4 var(--sans);
  text-align: center;
}

.glow {
  min-width: 13em;
  min-height: 56px;
  padding: 0.7em 1.8em;
  border-radius: 999px;
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  color: #4d340a;
  font: 700 calc(var(--fs-press) * var(--text-scale)) / 1.3 var(--serif);
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 26px 6px rgba(255, 230, 165, 0.65), 0 6px 18px rgba(0, 0, 0, 0.35);
  animation: glow-pulse 2.4s ease-in-out infinite;
}

.glow .en {
  font: 500 0.78em/1.3 var(--sans);
  color: #6e501d;
}

@keyframes glow-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 22px 4px rgba(255, 230, 165, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.7), 0 0 38px 12px rgba(255, 234, 175, 0.85), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
}

.actions {
  display: flex;
  gap: 10px;
}

.act {
  flex: 1;
  min-height: 48px;
  padding: 0.5em 0.8em;
  border-radius: 10px;
  background: rgba(60, 57, 52, 0.85);
  border: 1px solid rgba(235, 227, 207, 0.14);
  color: #c4beb3;
  font: 600 var(--fs-action) / 1.25 var(--sans);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: transform 0.1s ease, background-color 0.2s ease;
}

.act:active {
  transform: translateY(1px) scale(0.99);
  background: rgba(70, 66, 60, 0.9);
}

.act .en {
  font-weight: 500;
  font-size: 0.85em;
  color: #a39d92;
}

.act.is-shake {
  animation: refuse 0.36s ease;
}

@keyframes refuse {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-4px);
  }
  50% {
    transform: translateX(3px);
  }
  75% {
    transform: translateX(-2px);
  }
}

.act.glow {
  min-width: 0;
  border: 0;
  color: #4d340a;
  font-size: var(--fs-press);
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.act.glow .en {
  color: #6e501d;
}

/* ------------------------------------------------------------------ ending title card */

.card {
  position: absolute;
  inset: calc(var(--safe-top) + var(--header-h)) var(--gutter-r) calc(var(--safe-bottom) + 40px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  pointer-events: none;
  color: var(--limestone);
  animation: fade-in 1.2s ease both;
}

.card__title {
  margin: 0;
  font: 700 calc(var(--fs-card-title) * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
  text-shadow: 0 0 34px rgba(255, 232, 172, 0.45), 0 2px 18px rgba(0, 0, 0, 0.6);
}

.card--good .card__title {
  font-size: calc(var(--fs-card-title) * 1.12 * var(--text-scale));
}

.card__title .en {
  margin-top: 0.25em;
  font-weight: 400;
  font-size: 0.6em;
  color: var(--limestone);
}

.card__hint {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  margin: 0;
  font: 500 var(--fs-small) / 1.4 var(--sans);
  color: var(--limestone-dim);
  animation: fade-in 1s 1.4s ease both;
}

/* The last line: one sentence per line where it fits (ui.js breaks after each sentence). */
.play--last .text p {
  white-space: pre-line;
}

/* ------------------------------------------------------------------ memory verse (true ending)

   The verse card style, larger and centered on the screen, in the light. */

.play--memory .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.panel--memory {
  align-self: center;
  width: 100%;
  min-height: 0;
  padding: 28px 22px 22px;
  text-align: center;
  box-shadow: inset 0 0 0 6px var(--light-core), inset 0 0 0 7px rgba(201, 138, 31, 0.55), 0 0 0 1px rgba(255, 240, 205, 0.9), 0 0 60px 18px var(--light-glow), 0 14px 36px rgba(0, 0, 0, 0.4);
  animation: memory-in 1.1s ease both;
}

/* --memory-fit (ui.js) scales the type down only when a long verse would not fit the screen. */
.panel--memory .text {
  font-size: calc(var(--fs-memory) * var(--text-scale) * var(--memory-fit, 1));
  line-height: 1.5;
  word-break: keep-all;
}

.panel--memory .text .en {
  margin-top: 0.55em;
  font-size: calc(var(--fs-memory-en) * var(--text-scale) * var(--memory-fit, 1));
  line-height: 1.45;
}

.panel--memory .ref {
  margin-top: 1em;
  padding-left: 1.6em;
  text-align: center;
  font-size: var(--fs-small);
  letter-spacing: 0.04em;
}

.panel--memory .plate {
  left: 50%;
  transform: translate(-50%, -58%);
}

@keyframes memory-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ------------------------------------------------------------------ snip card (a cut branch)

   A paper slip over the dimmed scene: a dashed cut line with scissors running along it, a rubber
   stamp "Snip!", the branch title, one line, and the two buttons. */

.snip {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--safe-top) + var(--header-h)) var(--gutter-r) calc(var(--safe-bottom) + 20px) var(--gutter-l);
  background: radial-gradient(80% 70% at 50% 50%, rgba(14, 13, 11, 0.35), rgba(14, 13, 11, 0.72));
}

.snip__card {
  position: relative;
  width: min(520px, 100%);
  padding: 40px 22px 22px;
  border-radius: 10px;
  color: var(--ink);
  text-align: center;
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 55%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 16px 40px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
  animation: snip-in 0.45s var(--ease-out) both;
}

.snip__cut {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 18px;
  height: 0;
  border-top: 2px dashed rgba(42, 33, 25, 0.38);
}

.snip__scissors {
  position: absolute;
  top: -0.8em;
  left: 0;
  width: 1.6em;
  height: 1.6em;
  font-size: 15px;
  color: var(--ink-soft);
  background: var(--papyrus-hi);
  border-radius: 50%;
  animation: snip-run 0.9s 0.2s ease-in-out both;
}

.snip__stamp {
  display: inline-block;
  margin: 8px 0 14px;
  padding: 0.12em 0.55em 0.18em;
  border: 0.12em solid #a3392b;
  border-radius: 0.22em;
  color: #a3392b;
  font: 800 calc(var(--fs-stamp) * var(--text-scale)) / 1.1 var(--sans);
  letter-spacing: 0.04em;
  box-shadow: inset 0 0 0 0.05em rgba(163, 57, 43, 0.3);
  transform: rotate(-7deg);
  animation: stamp-in 0.5s 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
}

.snip__stamp .en {
  margin-top: 0.05em;
  font-size: 0.48em;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.snip__title {
  margin: 0 0 14px;
  font: 700 calc(var(--fs-snip-title) * var(--text-scale)) / 1.3 var(--serif);
  word-break: keep-all;
}

.snip__title .en {
  margin-top: 0.2em;
  font-weight: 400;
  font-size: 0.62em;
  color: var(--ink-soft);
}

.snip__text {
  margin: 0 0 20px;
  font: 400 calc(var(--fs-prompt) * var(--text-scale)) / 1.5 var(--serif);
  color: var(--ink-soft);
  word-break: keep-all;
}

.snip__text .en {
  font-size: 0.88em;
}

.snip__actions {
  display: grid;
  gap: 10px;
}

.snip .btn--primary {
  background: var(--basalt-2);
  color: var(--limestone);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
}

.snip .btn--primary:hover {
  background: var(--basalt-3);
}

.snip .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.38);
  background: transparent;
}

@keyframes snip-in {
  from {
    opacity: 0;
    transform: translateY(14px) rotate(-1deg);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes snip-run {
  from {
    left: 0;
    transform: rotate(0deg);
  }
  to {
    left: calc(100% - 1.6em);
    transform: rotate(0deg);
  }
}

@keyframes stamp-in {
  from {
    opacity: 0;
    transform: rotate(-16deg) scale(1.7);
  }
  to {
    opacity: 1;
    transform: rotate(-7deg) scale(1);
  }
}

/* The default button of a page of buttons (Try again, Next character) shows its ring even when the
   focus was set by script; so does an option focused by a key (main.js sets data-kbd). */
[data-default="true"]:focus,
.opt[data-kbd="true"]:focus {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ page screens */

.screen {
  position: absolute;
  inset: 0;
  z-index: 35;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.screen:empty {
  display: none;
}

.page {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 28px) var(--gutter-r) calc(var(--safe-bottom) + 28px) var(--gutter-l);
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 0.6em 1.1em;
  border-radius: 10px;
  font: 600 var(--fs-ui) / 1.3 var(--sans);
  text-align: center;
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.btn:active {
  transform: translateY(1px);
}

.btn .en {
  font-weight: 500;
  font-size: var(--fs-ui-en);
  opacity: 0.85;
}

.btn--primary {
  background: var(--limestone);
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
}

.btn--primary:hover {
  background: #f4eedd;
}

.btn--ghost {
  border: 1px solid rgba(235, 227, 207, 0.45);
  color: var(--limestone);
  background: rgba(20, 18, 16, 0.4);
}

.btn--ghost:hover {
  background: rgba(20, 18, 16, 0.6);
}

.btn--text {
  min-height: 44px;
  color: var(--limestone);
  text-decoration: underline;
  text-decoration-color: rgba(235, 227, 207, 0.4);
  text-underline-offset: 4px;
}

.btn__sub {
  display: block;
  margin-top: 2px;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  opacity: 0.75;
}

/* Title */

.title-page {
  justify-content: flex-end;
  gap: 22px;
  background: linear-gradient(180deg, rgba(16, 15, 13, 0) 0%, rgba(16, 15, 13, 0.25) 30%, rgba(16, 15, 13, 0.82) 62%, rgba(16, 15, 13, 0.94) 100%);
}

.title-head {
  margin-top: auto;
  padding-top: 16vh;
}

.title-side {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.title-sub {
  margin: 0 0 14px;
  font: 500 13px/1.5 var(--sans);
  color: var(--limestone);
  opacity: 0.92;
}

.title-sub .en {
  color: var(--limestone-dim);
  font-size: 12px;
}

.title-main {
  margin: 0;
  font: 700 clamp(46px, 14vw, 64px) / 1.06 var(--serif);
  letter-spacing: -0.015em;
  color: var(--light-core);
  text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
  word-break: keep-all;
}

.title-main__line {
  display: block;
}

.title-main__line + .title-main__line {
  padding-left: 0.9em;
}

.title-en {
  margin: 0.45em 0 0;
  font: italic 400 clamp(20px, 6vw, 26px) / 1.2 var(--serif);
  color: var(--limestone);
  letter-spacing: 0.01em;
}

.title-disclaimer {
  margin: 0;
  font: 400 13px/1.6 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.title-disclaimer .en {
  margin-top: 2px;
  font-size: 12px;
}

.langpick__label {
  margin: 0 0 8px;
  font: 500 13px/1.4 var(--sans);
  color: var(--limestone-dim);
}

.langpick__row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.langbtn {
  min-height: 52px;
  padding: 6px 8px;
  border-radius: 10px;
  border: 1px solid rgba(235, 227, 207, 0.3);
  background: rgba(20, 18, 16, 0.5);
  color: var(--limestone);
  font: 600 15px/1.25 var(--sans);
}

.langbtn .en {
  font-weight: 500;
  font-size: 11.5px;
  color: var(--limestone-dim);
}

.langbtn[aria-pressed="true"] {
  background: var(--limestone);
  color: var(--ink);
  border-color: var(--limestone);
}

.langbtn[aria-pressed="true"] .en {
  color: var(--ink-soft);
}

.title-actions {
  display: grid;
  gap: 10px;
}

.title-foot {
  display: grid;
  gap: 10px;
  justify-items: start;
}

.fineprint {
  margin: 0;
  font: 400 11px/1.55 var(--sans);
  color: #978f7e;
  word-break: keep-all;
}

.notice {
  margin: 0;
  padding: 0.6em 0.8em;
  border-radius: 8px;
  background: rgba(201, 138, 31, 0.18);
  border: 1px solid rgba(201, 138, 31, 0.45);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.5 var(--sans);
}

/* Route select */

.routes-page {
  gap: 14px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: linear-gradient(180deg, rgba(16, 15, 13, 0.35), rgba(16, 15, 13, 0.75) 40%, rgba(16, 15, 13, 0.9));
}

.routes-prompt {
  margin: 4px 0 2px;
  font: 700 calc(23px * var(--text-scale)) / 1.4 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
}

.routes-prompt .en {
  font-weight: 400;
  font-size: 0.68em;
  color: var(--limestone);
}

.routes-head {
  display: grid;
  gap: 4px;
}

/* The suggested order (BHS.common.routeSelect.hint): a small line under the prompt. */
.routes-hint {
  margin: 0;
  font: 500 calc(13px * var(--text-scale)) / 1.45 var(--sans);
  color: var(--amber-soft);
  word-break: keep-all;
}

.routes-hint .en {
  font-weight: 400;
  color: var(--limestone-dim);
}

/* Visually hidden, still read by screen readers. */
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.routes-list {
  display: grid;
  gap: 14px;
}

.routecard {
  position: relative;
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 26px 18px 18px;
  border-radius: 8px;
  text-align: left;
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 55%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(0, 0, 0, 0.45);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.routecard:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 14px 30px rgba(0, 0, 0, 0.5);
}

.routecard:active {
  transform: translateY(1px);
}

.routecard .plate {
  transform: translateY(-50%);
}

.routecard__title {
  display: block;
  font: 700 calc(19px * var(--text-scale)) / 1.4 var(--serif);
  word-break: keep-all;
}

.routecard__title .en {
  font-weight: 400;
  font-size: 0.82em;
  color: var(--ink-soft);
}

.routecard__tag {
  display: block;
  margin-top: 6px;
  font: 500 13.5px/1.45 var(--sans);
  color: var(--ink-soft);
}

.routecard__tag .en {
  font-weight: 400;
  font-size: 0.92em;
}

.routecard__first {
  display: block;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  font: italic 400 calc(15px * var(--text-scale)) / 1.6 var(--serif);
  color: #382c20;
  word-break: keep-all;
}

.routecard__first .en {
  font-size: 0.9em;
  color: var(--ink-soft);
}

.routecard--missing {
  opacity: 0.55;
}

/* The protagonist on the card: a band between the tagline and the divider above the first line,
   as wide as the text and the divider. A bust stands on the divider toward the right, its lower part
   cropped by the divider (the top 60% shows: head, shoulders and what he carries); a soft wash in the
   character's color sits behind it. Asher lies across the band and rests on the divider. The band
   never overlaps the text. ui.js sets --band-min (the smallest bust band) so the busts match in size. */
.routecard__art {
  position: relative;
  display: block;
  height: 96px;
  margin: 8px 0 0;
  overflow: hidden;
  pointer-events: none;
  /* Figures size against the band itself (cqw/cqh), so a tall band never makes them wider than it. */
  container-type: size;
}

.routecard__art + .routecard__first {
  margin-top: 0;
}

.routecard__wash {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 32% 95% at 72% 100%, var(--wash, transparent), transparent 75%);
  opacity: 0.8;
  transition: opacity 0.3s ease;
}

.routecard__fig {
  position: absolute;
  right: 9%;
  bottom: 0;
  height: 166.7%;
  aspect-ratio: 2 / 3;
  transform: translateY(40%);
  transition: transform 0.3s var(--ease-out);
}

@supports (height: 1cqh) {
  .routecard__fig {
    height: min(calc(var(--band-min, 100cqh) * 1.667), 90cqw);
  }
}

.routecard__svg {
  position: absolute;
  inset: 0;
}

/* "✓ Played": a small stamp in the free top-left corner of the portrait band. */
.routecard__played {
  position: absolute;
  z-index: 1;
  left: 0;
  top: 6px;
  padding: 2px 9px 3px;
  border-radius: 999px;
  border: 1px solid rgba(38, 29, 21, 0.28);
  background: rgba(251, 247, 236, 0.7);
  font: 600 12px/1.35 var(--sans);
  color: var(--ink-soft);
  white-space: nowrap;
}

/* "Both" mode: the Korean over the English, a rounded label instead of a pill. */
.routecard__played--two {
  border-radius: 0.6em;
}

/* Without a portrait band the stamp follows the tagline. */
.routecard__played--flow {
  position: static;
  display: inline-block;
  margin-top: 8px;
}

.routecard__svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* Asher lies across the band, seen from above: his lying bust turned a quarter to the right inside a
   wide box, head on the pillow toward the right, the body along the divider, the blanket resting on it.
   The drawing fills the box from about 11% below its top to its bottom edge, and the pillow ends about
   13% short of the box's right edge, so a box of 110% of the band fits it whole. The bust's straight
   bottom cut (now at the left end) fades out. */
.routecard__art--lying .routecard__wash {
  background: radial-gradient(ellipse 40% 95% at 62% 100%, var(--wash, transparent), transparent 75%);
}

.routecard__art--lying .routecard__fig {
  right: 8%;
  height: 110%;
  aspect-ratio: 3 / 2;
  transform: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 6%, #000 34%);
  mask-image: linear-gradient(90deg, transparent 6%, #000 34%);
}

@supports (height: 1cqh) {
  .routecard__art--lying .routecard__fig {
    height: min(110cqh, 44cqw);
  }
}

.routecard__art--lying .routecard__svg {
  inset: auto;
  left: 50%;
  top: 50%;
  width: 66.667%;
  height: 150%;
  transform: translate(-50%, -50%) rotate(100deg);
}

.routecard:hover .routecard__wash,
.routecard:focus-visible .routecard__wash,
.routecard[data-next="true"]:focus .routecard__wash {
  opacity: 1;
}

.routecard:hover .routecard__fig,
.routecard:focus-visible .routecard__fig,
.routecard[data-next="true"]:focus .routecard__fig {
  transform: translateY(calc(40% - 6px));
}

.routecard:hover .routecard__art--lying .routecard__fig,
.routecard:focus-visible .routecard__art--lying .routecard__fig,
.routecard[data-next="true"]:focus .routecard__art--lying .routecard__fig {
  transform: translateY(-6px);
}

/* The next character to play (focused on arrival, SPEC 5.8) shows the focus ring at once. */
.routecard[data-next="true"]:focus {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: 2px;
}

/* No lift without motion: reduced motion and the ?test=1 mode keep the figure still. */
@media (prefers-reduced-motion: reduce) {
  .routecard:hover .routecard__fig,
  .routecard:focus-visible .routecard__fig,
  .routecard[data-next="true"]:focus .routecard__fig {
    transform: translateY(40%);
  }
  .routecard:hover .routecard__art--lying .routecard__fig,
  .routecard:focus-visible .routecard__art--lying .routecard__fig,
  .routecard[data-next="true"]:focus .routecard__art--lying .routecard__fig {
    transform: none;
  }
}

html.is-test .routecard:hover .routecard__fig,
html.is-test .routecard:focus-visible .routecard__fig,
html.is-test .routecard[data-next="true"]:focus .routecard__fig {
  transform: translateY(40%);
}

html.is-test .routecard:hover .routecard__art--lying .routecard__fig,
html.is-test .routecard:focus-visible .routecard__art--lying .routecard__fig,
html.is-test .routecard[data-next="true"]:focus .routecard__art--lying .routecard__fig {
  transform: none;
}

/* Story trees (SPEC 5.8): one route's tree after its true ending, the three trees from the title.
   A cut-paper tree on a paper card, bottom to top: the root with the character's name, a knot at every
   choice point where the cut branches grow sideways (seen: scissors and a paper tag with the branch
   title; not seen: a faint, unlabeled stub), and the star of the true ending at the top. The trunk
   tapers level by level (each level's segment is a trapezoid); before the true ending was seen the
   trunk and the star stay faint. No numbers anywhere. */

.treepage,
.treespage {
  gap: 16px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: linear-gradient(180deg, rgba(16, 15, 13, 0.55), rgba(16, 15, 13, 0.86) 40%, rgba(16, 15, 13, 0.93));
}

.treepage-head,
.treespage-head {
  display: grid;
  gap: 6px;
}

.treepage-title {
  margin: 0;
  font: 700 calc(26px * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
}

.treepage-title .en {
  display: inline;
  margin-left: 0.5em;
  font-weight: 400;
  font-size: 0.62em;
  color: var(--limestone-dim);
}

.treepage-route {
  margin: 0;
  font: 700 calc(17px * var(--text-scale)) / 1.4 var(--serif);
  color: var(--amber-soft);
  word-break: keep-all;
}

.treepage-route .en {
  font-weight: 400;
  font-size: 0.85em;
  color: var(--limestone-dim);
}

.treepage-hint {
  margin: 0;
  font: 400 13px/1.55 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.treepage-actions,
.treespage-actions {
  display: grid;
  gap: 10px;
}

.treespage-list {
  display: grid;
  gap: 16px;
}

.tree {
  --bark: #6a4a2c;
  --bark-hi: #8f6b44;
  --bark-lo: #4f361f;
  --snip: #a3392b;
  --trunk-w: 28px;
  --stem-w: 26px;
  --stem-h: 12px;
  --level-h: 62px;
  --tag-fs: 15px;
  --tag-fs-en: 12.5px;
  /* layoutTree (js/ui.js): 1 = the tree may grow taller for its labels (the page scrolls); 0 = it must
     fit, and the labels shrink by --tag-fit, never below --tag-min. */
  --tree-grow: 1;
  --tag-min: 0px;
  --tag-fit: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 16px 10px 12px;
  border-radius: 10px;
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 55%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(0, 0, 0, 0.45);
}

/* The goal at the top: the true ending's title (once seen) above its star. */
.tree__goal {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.tree__goaltitle {
  margin: 0 0 calc(var(--trunk-w) * 0.75);
  font: 700 calc(var(--tag-fs) * 1.1 * var(--text-scale)) / 1.3 var(--serif);
  word-break: keep-all;
}

.tree__goaltitle .en {
  font-weight: 400;
  font-size: 0.82em;
  color: var(--ink-soft);
}

.tree__star {
  display: block;
  width: calc(var(--trunk-w) * 1.75);
  height: calc(var(--trunk-w) * 1.75);
}

.tree__staricon {
  display: block;
  width: 100%;
  height: 100%;
  fill: #f2c55c;
  stroke: #a46d16;
  filter: drop-shadow(0 0 6px rgba(255, 214, 120, 0.95));
}

.tree[data-done="false"] .tree__staricon {
  fill: transparent;
  stroke: rgba(84, 70, 58, 0.38);
  stroke-dasharray: 2 2.2;
  filter: none;
}

/* Bark: one look for the tip, every level and the root flare (a trapezoid per piece). The pieces
   overlap by a pixel so no seam shows between levels; the roundness comes from the gradient. */
.branch__wood {
  filter: drop-shadow(1px 1px 0 rgba(60, 40, 20, 0.3));
}

.tree__bark {
  position: absolute;
  inset: -1px 0 0;
  background: linear-gradient(90deg, var(--bark-lo) 0%, var(--bark-hi) 34%, var(--bark) 68%, var(--bark-lo) 100%);
}

.tree__tip {
  position: relative;
  display: block;
  width: calc(var(--trunk-w) * 0.4);
  height: 16px;
}

.tree__tip .tree__bark {
  clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
}

/* The crown: a few paper leaves behind the star once the true ending was seen. */
.tree__star {
  position: relative;
  z-index: 1;
}

.tree__crown {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: -1;
  width: 330%;
  height: 230%;
  transform: translate(-50%, -40%);
}

.tree[data-done="false"] .tree__crown {
  display: none;
}

.tree__levels {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column-reverse;
  flex: 1 1 auto;
}

.tree__level {
  --w-bottom: calc(var(--trunk-w) * (1 - 0.6 * var(--tb)));
  --w-top: calc(var(--trunk-w) * (1 - 0.6 * var(--tt)));
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--w-bottom) minmax(0, 1fr);
  align-items: center;
  flex: 1 0 auto;
  min-height: var(--level-h);
}

.tree__trunk {
  position: relative;
  align-self: stretch;
}

.tree__trunk .tree__bark {
  clip-path: polygon(calc(50% - var(--w-top) / 2) 0, calc(50% + var(--w-top) / 2) 0, 100% 100%, 0 100%);
}

/* A choice point: a knot in the bark (layoutTree may move it off the middle of its row). */
.tree__knot {
  position: absolute;
  left: 50%;
  top: calc(var(--knot, 0.5) * 100%);
  width: calc(var(--w-bottom) * 0.5);
  height: calc(var(--w-bottom) * 0.16);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(60, 40, 22, 0.55);
  box-shadow: 0 1px 0 rgba(255, 236, 200, 0.22);
}

.tree__root {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.tree__base {
  position: relative;
  display: block;
  width: calc(var(--trunk-w) * 2.4);
  height: 16px;
}

/* The trunk flares into roots where it meets the ground. */
.tree__base .tree__bark {
  clip-path: polygon(calc(50% - var(--trunk-w) / 2) 0, calc(50% + var(--trunk-w) / 2) 0, 66% 55%, 100% 100%, 0 100%, 34% 55%);
}

.tree__ground {
  display: block;
  width: 80%;
  height: 12px;
  margin-top: -1px;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(180deg, #8a7e44, #5f6d33 70%);
  box-shadow: inset 0 2px 0 rgba(255, 250, 220, 0.18);
}

.tree .tree__plate {
  position: static;
  display: inline-block;
  max-width: 100%;
  margin-top: 10px;
  transform: none;
  white-space: normal;
  text-align: center;
}

.tree[data-done="false"] .tree__bark,
.tree[data-done="false"] .tree__knot {
  opacity: 0.3;
}

.tree[data-done="false"] .tree__ground {
  opacity: 0.45;
}

.tree__side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}

.tree__side--l {
  align-items: flex-end;
}

.tree__side--r {
  align-items: flex-start;
}

.branch {
  display: flex;
  align-items: center;
  max-width: 100%;
}

.branch--l {
  flex-direction: row-reverse;
}

.branch__wood {
  flex: none;
  display: block;
  width: var(--stem-w);
  height: var(--stem-h);
  margin: 0 -1px;
}

/* A bough growing up and out from the trunk, thick at the trunk, cut square at its end. */
.branch__stem {
  display: block;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, var(--bark-hi), var(--bark) 55%, var(--bark-lo));
  clip-path: polygon(0 0, 100% 30%, 100% 70%, 0 100%);
  transform: rotate(-14deg);
  transform-origin: 0 50%;
}

.branch--l .branch__stem {
  clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%);
  transform: rotate(14deg);
  transform-origin: 100% 50%;
}

/* The scissors and the tag sit at the lifted end of the bough. */
.branch__snip,
.branch__tag {
  position: relative;
  top: calc(var(--stem-w) * -0.24);
}

.branch__snip {
  flex: none;
  width: calc(var(--stem-h) * 1.8);
  height: calc(var(--stem-h) * 1.8);
  margin: 0 2px;
  color: var(--snip);
}

.branch--l .branch__snip {
  transform: scaleX(-1);
}

.branch__tag {
  min-width: 0;
  padding: 0.26em 0.5em 0.3em;
  text-wrap: balance;
  border-radius: 4px;
  border: 1px solid rgba(42, 33, 25, 0.18);
  background: var(--vellum);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 5px rgba(42, 33, 25, 0.24);
  font: 700 max(var(--tag-min), calc(var(--tag-fs) * var(--text-scale) * var(--tag-fit))) / 1.3 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
  transform: rotate(-1.5deg);
}

.branch--l .branch__tag {
  text-align: right;
  transform: rotate(1.5deg);
}

.branch__tag .en {
  margin-top: 1px;
  font-weight: 400;
  font-size: max(var(--tag-min), calc(var(--tag-fs-en) * var(--text-scale) * var(--tag-fit)));
  color: var(--ink-soft);
}

/* Not seen yet: a faint, short, blunt stub with no tag. */
.branch[data-state="unseen"] .branch__wood {
  width: calc(var(--stem-w) * 0.5);
  opacity: 0.6;
  filter: none;
}

.branch[data-state="unseen"] .branch__stem {
  clip-path: polygon(0 0, 100% 14%, 100% 86%, 0 100%);
}

.branch--l[data-state="unseen"] .branch__stem {
  clip-path: polygon(0 14%, 100% 0, 100% 100%, 0 86%);
}

/* Placed layout (layoutTree in js/ui.js): the branches leave their rows; each bough, its scissors and
   its label are positioned on the card from measured sizes (inline left, top, width and rotation). The
   bough's element starts at its knot and is rotated toward its label; a left bough is flipped as well,
   so its light edge stays on top. */
.tree--placed .branch {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
}

/* The boughs grow from behind the trunk, so their bases never show. */
.tree--placed .tree__trunk {
  z-index: 1;
}

/* Every bough measures the full stem before layoutTree sets its length (an unseen stub included). */
.tree--placed .branch[data-state] .branch__wood {
  position: absolute;
  width: var(--stem-w);
  margin: 0;
  transform-origin: 0 50%;
}

.tree--placed .branch__stem,
.tree--placed .branch--l .branch__stem {
  transform: none;
  clip-path: polygon(0 0, 100% 30%, 100% 70%, 0 100%);
}

.tree--placed .branch[data-state="unseen"] .branch__stem {
  clip-path: polygon(0 0, 100% 14%, 100% 86%, 0 100%);
}

.tree--placed .branch__snip {
  position: absolute;
  margin: 0;
  transform-origin: 50% 50%;
}

.tree--placed .branch__tag {
  position: absolute;
  top: 0;
  width: max-content;
  max-width: var(--tag-max, 12em);
}

/* ------------------------------------------------------------------ settings + modal */

.settings {
  position: absolute;
  z-index: 60;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  right: var(--gutter-r);
  width: min(380px, calc(100% - var(--gutter-l) - var(--gutter-r)));
  padding: 16px;
  border-radius: 10px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  animation: pop-in 0.25s var(--ease-out) both;
  color-scheme: light;
  font-size: 13.5px;
}

.settings__title {
  margin: 0 0 0.9em;
  font: 700 1.1em/1.3 var(--sans);
}

.settings__group + .settings__group {
  margin-top: 1em;
}

.settings__label {
  display: block;
  margin-bottom: 0.45em;
  font: 500 0.93em/1.3 var(--sans);
  color: var(--ink-soft);
}

.choicerow {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
}

.chip {
  min-height: 44px;
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.25);
  background: rgba(255, 252, 244, 0.6);
  color: var(--ink);
  font: 600 1em/1.2 var(--sans);
}

.chip[aria-pressed="true"] {
  background: var(--basalt-2);
  border-color: var(--basalt-2);
  color: var(--limestone);
}

.chip:disabled {
  opacity: 0.4;
  cursor: default;
}

.settings .chip {
  white-space: nowrap;
}

@media (max-width: 700px) {
  .settings .chip {
    font-size: 13px;
    padding-inline: 4px;
  }
}

.settings__close {
  margin-top: 1em;
  width: 100%;
}

.settings .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
  font-size: 1em;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: rgba(10, 9, 8, 0.66);
  animation: fade-in 0.2s ease both;
}

.dialog {
  width: min(360px, 100%);
  padding: 22px 20px 18px;
  border-radius: 12px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  color-scheme: light;
  font-size: 14px;
}

.dialog__title {
  margin: 0 0 0.45em;
  font: 700 1.3em/1.4 var(--serif);
  word-break: keep-all;
}

.dialog__title .en,
.dialog__body .en {
  font-weight: 400;
  font-size: 0.86em;
  color: var(--ink-soft);
}

.dialog__body {
  margin: 0 0 1.1em;
  font: 400 1em/1.6 var(--sans);
  color: var(--ink-soft);
  word-break: keep-all;
}

.dialog__actions {
  display: grid;
  gap: 8px;
}

.dialog .btn {
  font-size: 1.1em;
}

.dialog .btn--primary {
  background: var(--basalt-2);
  color: var(--limestone);
  box-shadow: none;
}

.dialog .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
}

/* ------------------------------------------------------------------ debug (developer only) */

.debug {
  position: absolute;
  z-index: 80;
  left: 6px;
  bottom: calc(var(--safe-bottom) + 6px);
  max-width: min(calc(100% - 12px), 720px);
  max-height: 55%;
  overflow: auto;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.84);
  color: #d8f0d0;
  font: 11px/1.45 var(--mono);
}

.debug.is-min {
  max-height: none;
  padding: 0;
  background: none;
}

.debug button,
.debug select {
  font: 11px var(--mono);
  min-height: 30px;
  padding: 2px 8px;
  margin: 2px 2px 2px 0;
  border-radius: 4px;
  border: 1px solid #4b6b45;
  background: #142212;
  color: #d8f0d0;
}

.debug pre {
  margin: 4px 0;
  white-space: pre-wrap;
  word-break: break-all;
}

.noscript {
  position: absolute;
  inset: auto 16px 40% 16px;
  text-align: center;
  color: var(--limestone);
}

/* ------------------------------------------------------------------ tablets in portrait */

@media (min-width: 700px) and (orientation: portrait) {
  .app {
    max-width: 760px;
  }
  :root {
    --fs-story: 21px;
    --fs-story-en: 18.5px;
    --fs-verse: 22px;
    --fs-verse-en: 19px;
    --fs-name: 16px;
    --fs-prompt: 19px;
    --fs-prompt-en: 16.5px;
    --fs-option: 19px;
    --fs-option-en: 16.5px;
    --fs-small: 15px;
    --fs-small-en: 14px;
    --fs-pin: 17px;
    --fs-echo: 21px;
    --fs-last: 30px;
    --fs-card-title: 38px;
    --panel-pad: 26px 28px 30px;
    --fs-memory: 27px;
    --fs-memory-en: 21px;
  }
}

@media (min-width: 600px) {
  .app {
    box-shadow: 0 0 0 1px rgba(235, 227, 207, 0.06), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
}

/* ------------------------------------------------------------------ TV and laptop landscape (16:9 first)
   Sized in vh so 720p, 1080p and 4K read the same from 3-5 m away. Reference values at 1080p:
   story 40px, names 32px, options 35px, smallest text 24px. */

@media (min-aspect-ratio: 5/4) and (min-width: 960px) and (min-height: 540px) {
  :root {
    --fs-story: 3.7vh;
    --fs-story-en: 3.2vh;
    --fs-verse: 3.9vh;
    --fs-verse-en: 3.3vh;
    --fs-name: 3vh;
    --fs-prompt: 3.4vh;
    --fs-prompt-en: 3vh;
    --fs-option: 3.2vh;
    --fs-option-en: 3vh;
    --fs-small: 2.4vh;
    --fs-small-en: 2.25vh;
    --fs-ui: 3vh;
    --fs-ui-en: 2.3vh;
    --fs-reply: 3vh;
    --fs-pin: 2.9vh;
    --fs-echo: 3.6vh;
    --fs-last: 5.6vh;
    --fs-card-title: 7.4vh;
    --fs-action: 3vh;
    --fs-press: 3.6vh;
    --fs-hdr: 2.3vh;

    --lh-story: 1.5;
    --panel-w: min(130vh, 92vw);
    --panel-min-h: 25vh;
    --panel-pad: 3.8vh 4.6vh 4vh;
    --panel-radius: 1vh;
    --dock-gap: 1.6vh;
    --fs-memory: 5.4vh;
    --fs-memory-en: 3.9vh;
    --fs-snip-title: 6.4vh;
    --fs-stamp: 6.6vh;
    --hdr-btn: max(44px, 5.6vh);
    --header-h: 8vh;
    --focus-w: 0.55vh;
    --gutter-l: max(3vw, env(safe-area-inset-left, 0px));
    --gutter-r: max(3vw, env(safe-area-inset-right, 0px));
  }

  .app {
    max-width: none;
    box-shadow: none;
  }

  /* Busts stand over the outer ends of the centred panel (left and right thirds),
     leaving the middle of the stage to the light. */
  .cast {
    --cast-h: 58vh;
    --cast-x: max(1vw, calc((100vw - var(--panel-w)) / 2 - 1vw));
    --cast-sink: 6vh;
  }

  /* A focus ring that reads from across the room: light ring with a dark halo. Two rules, so a browser
     without :focus-visible still keeps the second one. */
  :focus-visible {
    outline: var(--focus-w) solid var(--focus-light);
    outline-offset: 0.35vh;
    box-shadow: 0 0 0 1.1vh rgba(16, 15, 13, 0.75);
  }

  .routecard[data-next="true"]:focus {
    outline: var(--focus-w) solid var(--focus-light);
    outline-offset: 0.35vh;
    box-shadow: 0 0 0 1.1vh rgba(16, 15, 13, 0.75);
  }

  .topbar {
    gap: 1vh;
    padding: calc(var(--safe-top) + 2vh) var(--gutter-r) 1vh var(--gutter-l);
    opacity: 0.6;
  }

  .topbar:hover,
  .topbar:focus-within {
    opacity: 1;
  }

  body.is-idle .topbar {
    opacity: 0.18;
  }

  .caption {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.6vh);
    border-radius: 0.8vh;
  }

  .echo {
    top: calc(var(--safe-top) + 22vh);
    left: 50%;
    right: auto;
    width: min(76vw, 130vh);
    transform: translateX(-50%);
    border-radius: 1vh;
  }

  .pin {
    top: calc(var(--safe-top) + 12vh);
    right: var(--gutter-r);
    width: min(36vw, 64vh);
  }

  /* The scribe's punchline stamp, legible from the back of the room. */
  .receipt {
    font-size: 3vh;
    padding: 0.25em 0.8em 0.3em;
  }

  .dock {
    padding-bottom: calc(var(--safe-bottom) + 4vh);
  }

  .plate {
    left: 1.2em;
  }

  .more {
    right: 1.2em;
  }

  .text .en {
    margin-top: 0.45em;
  }

  .play--sign .panel {
    max-width: min(110vh, 80vw);
    padding: 2.4vh 4vh;
    border-radius: 1.2vh;
  }

  .play--last .panel {
    max-width: min(150vh, 86vw);
    align-self: center;
  }

  /* Choices: a compact 2x2 grid of large buttons (no number badges) that leaves the top of the scene
     visible (about half the screen at 1080p for typical options); long options that would
     overflow stack in full-width rows. */
  .choices {
    width: min(168vh, 95vw);
    max-height: 66vh;
    align-self: center;
    padding: 1.8vh 2.4vh 2vh;
    border-radius: 1vh;
  }

  .choices__prompt {
    margin: 0 0.3vh 1.1vh;
    line-height: 1.3;
  }

  .choices__prompt .en {
    display: block;
    margin-top: 0.2em;
  }

  .choices__prompt .en::before {
    content: none;
  }

  .choices__list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.1vh;
  }

  .choices.is-stacked .choices__list {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.2vh;
  }

  .choices.is-stacked .opt {
    min-height: 0;
    padding-top: 1.5vh;
    padding-bottom: 1.6vh;
  }

  .opt {
    min-height: 0;
    padding: 1.4vh 2.4vh 1.5vh;
    border-radius: 1vh;
    line-height: 1.32;
  }

  .opt__snip {
    top: 0.9vh;
    right: 1vh;
    width: 2.4vh;
    height: 2.4vh;
  }

  .opt[data-snipped="true"] {
    padding-right: 4.4vh;
  }

  /* Three options in the 2 x 2 grid: the last one sits centered under the first two. A single option
     left after a scold sits centered too. */
  .choices:not(.is-stacked) .choices__list[data-n="1"] > .opt:only-child,
  .choices:not(.is-stacked) .choices__list[data-n="3"] > .opt:nth-child(3):last-child {
    grid-column: 1 / -1;
    justify-self: center;
    width: calc(50% - 0.55vh);
  }

  .opt .en {
    margin-top: 0.1em;
  }

  .pressbox {
    gap: 1.6vh;
  }

  .glow {
    min-height: 9vh;
    padding: 1.6vh 6vh;
  }

  /* Asher's gray actions hang from the panel's bottom-left edge, out of the flow, so the
     panel keeps its usual place. During the lit press they return as a large centred row. */
  .actions {
    position: absolute;
    left: calc(var(--gutter-l) + 2.6vh);
    bottom: calc(var(--safe-bottom) + 4vh - max(22px, 3vh));
    z-index: 2;
    gap: 1.2vh;
  }

  .act {
    flex: 0 0 auto;
    min-width: 17vh;
    min-height: max(44px, 6vh);
    padding: 0.5vh 2vh;
    border-radius: 0.9vh;
    font-size: 2.6vh;
    background: rgba(46, 43, 39, 0.94);
    box-shadow: 0 0.6vh 1.6vh rgba(0, 0, 0, 0.35);
  }

  .act .en {
    display: inline;
    margin-left: 0.5em;
    font-size: 0.86em;
  }

  .play--press .actions {
    position: static;
    width: var(--panel-w);
    align-self: center;
    gap: 1.6vh;
  }

  .play--press .act {
    flex: 1 1 0;
    min-height: 9vh;
    font-size: 3vh;
  }

  .play--press .act .en {
    display: block;
    margin-left: 0;
  }

  .play--press .act.glow {
    font-size: var(--fs-press);
  }

  .reply {
    align-self: center;
    max-width: min(110vh, 80vw);
    padding: 1vh 2vh;
    border-radius: 1vh;
  }

  .card {
    inset: 10vh 6vw 8vh;
  }

  /* Page screens fill 16:9 instead of stacking like a phone. */
  .page {
    padding: calc(var(--safe-top) + 6vh) 6vw calc(var(--safe-bottom) + 5vh);
  }

  .btn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
  }

  .btn__sub {
    font-size: var(--fs-small-en);
  }

  .btn--text {
    min-height: max(44px, 6vh);
  }

  .title-page {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: 6vw;
    align-items: end;
    background: linear-gradient(90deg, rgba(16, 15, 13, 0.82) 0%, rgba(16, 15, 13, 0.45) 45%, rgba(16, 15, 13, 0.82) 100%), linear-gradient(180deg, rgba(16, 15, 13, 0) 40%, rgba(16, 15, 13, 0.6) 100%);
  }

  .title-head {
    margin: 0;
    padding: 0 0 4vh;
    align-self: center;
  }

  .title-side {
    gap: 3vh;
    align-self: center;
  }

  .title-sub {
    margin-bottom: 3vh;
    font-size: 2.8vh;
  }

  .title-sub .en {
    font-size: 2.4vh;
  }

  .title-main {
    font-size: 13.5vh;
  }

  .title-en {
    font-size: 5vh;
  }

  .title-disclaimer {
    font-size: 2.4vh;
  }

  .title-disclaimer .en {
    font-size: 2.25vh;
  }

  .langpick__label {
    font-size: 2.4vh;
    margin-bottom: 1.2vh;
  }

  .langpick__row {
    gap: 1.2vh;
  }

  .langbtn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
    font-size: 2.9vh;
  }

  .langbtn .en {
    font-size: 2.25vh;
  }

  .title-actions {
    gap: 1.4vh;
  }

  .title-foot {
    gap: 1.2vh;
  }

  .fineprint {
    font-size: 2.2vh;
    line-height: 1.45;
  }

  .notice {
    border-radius: 1vh;
  }

  .routes-page {
    gap: 3vh;
    padding-top: calc(var(--safe-top) + 9.6vh);
    padding-bottom: calc(var(--safe-bottom) + 3.1vh);
    background: linear-gradient(180deg, rgba(16, 15, 13, 0.55), rgba(16, 15, 13, 0.82) 45%, rgba(16, 15, 13, 0.92));
  }

  .routes-prompt {
    margin: 0;
    font-size: calc(4.8vh * var(--text-scale));
  }

  .routes-head {
    gap: 0.8vh;
  }

  .routes-hint {
    font-size: calc(2.4vh * var(--text-scale));
  }

  .routes-hint .en {
    display: inline;
  }

  .routes-hint .en::before {
    content: "  \00B7  ";
    color: var(--limestone-dim);
  }

  .routecard__played {
    top: 0.8vh;
    padding: 0.3vh 1.2vh 0.4vh;
    font-size: 2.2vh;
  }

  .routecard__played--flow {
    margin-top: 1.2vh;
  }

  .routes-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2.4vw;
    flex: 1;
    align-items: stretch;
  }

  .routecard {
    margin-top: 2vh;
    padding: 6vh 2.4vw 3.4vh;
    border-radius: 1.2vh;
    display: flex;
    flex-direction: column;
  }

  .routecard .plate {
    left: 2.4vw;
    max-width: calc(100% - 4.8vw);
    white-space: normal;
    line-height: 1.2;
  }

  .routecard .plate__en--stack {
    display: block;
    font-size: 0.82em;
  }

  .routecard .plate__en--stack::before {
    content: none;
  }

  .routecard__title {
    font-size: calc(3.6vh * var(--text-scale));
  }

  .routecard__tag {
    margin-top: 1.4vh;
    font-size: 2.6vh;
  }

  .routecard__first {
    margin-top: auto;
    padding-top: 2.2vh;
    font-size: calc(2.75vh * var(--text-scale));
    line-height: 1.5;
  }

  /* The portrait band takes the free height between the tagline and the first line. */
  .routecard__art {
    flex: 1 1 0;
    height: auto;
    min-height: 9vh;
    margin: 1.4vh 0 0;
  }

  .routecard__fig {
    height: min(166.7%, 42vh);
  }

  .routecard__art--lying .routecard__fig {
    height: min(110%, 26vh);
  }

  @supports (height: 1cqh) {
    .routecard__fig {
      height: min(calc(var(--band-min, 100cqh) * 1.667), 42vh, 90cqw);
    }

    .routecard__art--lying .routecard__fig {
      height: min(110cqh, 26vh, 44cqw);
    }
  }

  /* True ending: the memory verse fills the middle of the screen. */
  .play--memory .dock {
    max-width: none;
  }

  .panel--memory {
    width: min(150vh, 88vw);
    padding: 6vh 6vh 4.6vh;
    border-radius: 1.4vh;
  }

  .panel--memory .ref {
    font-size: 2.6vh;
  }

  /* Snip card. */
  .snip__card {
    width: min(112vh, 80vw);
    padding: 6.4vh 5vh 4vh;
    border-radius: 1.4vh;
  }

  .snip__cut {
    left: 3vh;
    right: 3vh;
    top: 3vh;
    border-top-width: 0.3vh;
  }

  .snip__scissors {
    font-size: 2.6vh;
  }

  .snip__stamp {
    margin: 1.2vh 0 2.6vh;
  }

  .snip__text {
    margin-bottom: 3.8vh;
    font-size: calc(3.2vh * var(--text-scale));
  }

  .snip__actions {
    grid-template-columns: 1fr 1fr;
    gap: 2vh;
  }

  [data-default="true"]:focus,
  .opt[data-kbd="true"]:focus {
    outline: var(--focus-w) solid var(--focus-light);
    outline-offset: 0.35vh;
    box-shadow: 0 0 0 1.1vh rgba(16, 15, 13, 0.75);
  }

  /* Story tree after a true ending: the words and buttons on the left, the tree on the right. */
  .treepage {
    display: grid;
    grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas:
      "head tree"
      "actions tree";
    column-gap: 4vw;
    row-gap: 3vh;
    height: 100%;
    min-height: 0;
    padding: calc(var(--safe-top) + 10vh) 5vw calc(var(--safe-bottom) + 5vh);
  }

  .treepage-head {
    grid-area: head;
    align-content: center;
    gap: 2.2vh;
  }

  .treepage-title {
    font-size: calc(6.4vh * var(--text-scale));
    line-height: 1.2;
  }

  .treepage-title .en {
    display: block;
    margin: 0.3em 0 0;
    font-size: 0.56em;
  }

  .treepage-route {
    font-size: calc(3.6vh * var(--text-scale));
  }

  .treepage-hint {
    font-size: 2.6vh;
    line-height: 1.5;
  }

  .treepage-tree {
    grid-area: tree;
    display: flex;
    min-height: 0;
  }

  .treepage-tree .tree {
    flex: 1;
  }

  /* The root name plate stays inside the card at every TV size, 4:3 included. */
  .treepage .tree {
    --level-h: 6.4vh;
    min-height: 0;
  }

  .treepage .tree__levels {
    min-height: 0;
  }

  .treepage-actions {
    grid-area: actions;
    gap: 1.6vh;
  }

  /* The three trees from the title screen, side by side. */
  .treespage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "head actions"
      "list list";
    column-gap: 3vw;
    row-gap: 2vh;
    height: 100%;
    min-height: 0;
    padding: calc(var(--safe-top) + 8.6vh) 2.4vw calc(var(--safe-bottom) + 2.6vh);
  }

  .treespage-head {
    grid-area: head;
    gap: 1vh;
    align-self: center;
  }

  .treespage .treepage-title {
    font-size: calc(4.6vh * var(--text-scale));
  }

  /* One line for the title, so the three trees keep the height. */
  .treespage .treepage-title .en {
    display: inline;
    margin: 0 0 0 0.5em;
    font-size: 0.62em;
  }

  .treespage .treepage-hint {
    font-size: 2.4vh;
  }

  .treespage-actions {
    grid-area: actions;
    align-self: center;
  }

  .treespage-actions .btn {
    min-width: 24vw;
    min-height: 7vh;
  }

  /* Wide cards: each tree's labels need about a third of the screen. */
  .treespage-list {
    grid-area: list;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.2vw;
    min-height: 0;
  }

  .tree {
    --trunk-w: 5.6vh;
    --stem-w: 6.6vh;
    --stem-h: 2.3vh;
    --level-h: 8vh;
    --tag-fs: 3vh;
    --tag-fs-en: 2.4vh;
    /* Nothing scrolls on a TV: the labels shrink to fit, never below the smallest TV text. */
    --tree-grow: 0;
    --tag-min: 2.2vh;
    padding: 2.4vh 2vw 2vh;
    border-radius: 1.2vh;
  }

  /* Three trees side by side must fit one screen with every branch seen: tighter wood, smaller tags
     (never below 2.2vh), short lines. */
  .tree--compact {
    --trunk-w: 3vh;
    --stem-w: 2.4vh;
    --stem-h: 1.4vh;
    --level-h: 5.6vh;
    --tag-fs: 2.4vh;
    --tag-fs-en: 2.2vh;
    padding: 1.6vh 0.6vw 1.4vh;
  }

  /* The ending's title and the name plate take one line each when they fit (the labels need the
     height); no text below 2.2vh. */
  .tree--compact .tree__goaltitle {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    column-gap: 0.45em;
    margin-bottom: 1.2vh;
    line-height: 1.2;
  }

  .tree--compact .tree__goaltitle .en {
    font-size: max(2.2vh, 0.82em);
  }

  .tree.tree--compact .tree__plate {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    column-gap: 0.5em;
    margin-top: 1vh;
    font-size: 2.6vh;
  }

  .tree.tree--compact .plate__en--stack {
    font-size: max(2.2vh, 0.86em);
  }

  .tree--compact .tree__star {
    width: calc(var(--trunk-w) * 1.6);
    height: calc(var(--trunk-w) * 1.6);
  }

  .tree--compact .branch__snip {
    margin: 0;
  }

  .tree--compact .branch__tag {
    padding: 0.2em 0.45em 0.24em;
    line-height: 1.16;
  }

  .tree__tip {
    height: 2.6vh;
  }

  .tree__base {
    height: 2.4vh;
  }

  .tree__ground {
    height: 1.4vh;
  }

  .tree .tree__plate {
    margin-top: 1.4vh;
  }

  .tree .plate__en--stack {
    display: block;
    font-size: 0.82em;
  }

  .tree .plate__en--stack::before {
    content: none;
  }

  .tree__side {
    gap: 1vh;
  }

  .branch__snip {
    margin: 0 0.4vh;
  }

  .settings {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.4vh);
    width: min(66vh, 60vw);
    padding: 2.6vh;
    border-radius: 1.2vh;
    font-size: 2.4vh;
  }

  .chip {
    min-height: 6.5vh;
    border-radius: 1vh;
  }

  .dialog {
    width: min(76vh, 90vw);
    padding: 4vh 4vh 3.4vh;
    border-radius: 1.6vh;
    font-size: 2.6vh;
  }

  .dialog__actions {
    grid-template-columns: 1fr 1fr;
    gap: 1.6vh;
  }

  .debug {
    font-size: 12px;
  }
}

/* 4:3 screens (projectors): tighter story trees, so the three fit without scrolling (with the web fonts;
   wider fallback fonts may still scroll a little). */
@media (min-aspect-ratio: 5/4) and (max-aspect-ratio: 3/2) and (min-width: 960px) and (min-height: 540px) {
  .tree--compact {
    --level-h: 4vh;
    --stem-w: 2vh;
    padding-left: 0.2vw;
    padding-right: 0.2vw;
  }

  /* A smaller fan of leaves, clear of the label columns beside the star. */
  .tree--compact .tree__crown {
    width: 280%;
    height: 195%;
  }

  .treespage {
    padding-top: calc(var(--safe-top) + 7vh);
    row-gap: 1.2vh;
  }

  .treespage-list {
    gap: 1.2vw;
  }
}

/* Short landscape phones and small windows: keep the phone layout readable. */
@media (max-height: 640px) and (orientation: portrait) {
  .title-head {
    padding-top: 6vh;
  }
  .title-main {
    font-size: clamp(38px, 11vw, 52px);
  }
  :root {
    --panel-min-h: 112px;
  }
}

/* ------------------------------------------------------------------ motion preferences */

/* Reduced motion: no typewriter (main.js), no shake, no sway or pulse; only short opacity
   fades remain. Transitions are switched off everywhere first, so no property (such as
   font-style) ever animates by accident, then the few intended fades are restored. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0s !important;
    transition: none !important;
  }
  .art__layer,
  .reply,
  .cast,
  .figure,
  .light,
  .light::after,
  .caption,
  .topbar {
    transition: opacity 150ms ease !important;
  }
  .stage[data-pov="lying"] .art__sway,
  .light[data-level="bright"],
  .stage.is-rising .art {
    animation: none !important;
  }
  .echo mark {
    background-size: 100% 100%;
  }
}

/* ?test=1: no transitions and no animation time at all, so every screen settles at once. */
html.is-test *,
html.is-test *::before,
html.is-test *::after {
  transition: none !important;
  animation-duration: 0s !important;
  animation-delay: 0s !important;
  animation-iteration-count: 1 !important;
}

html.is-test .echo mark {
  background-size: 100% 100%;
}

<script>/* data/routes/scribe.js */

(function () {
  var BHS = (window.BHS = window.BHS || {});

  BHS.routes.scribe = {
